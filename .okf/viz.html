<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'unsafe-inline'; img-src data: https:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>OKF Bundle Viewer</title>
  <script src="https://cdn.jsdelivr.net/npm/3d-force-graph@1.80.0/dist/3d-force-graph.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <style>
:root {
  color-scheme: light;
  --paper: #f1f4f2;
  --surface: #ffffff;
  --sunken: #e7ecea;
  --ink: #172229;
  --muted: #61706f;
  --line: #d5dedb;
  --field: #b6c2be;
  --graph-bg: #e9eeec;
  --label-ink: #1d2a30;
  --label-halo: rgba(255, 255, 255, 0.9);
  --edge: #8fa3a0;
  --accent: #087f8c;
  --accent-soft: rgba(8, 127, 140, 0.16);
  --link: #10627f;
  --moss: #3a6b35;
  --magenta: #a23b72;
  --amber: #8a5310;
  --danger: #b5413e;
  --overlay: rgba(255, 255, 255, 0.9);
  --node-lightness-floor: 0;
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #121a1e;
  --surface: #18232a;
  --sunken: #101a1f;
  --ink: #e6edea;
  --muted: #93a5a3;
  --line: #26343b;
  --field: #3a4b52;
  --graph-bg: #0e161a;
  --label-ink: #dfe9e6;
  --label-halo: rgba(6, 12, 15, 0.92);
  --edge: #4a5f64;
  --accent: #3fb2bd;
  --accent-soft: rgba(63, 178, 189, 0.2);
  --link: #6cc0dc;
  --moss: #7fbb6f;
  --magenta: #e08bb4;
  --amber: #e2a44f;
  --danger: #ef8b83;
  --overlay: rgba(16, 26, 31, 0.86);
}

* { box-sizing: border-box; }

html { height: 100%; }

body {
  background: var(--paper);
  color: var(--ink);
  display: grid;
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 14px;
  grid-template-rows: auto minmax(0, 1fr);
  height: 100vh;
  height: 100dvh;
  letter-spacing: 0;
  margin: 0;
  overflow: hidden;
}

button, input, select { color: var(--ink); font: inherit; letter-spacing: 0; }

.app-header {
  align-items: flex-end;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  display: flex;
  flex-wrap: wrap;
  gap: 10px 22px;
  justify-content: space-between;
  padding: 10px 16px;
}

.identity { flex: 0 1 auto; min-width: 0; }

.identity strong {
  display: block;
  font-size: 17px;
  line-height: 1.2;
  overflow-wrap: anywhere;
}

.identity span, .control > span, .graph-overlay-top { color: var(--muted); font-size: 11px; line-height: 1.25; }

.controls {
  align-items: flex-end;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: flex-end;
}

.control { display: grid; gap: 3px; min-width: 112px; }
.control-search { min-width: 196px; }

.control input, .control select {
  background: var(--surface);
  border: 1px solid var(--field);
  border-radius: 5px;
  height: 34px;
  min-width: 0;
  padding: 6px 9px;
  width: 100%;
}

.segmented {
  background: var(--sunken);
  border: 1px solid var(--field);
  border-radius: 6px;
  display: inline-flex;
  gap: 2px;
  height: 34px;
  padding: 2px;
}

.segmented button {
  align-items: center;
  background: transparent;
  border: 0;
  border-radius: 4px;
  color: var(--muted);
  cursor: pointer;
  display: inline-flex;
  height: 28px;
  justify-content: center;
  padding: 0;
  position: relative;
  width: 32px;
}

.segmented button:hover { color: var(--ink); }
.segmented button[aria-pressed="true"] { background: var(--surface); color: var(--ink); }
.segmented svg { height: 15px; width: 15px; }

.icon-button {
  align-items: center;
  background: var(--surface);
  border: 1px solid var(--field);
  border-radius: 6px;
  color: var(--ink);
  cursor: pointer;
  display: inline-flex;
  flex: 0 0 auto;
  height: 32px;
  justify-content: center;
  padding: 0;
  position: relative;
  width: 32px;
}

.icon-button svg { height: 16px; width: 16px; }
.icon-button:hover { background: var(--sunken); }
.icon-button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

[data-tooltip]::after {
  background: var(--ink);
  border-radius: 4px;
  bottom: calc(100% + 6px);
  color: var(--surface);
  content: attr(data-tooltip);
  font-size: 11px;
  left: 50%;
  line-height: 1.3;
  opacity: 0;
  padding: 3px 7px;
  pointer-events: none;
  position: absolute;
  transform: translateX(-50%);
  transition: opacity 120ms ease;
  white-space: nowrap;
  z-index: 6;
}

[data-tooltip]:hover::after, [data-tooltip]:focus-visible::after { opacity: 1; }
.graph-tools .icon-button:first-child::after { left: 0; transform: none; }
.graph-tools .icon-button:last-child::after { left: auto; right: 0; transform: none; }
.segmented button:last-child::after { left: auto; right: 0; transform: none; }

button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible, .graph-panel:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 2px;
}

main {
  display: grid;
  grid-template-columns: minmax(0, 3fr) minmax(330px, 2fr);
  min-height: 0;
}

.graph-panel {
  background: var(--graph-bg);
  border-right: 1px solid var(--line);
  min-height: 0;
  overflow: hidden;
  position: relative;
}

#graph { inset: 0; position: absolute; touch-action: none; }
#graph canvas { display: block; outline: none; }

#graph-labels { inset: 0; overflow: hidden; pointer-events: none; position: absolute; z-index: 1; }

.node-label {
  color: var(--label-ink);
  font-size: 11px;
  left: 0;
  line-height: 1.25;
  max-width: 168px;
  overflow: hidden;
  position: absolute;
  text-overflow: ellipsis;
  text-shadow:
    0 1px 0 var(--label-halo),
    0 -1px 0 var(--label-halo),
    1px 0 0 var(--label-halo),
    -1px 0 0 var(--label-halo);
  top: 0;
  white-space: nowrap;
  will-change: transform;
}

.node-label.is-active { font-weight: 700; }

.graph-overlay {
  display: flex;
  gap: 12px;
  left: 12px;
  pointer-events: none;
  position: absolute;
  right: 12px;
  z-index: 2;
}

.graph-overlay > * { pointer-events: auto; }
.graph-overlay-top { align-items: flex-start; justify-content: space-between; top: 10px; }
.graph-overlay-bottom { align-items: flex-end; bottom: 12px; justify-content: space-between; }

#viewer-status { color: var(--muted); text-align: right; }

.legend { display: flex; flex-wrap: wrap; gap: 5px; max-width: 60%; }

.legend-chip {
  align-items: center;
  background: var(--overlay);
  border: 1px solid var(--line);
  border-radius: 4px;
  color: var(--ink);
  cursor: pointer;
  display: inline-flex;
  font-size: 11px;
  gap: 5px;
  line-height: 1.4;
  max-width: 190px;
  padding: 3px 7px;
}

.legend-chip:hover { border-color: var(--field); }
.legend-chip[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.legend-chip span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.legend-swatch { border-radius: 50%; flex: 0 0 auto; height: 10px; width: 10px; }

.graph-tools {
  background: var(--overlay);
  border-radius: 7px;
  display: flex;
  gap: 4px;
  padding: 3px;
}

#graph-tooltip {
  background: var(--ink);
  border-radius: 5px;
  color: var(--surface);
  display: grid;
  gap: 1px;
  left: 0;
  max-width: 230px;
  padding: 5px 8px;
  pointer-events: none;
  position: absolute;
  top: 0;
  z-index: 4;
}

#graph-tooltip strong { font-size: 12px; line-height: 1.3; }
#graph-tooltip span { font-size: 11px; line-height: 1.3; opacity: 0.75; }
#graph-tooltip[hidden] { display: none; }

#graph-fallback {
  color: var(--muted);
  display: grid;
  gap: 6px;
  inset: 0;
  place-content: center;
  position: absolute;
  text-align: center;
  z-index: 3;
}

#graph-fallback[hidden] { display: none; }

#detail {
  background: var(--paper);
  min-width: 0;
  overflow-y: auto;
  padding: 20px 24px 40px;
}

#detail-empty { color: var(--muted); margin: 44px auto; max-width: 300px; text-align: center; }
#detail-empty strong { color: var(--ink); }
#detail-empty p { line-height: 1.5; margin: 6px 0 0; }

.detail-heading { border-bottom: 1px solid var(--line); padding-bottom: 14px; }

.detail-heading-row {
  align-items: center;
  display: flex;
  gap: 10px;
  justify-content: space-between;
  min-height: 32px;
}

.detail-heading h1 {
  font-family: Georgia, "Times New Roman", serif;
  font-size: 23px;
  font-weight: 600;
  line-height: 1.2;
  margin: 6px 0 4px;
  overflow-wrap: anywhere;
}

.detail-heading code, #detail-body code {
  font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
}

.detail-heading code { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }

.type-chip, .badge, .tag { border-radius: 4px; display: inline-block; font-size: 11px; line-height: 1.4; padding: 2px 7px; }

.type-chip {
  color: #ffffff;
  font-weight: 700;
  max-width: calc(100% - 44px);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.badges { display: flex; flex-wrap: wrap; gap: 6px; margin: 13px 0; }

.badge { background: var(--surface); border: 1px solid var(--line); }
.badge.status-stable, .badge.fresh { border-color: var(--moss); color: var(--moss); }
.badge.status-draft { border-color: var(--amber); color: var(--amber); }
.badge.status-deprecated { color: var(--muted); text-decoration: line-through; }
.badge.trust-machine-confirmed { border-color: var(--accent); color: var(--accent); }
.badge.trust-human-reviewed { border-color: var(--magenta); color: var(--magenta); }
.badge.stale { border-color: var(--danger); color: var(--danger); }

.frontmatter { display: grid; gap: 8px 14px; grid-template-columns: 92px minmax(0, 1fr); margin: 0; }
.frontmatter dt { color: var(--muted); font-size: 12px; }
.frontmatter dd { line-height: 1.45; margin: 0; min-width: 0; overflow-wrap: anywhere; }
.frontmatter a, #detail-body a, .relations-group button { color: var(--link); }

.tag { background: var(--sunken); }

.sources-list, .relations-group ul { margin: 0; padding-left: 18px; }
.sources-list li, .relations-group li { margin: 3px 0; }

.fn-ref { font-size: 10px; line-height: 1; margin-left: 1px; }
.fn-ref a { text-decoration: none; }
.fn-list {
  border-top: 1px solid var(--line);
  color: var(--muted);
  font-size: 12px;
  margin: 16px 0 0;
  padding: 12px 0 0 18px;
}
.fn-list li { margin: 4px 0; overflow-wrap: anywhere; }
.fn-list li:target { color: var(--accent); }

.body-section { border-top: 1px solid var(--line); margin-top: 18px; padding-top: 14px; }

#detail-body { font-size: 13px; line-height: 1.58; overflow-wrap: anywhere; }
#detail-body h1 { font-size: 18px; margin: 18px 0 7px; }
#detail-body h2 { font-size: 15px; margin: 16px 0 6px; }
#detail-body h3 { font-size: 13px; margin: 14px 0 5px; }
#detail-body p { margin: 7px 0; }
#detail-body img { height: auto; max-width: 100%; }
#detail-body pre {
  background: var(--sunken);
  border: 1px solid var(--line);
  border-radius: 6px;
  overflow-x: auto;
  padding: 11px 13px;
}
#detail-body :not(pre) > code { background: var(--sunken); border-radius: 3px; padding: 1px 4px; }
#detail-body table { border-collapse: collapse; display: block; max-width: 100%; overflow-x: auto; }
#detail-body th, #detail-body td { border: 1px solid var(--line); padding: 5px 8px; }
#detail-body blockquote {
  border-left: 3px solid var(--line);
  color: var(--muted);
  margin: 8px 0;
  padding: 2px 0 2px 12px;
}

#detail-relations { border-top: 1px solid var(--line); display: grid; gap: 14px; margin-top: 20px; padding-top: 14px; }
.relations-group h2 { font-size: 13px; margin: 0 0 7px; }
.relations-group button { background: transparent; border: 0; cursor: pointer; padding: 0; text-align: left; }

@media (max-width: 1024px) {
  body { height: auto; min-height: 100vh; min-height: 100dvh; overflow: visible; }
  main { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto; }
  .graph-panel {
    border-bottom: 1px solid var(--line);
    border-right: 0;
    height: clamp(300px, 46dvh, 470px);
  }
  #detail { overflow: visible; padding: 18px 18px 36px; }
}

@media (max-width: 760px) {
  .app-header { align-items: stretch; flex-direction: column; gap: 10px; }
  .controls { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .control, .control-search { min-width: 0; }
  .control-search { grid-column: 1 / -1; }
  .control-theme { align-items: end; display: flex; justify-content: flex-end; }
  .legend { display: none; }
  .frontmatter { gap: 2px; grid-template-columns: minmax(0, 1fr); }
  .frontmatter dt { margin-top: 6px; }
  .frontmatter dd { margin-bottom: 6px; }
}

@media (max-width: 420px) {
  .detail-heading h1 { font-size: 20px; }
  .node-label { max-width: 120px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    scroll-behavior: auto !important;
    transition-duration: 0.001ms !important;
  }
}

  </style>
</head>
<body>
  <header class="app-header">
    <div class="identity">
      <strong id="bundle-name"></strong>
      <span>OKF knowledge graph</span>
    </div>
    <div class="controls" role="group" aria-label="Graph controls">
      <label class="control control-search">
        <span>Search</span>
        <input id="search" type="search" placeholder="Title, ID, or tag" autocomplete="off">
      </label>
      <label class="control">
        <span>Type</span>
        <select id="filter-type">
          <option value="">All types</option>
        </select>
      </label>
      <label class="control">
        <span>Concept</span>
        <select id="concept-picker">
          <option value="">Select concept</option>
        </select>
      </label>
      <label class="control">
        <span>Layout</span>
        <select id="layout">
          <option value="force">Force</option>
          <option value="td">Top-down</option>
          <option value="lr">Left to right</option>
          <option value="radialout">Radial</option>
        </select>
      </label>
      <div class="control control-theme">
        <div class="segmented" role="group" aria-label="Color theme">
          <button id="theme-auto" type="button" aria-pressed="true" aria-label="Match system theme" data-tooltip="System theme">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="2" y="3" width="20" height="14" rx="2"></rect><path d="M8 21h8"></path><path d="M12 17v4"></path></svg>
          </button>
          <button id="theme-light" type="button" aria-pressed="false" aria-label="Light theme" data-tooltip="Light">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2"></path><path d="M12 20v2"></path><path d="m4.93 4.93 1.41 1.41"></path><path d="m17.66 17.66 1.41 1.41"></path><path d="M2 12h2"></path><path d="M20 12h2"></path><path d="m6.34 17.66-1.41 1.41"></path><path d="m19.07 4.93-1.41 1.41"></path></svg>
          </button>
          <button id="theme-dark" type="button" aria-pressed="false" aria-label="Dark theme" data-tooltip="Dark">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg>
          </button>
        </div>
      </div>
    </div>
  </header>

  <main>
    <section class="graph-panel" tabindex="0" aria-label="Concept relationship graph">
      <div id="graph"></div>
      <div id="graph-labels" aria-hidden="true"></div>
      <div class="graph-overlay graph-overlay-top">
        <span id="graph-count"></span>
        <span id="viewer-status" role="status" aria-live="polite"></span>
      </div>
      <div class="graph-overlay graph-overlay-bottom">
        <div id="graph-legend" class="legend" role="group" aria-label="Filter by concept type"></div>
        <div class="graph-tools">
          <button id="zoom-in" class="icon-button" type="button" aria-label="Zoom in" data-tooltip="Zoom in">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path><path d="M11 8v6"></path><path d="M8 11h6"></path></svg>
          </button>
          <button id="zoom-out" class="icon-button" type="button" aria-label="Zoom out" data-tooltip="Zoom out">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path><path d="M8 11h6"></path></svg>
          </button>
          <button id="fit-view" class="icon-button" type="button" aria-label="Fit graph to view" data-tooltip="Fit graph">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M8 3H5a2 2 0 0 0-2 2v3"></path><path d="M21 8V5a2 2 0 0 0-2-2h-3"></path><path d="M3 16v3a2 2 0 0 0 2 2h3"></path><path d="M16 21h3a2 2 0 0 0 2-2v-3"></path></svg>
          </button>
          <button id="toggle-labels" class="icon-button" type="button" aria-pressed="true" aria-label="Show concept labels" data-tooltip="Labels">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 7V5a1 1 0 0 1 1-1h14a1 1 0 0 1 1 1v2"></path><path d="M9 20h6"></path><path d="M12 4v16"></path></svg>
          </button>
          <button id="toggle-spin" class="icon-button" type="button" aria-pressed="false" aria-label="Auto-rotate the scene" data-tooltip="Auto-rotate">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9"></circle><ellipse cx="12" cy="12" rx="9" ry="4"></ellipse><path d="M12 3v18"></path></svg>
          </button>
          <button id="reset" class="icon-button" type="button" aria-label="Clear filters and reset view" data-tooltip="Clear filters">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>
          </button>
        </div>
      </div>
      <div id="graph-tooltip" role="presentation" hidden></div>
      <div id="graph-fallback" hidden>
        <strong>The 3D graph could not start</strong>
        <span id="graph-fallback-reason"></span>
      </div>
      <noscript>This viewer requires JavaScript.</noscript>
    </section>

    <aside id="detail" aria-label="Selected concept details">
      <div id="detail-empty">
        <strong>No concept selected</strong>
        <p>Choose a graph node or concept from the toolbar.</p>
      </div>
      <article id="detail-content" hidden tabindex="-1">
        <header class="detail-heading">
          <div class="detail-heading-row">
            <span class="type-chip" id="detail-type"></span>
            <button id="focus-node" class="icon-button" type="button" aria-label="Center this concept in the graph" data-tooltip="Center in graph">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="8"></circle><path d="M12 2v3"></path><path d="M12 19v3"></path><path d="M2 12h3"></path><path d="M19 12h3"></path></svg>
            </button>
          </div>
          <h1 id="detail-title"></h1>
          <code id="detail-id"></code>
        </header>
        <div class="badges" id="detail-badges"></div>
        <dl class="frontmatter">
          <dt>Description</dt><dd id="detail-description"></dd>
          <dt>Resource</dt><dd id="detail-resource"></dd>
          <dt>Tags</dt><dd id="detail-tags"></dd>
          <dt>Generated</dt><dd id="detail-generated"></dd>
          <dt>Verified</dt><dd id="detail-verified"></dd>
          <dt>Sources</dt><dd id="detail-sources"></dd>
        </dl>
        <section class="body-section" aria-label="Concept content">
          <div id="detail-body"></div>
        </section>
        <section id="detail-relations" hidden>
          <div class="relations-group" id="detail-links-group" hidden>
            <h2>Links to</h2>
            <ul id="links-list"></ul>
          </div>
          <div class="relations-group" id="detail-backlinks" hidden>
            <h2>Cited by</h2>
            <ul id="backlinks-list"></ul>
          </div>
        </section>
      </article>
    </aside>

  <script>
window.BUNDLE_NAME = "YCoding";
window.BUNDLE = {"bodies":{"architecture":"## Dependency Direction\n\nDependencies flow from Schema to Core and Protocol, then from Core and Protocol to Server, then to Client, CLI, and TUI. UI provides primitives to TUI. AI and plugin packages are consumed by Core.[^arch-doc]\n\n- **packages/schema** owns browser-safe branded IDs, public domain records, durable event payloads, and shared validation.[^arch-doc]\n- **packages/protocol** owns the public Effect `HttpApi` operation groups, transport schemas, middleware declarations, and OpenAPI assembly inputs.[^arch-doc]\n- **packages/core** owns session execution, instructions, permissions, filesystem, providers, configuration, subagent orchestration, project-artifact storage, and database schema.[^arch-doc]\n- **packages/server** maps Protocol operations to Core services and owns process lifecycle.[^arch-doc]\n- **packages/client** consumes the assembled Protocol implementing generated and handwritten API clients.[^arch-doc]\n- **packages/cli** owns the `ycoding` executable, command parsing, local-service discovery, and TUI startup.[^arch-doc]\n- **packages/tui** owns presentation and interaction, never canonical durable state.[^arch-doc]\n- **packages/ai** implements provider request lowering and response normalization across OpenAI, Anthropic, compatible-provider, and media protocols.[^arch-doc]\n- **packages/plugin** owns Effect and Promise plugin contracts, hooks, tools, and session extensions.[^arch-doc]\n\n## State Scopes\n\nState is scoped to process-global, Location, Session durable, Project durable, Global durable, and UI resident.[^arch-doc] Process-local coordinators optimize execution but cannot become the sole owner of user-visible state.[^readme]\n\n## Runtime Flow\n\nTerminal input flows through Client request, Protocol operation, Server handler, Location resolution, Core service, permission and guardrail mediation, durable admission, process-local execution wake, provider request through AI, durable events and projections, event feed, canonical Client reads, bounded TUI read model, and terminal render.[^arch-doc]\n\n## Workspace Boundary\n\nThe active package set is explicit and enforced by `script/ycoding-workspace.ts`.[^arch-doc] Desktop, browser, console, website, and legacy SDK packages are outside the product boundary and must not be restored.[^contributing]\n\n## Authority Order\n\nWhen sources disagree, the order is: executable behavior and tests, Schema public shapes, Protocol operations, Core runtime behavior, `docs` documentation and `specs/v2` contracts, package AGENTS.md, generated clients, and upstream material last.[^agents]\n\n## Related Concepts\n\n- [Session Execution and Autonomy](./session.md) — sessions are the durable execution unit owned by Core\n- [Session Guardrails](./session-guardrails.md) — guardrails mediate session shell and mutation actions\n- [Durable Background Subagents](./subagents.md) — subagents are durable child sessions orchestrated by Core\n- [Project Artifacts and Customization](./project-artifacts.md) — artifact storage lives in Core\n- [Provider Integration and Cache](./provider-integration.md) — provider request lowering is owned by packages/ai\n- [Coding Conventions](./repository-preference.md) — architecture authority order and package boundaries\n\n[^arch-doc]: repo:///docs/architecture.md\n[^readme]: repo:///README.md\n[^contributing]: repo:///CONTRIBUTING.md\n[^agents]: repo:///AGENTS.md","project-artifacts":"## Supported Kinds\n\nProject artifacts support `skill`, `command`, `agent`, and `plugin` kinds. Scopes are `project` and `global`.[^runtime-doc]\n\n## Lifecycle Stages\n\nValidated lifecycle stages are `trial`, `active`, `degraded`, `disabled`, and `quarantine` with tested transition rules.[^runtime-doc]\n\n## Mutation Rules\n\nArtifact mutations must use the validated store lifecycle, revisions, digests, preview/confirmation tokens, provenance, and version transitions. The system does not write directly into adapter-owned source directories.[^runtime-doc]\n\n## Session Skill Status\n\nSession skill status derives from durable messages and current instruction keys. No second independent skill-status authority is stored. Agent switch and completed compaction deactivate prior skills with explicit reasons. Active conflicts are computed against active skills and instruction declarations.[^runtime-doc]\n\n## Related Concepts\n\n- [Session Execution and Autonomy](./session.md) — session skills derive from durable messages and instruction keys\n- [Package Architecture](./architecture.md) — artifact storage lives in Core\n- [Coding Conventions](./repository-preference.md) — artifact conventions follow repository standards\n\n[^runtime-doc]: repo:///docs/runtime.md","provider-integration":"## Provider Request Lowering\n\n`packages/ai` owns provider request lowering and response normalization across OpenAI, Anthropic, compatible-provider protocols, reasoning, tool calls, media, prompt-cache controls, and normalized usage telemetry. Core chooses policy and context; AI translates into provider wire formats.[^arch-doc]\n\n## Prompt Caching\n\nSeparate provider prompt caching, TUI cache diagnostics, project-artifact reuse, and provider quota reporting. Missing provider cache telemetry means unreported, not zero. Cache optimization must not swallow provider errors, change tool semantics, or trade correctness for hit rate.[^runtime-doc]\n\n## Usage Reporting\n\nProvider-usage refresh is read-only and best effort. It must never block Session startup or model execution. Unknown quota values are absent and render as unreported; never coerce them to zero. Never expose provider credentials, credential IDs, account emails, arbitrary response headers, or raw usage payloads through Protocol, logs, events, or TUI state.[^runtime-doc]\n\n## Model-Family Wire Fields\n\nGPT-5.6+ uses explicit prompt-cache options and breakpoints; pre-5.6 requests use compatible retention fields. Anthropic cache-control placement is preserved across direct and compatible provider routes.[^runtime-doc]\n\n## Related Concepts\n\n- [Package Architecture](./architecture.md) — provider request lowering is owned by packages/ai\n- [Session Execution and Autonomy](./session.md) — provider requests execute during session steps\n\n[^arch-doc]: repo:///docs/architecture.md\n[^runtime-doc]: repo:///docs/runtime.md","repository-preference":"## TypeScript Conventions\n\n- Avoid `any` type. Rely on type inference. Use explicit annotations for exports and clarity.[^agents]\n- Use Bun APIs when possible, such as `Bun.file()`.[^agents]\n- Prefer functional array methods (`flatMap`, `filter`, `map`) over loops. Use type guards on filters to preserve downstream inference.[^agents]\n- In Effect generators, bind services to named variables before calling methods. Do not use nested service yields such as `yield* (yield* Foo.Service).bar()`.[^agents]\n\n## Imports\n\n- Never alias imports. No `import { foo as bar }`. No star imports (`import * as Foo`). Import module exported namespaces by name when needed.[^agents]\n- Prefer dynamic imports for heavy modules used only in selected paths. Destructure near the top of the narrowest scope. Avoid inline chains or `.then()`.[^agents]\n\n## Variables and Control Flow\n\n- Prefer `const` over `let`. Use ternaries or early returns instead of reassignment. Avoid `else`; use early returns.[^agents]\n\n## Testing\n\n- Use test-driven development for behavior changes: write focused regression test, observe failure, implement smallest fix, rerun targeted suites.[^agents]\n- Avoid mocks as much as possible. Do not use `globalThis.*` unless no realistic alternative exists.[^agents]\n- Test actual implementation behavior; do not duplicate production logic in tests.[^agents]\n\n## Branch Names and Commits\n\n- Use short branch names of at most three words separated by hyphens. No slashes or type prefixes (`feat/`).[^agents]\n- Use conventional commit-style messages: `type(scope): summary`. Valid types: `feat`, `fix`, `docs`, `chore`, `refactor`, `test`.[^agents]\n\n## Linting and Patterns\n\n- Enforced by oxlint (`@oxlintrc.json`) and ast-grep rules for: no drizzle column name, no effect die string, no import alias, no JSON parse cast, no nested Effect service yield, no star import.[^ast-grep]\n\n## Related Concepts\n\n- [Package Architecture](./architecture.md) — authority order and package boundaries\n- [Project Artifacts](./project-artifacts.md) — artifact conventions follow repository standards\n\n[^agents]: repo:///AGENTS.md\n[^ast-grep]: repo:///script/ast-grep/sgconfig.yml","session":"## Durable Admission\n\nA prompt is durably admitted before execution is scheduled. The durable pending row represents unconsumed work only. Promotion into the visible transcript occurs at a safe execution boundary.[^runtime-doc]\n\nReusing a Session ID adopts the existing session. Reusing a prompt message ID is accepted only for an exact retry with matching session, content, and delivery mode; conflicting reuse fails.[^runtime-doc]\n\n## Execution Ownership\n\n`SessionExecution` is process-global and keyed by Session ID. It uses a process-local coordinator to serialize drains for the same session, join explicit same-session resumes, coalesce advisory wakes, and allow different sessions to execute concurrently.[^runtime-doc]\n\nA drain discovers the session's Location when execution starts. Clustered execution ownership is not yet implemented.[^runtime-doc]\n\n## Steps and Provider Attempts\n\nOne step is one logical LLM call with one physical provider attempt. Context-overflow recovery may compact and rebuild the step for one additional attempt. The runtime reloads projected history before durable continuation.[^runtime-doc]\n\n## Prompt Delivery\n\n- **Steer** inputs promote at the next safe step boundary and require the active drain to continue.\n- **Queue** inputs remain pending until the session would otherwise become idle.\n- Promoting new user input resets the selected agent's step allowance.[^runtime-doc]\n\n## Autonomy Modes\n\nThree explicit modes are supported: `normal` (standard interactive), `yolo` (autonomous under permission policy), and `goal` (repeated continuation toward a durable goal). Goal state stores the goal text, status, iteration, no-progress count, maximum no-progress count, and last progress digest.[^runtime-doc]\n\nTerminal goal states are `completed`, `stopped`, and `exhausted`. A tool-only turn with no assistant text spends an iteration but does not increment the no-progress counter.[^runtime-doc]\n\n## TUI Transcript History\n\nThe hot transcript window holds the latest 50 completed messages plus every active or incomplete boundary. Archive page requests use `MESSAGE_PAGE_LIMIT` of 1000. Archived messages render through the same typed transcript components when expanded, and collapsed placeholders retain cursor and page metadata but no transcript payload.[^product-dir]\n\n## Related Concepts\n\n- [Package Architecture](./architecture.md) — session execution is owned by Core, part of the package architecture\n- [Session Guardrails](./session-guardrails.md) — guardrails mediate session shell and mutation actions\n- [Durable Background Subagents](./subagents.md) — subagents are durable child sessions\n- [Provider Integration and Cache](./provider-integration.md) — provider requests execute during session steps\n- [Project Artifacts](./project-artifacts.md) — session skills derive from project artifacts\n\n[^runtime-doc]: repo:///docs/runtime.md\n[^product-dir]: repo:///docs/product-direction.md","session-guardrails":"## Independence from Permissions\n\nSession guardrails are a root-Session-family safety boundary independent of agent permissions and autonomy mode. Permission approval does not bypass guardrails, and guardrail approval does not widen an agent permission denial.[^runtime-doc]\n\n## Mediation Scope\n\nGuardrails mediate direct Session shell, tool shell, edit, write, patch, subagent launch, mutation-capable MCP tools, and project-artifact mutation.[^runtime-doc]\n\n## Review Behavior\n\n- Recognized catastrophic shell commands are denied before process creation.\n- Recognized high-impact shell and mutation actions create a distinct human review.\n- Guardrail reviews remain reviews in `normal`, `yolo`, and `goal` modes and are not affected by TUI permission auto-approve.\n- Running shell, running subagent, and pending review caps are shared by the root Session family and release on settlement or interruption.[^runtime-doc]\n\n## Custom Rules\n\nCustom rules load from the global YCoding config `guardrails` directory. Malformed enabled custom files produce a visible invalid-file count and fail closed with review for mutation actions.[^runtime-doc]\n\n## Rehydration\n\nPending reviews rehydrate through the canonical Session guardrail API and live events, including reviews initiated by child Sessions.[^runtime-doc]\n\n## Location Scope\n\n`SessionGuardrail` is Location-scoped but evaluates by Session ID. It resolves the root Session through `SessionStore`, shares counters across that family, and mediates mutation immediately before side effects.[^arch-doc]\n\n## Related Concepts\n\n- [Session Execution and Autonomy](./session.md) — guardrails mediate session shell and mutation actions\n- [Durable Background Subagents](./subagents.md) — guardrails apply to child session actions\n- [Package Architecture](./architecture.md) — guardrails are Location-scoped\n\n[^runtime-doc]: repo:///docs/runtime.md\n[^arch-doc]: repo:///docs/architecture.md","subagents":"## Durable Child Sessions\n\nSubagents are durable child sessions and always launch in the background. Parent sessions receive lifecycle updates and can inspect child state after reconnect or restart.[^runtime-doc]\n\n## Ownership and Nesting\n\nOrchestration preserves explicit agent selection, bounded nesting, permission ceilings, and parent-child ownership. In-memory task lists are not a substitute for durable orchestration.[^product-dir]\n\n## Rehydration\n\nTUI subagent indicators must rehydrate from durable state after reconnect or restart. Requiring the user to enter each child session to rebuild counts is a defect.[^agents]\n\n## Lifecycle Communication\n\nParent sessions receive lifecycle updates from child subagents. Children report progress back to their parent session while maintaining durable execution state.[^runtime-doc]\n\n## Related Concepts\n\n- [Session Execution and Autonomy](./session.md) — subagents are durable child sessions\n- [Session Guardrails](./session-guardrails.md) — guardrails mediate child session actions\n- [Package Architecture](./architecture.md) — subagent orchestration is owned by Core\n\n[^runtime-doc]: repo:///docs/runtime.md\n[^product-dir]: repo:///docs/product-direction.md\n[^agents]: repo:///AGENTS.md"},"edges":[{"data":{"id":"edge-1","source":"architecture","target":"session"}},{"data":{"id":"edge-2","source":"architecture","target":"session-guardrails"}},{"data":{"id":"edge-3","source":"architecture","target":"subagents"}},{"data":{"id":"edge-4","source":"architecture","target":"project-artifacts"}},{"data":{"id":"edge-5","source":"architecture","target":"provider-integration"}},{"data":{"id":"edge-6","source":"architecture","target":"repository-preference"}},{"data":{"id":"edge-7","source":"project-artifacts","target":"session"}},{"data":{"id":"edge-8","source":"project-artifacts","target":"architecture"}},{"data":{"id":"edge-9","source":"project-artifacts","target":"repository-preference"}},{"data":{"id":"edge-10","source":"provider-integration","target":"architecture"}},{"data":{"id":"edge-11","source":"provider-integration","target":"session"}},{"data":{"id":"edge-12","source":"repository-preference","target":"architecture"}},{"data":{"id":"edge-13","source":"repository-preference","target":"project-artifacts"}},{"data":{"id":"edge-14","source":"session-guardrails","target":"session"}},{"data":{"id":"edge-15","source":"session-guardrails","target":"subagents"}},{"data":{"id":"edge-16","source":"session-guardrails","target":"architecture"}},{"data":{"id":"edge-17","source":"session","target":"architecture"}},{"data":{"id":"edge-18","source":"session","target":"session-guardrails"}},{"data":{"id":"edge-19","source":"session","target":"subagents"}},{"data":{"id":"edge-20","source":"session","target":"provider-integration"}},{"data":{"id":"edge-21","source":"session","target":"project-artifacts"}},{"data":{"id":"edge-22","source":"subagents","target":"session"}},{"data":{"id":"edge-23","source":"subagents","target":"session-guardrails"}},{"data":{"id":"edge-24","source":"subagents","target":"architecture"}}],"nodes":[{"data":{"color":"#087f8c","description":"The YCoding repository enforces explicit package boundaries, directed dependencies, and state scopes driven by a TUI-only product identity.","generated":{},"id":"architecture","label":"Package Architecture and Dependency Direction","resource":"","size":46,"sources":[{"id":"arch-doc","resource":"repo:///docs/architecture.md"},{"id":"readme","resource":"repo:///README.md"},{"id":"contributing","resource":"repo:///CONTRIBUTING.md"},{"id":"agents","resource":"repo:///AGENTS.md"}],"stale":false,"stale_after":"","status":"stable","tags":["packages","dependency","boundaries","state-scope"],"trust_tier":"unverified","type":"Architecture","verified":[]}},{"data":{"color":"#9a5b12","description":"Project artifacts are the managed customization system for skills, commands, agents, and plugin drafts with validated lifecycle, provenance, and rollback.","generated":{},"id":"project-artifacts","label":"Project Artifacts and Customization","resource":"","size":36,"sources":[{"id":"product-dir","resource":"repo:///docs/product-direction.md"},{"id":"runtime-doc","resource":"repo:///docs/runtime.md"},{"id":"spec-v2","resource":"repo:///specs/v2/catalog-config-plugin-lifecycle.md"},{"id":"readme","resource":"repo:///README.   <script>
(function () {
  "use strict";

  const bundle = window.BUNDLE;
  const bundleName = window.BUNDLE_NAME;
  const root = document.documentElement;
  const byId = (id) => document.getElementById(id);

  const panel = document.querySelector(".graph-panel");
  const container = byId("graph");
  const labelLayer = byId("graph-labels");
  const tooltip = byId("graph-tooltip");
  const fallback = byId("graph-fallback");
  const statusText = byId("viewer-status");
  const countText = byId("graph-count");
  const typeSelect = byId("filter-type");
  const conceptPicker = byId("concept-picker");
  const layoutSelect = byId("layout");
  const legend = byId("graph-legend");
  const search = byId("search");

  const motionQuery = window.matchMedia("(prefers-reduced-motion: reduce)");
  const darkQuery = window.matchMedia("(prefers-color-scheme: dark)");
  const THEME_KEY = "okf-viewer-theme";
  const LABEL_BUDGET = 140;

  const nodes = bundle.nodes.map((entry) => Object.assign({}, entry.data));
  const links = bundle.edges.map((entry) => ({
    id: entry.data.id,
    source: entry.data.source,
    target: entry.data.target,
  }));
  const nodeById = new Map(nodes.map((node) => [node.id, node]));
  const outgoing = new Map();
  const incoming = new Map();
  for (const entry of bundle.edges) {
    const { source, target } = entry.data;
    if (!outgoing.has(source)) outgoing.set(source, []);
    if (!incoming.has(target)) incoming.set(target, []);
    outgoing.get(source).push(target);
    incoming.get(target).push(source);
  }

  const labelElements = new Map();
  const legendChips = [];
  const hslCache = new Map();
  const highlightNodes = new Set();
  const highlightLinks = new Set();

  let graph = null;
  let theme = { dark: false, background: "#e9eeec", edge: "#8fa3a0", accent: "#087f8c" };
  let themeMode = "auto";
  let selectedId = null;
  let hoveredId = null;
  let labelsVisible = true;
  let spinning = false;
  let fitted = false;
  let frame = null;

  document.title = `${bundleName} - OKF Viewer`;
  byId("bundle-name").textContent = bundleName;

  function setStatus(message) {
    statusText.textContent = message;
  }

  function clamp(value, min, max) {
    return Math.min(Math.max(value, min), max);
  }

  function hexToHsl(hex) {
    if (hslCache.has(hex)) return hslCache.get(hex);
    const match = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex || "");
    const rgb = match
      ? [parseInt(match[1], 16) / 255, parseInt(match[2], 16) / 255, parseInt(match[3], 16) / 255]
      : [0.5, 0.5, 0.5];
    const [r, g, b] = rgb;
    const max = Math.max(r, g, b);
    const min = Math.min(r, g, b);
    const lightness = (max + min) / 2;
    let hue = 0;
    let saturation = 0;
    if (max !== min) {
      const delta = max - min;
      saturation = delta / (1 - Math.abs(2 * lightness - 1));
      if (max === r) hue = ((g - b) / delta) % 6;
      else if (max === g) hue = (b - r) / delta + 2;
      else hue = (r - g) / delta + 4;
      hue *= 60;
      if (hue < 0) hue += 360;
    }
    const value = {
      h: Math.round(hue),
      s: Math.round(saturation * 100),
      l: Math.round(lightness * 100),
    };
    hslCache.set(hex, value);
    return value;
  }

  // Repository palette is tuned for light paper; dark mode lifts it into a readable band.
  function themedColor(hex, alpha) {
    const { h, s, l } = hexToHsl(hex);
    const lightness = theme.dark ? clamp(l, 58, 72) : l;
    const saturation = theme.dark ? Math.min(s + 8, 82) : s;
    return `hsla(${h}, ${saturation}%, ${lightness}%, ${alpha})`;
  }

  function nodeOf(endpoint) {
    return typeof endpoint === "object" && endpoint !== null ? endpoint : nodeById.get(endpoint);
  }

  function nodeColor(node) {
    if (node.__filtered) return themedColor(node.color, 0.08);
    if (node.id === selectedId) return themedColor(node.color, 1);
    if (highlightNodes.size && !highlightNodes.has(node.id)) return themedColor(node.color, 0.22);
    return themedColor(node.color, 0.92);
  }

  function nodeValue(node) {
    const base = Math.max(1.4, (node.size || 30) / 8);
    return node.id === selectedId ? base * 1.9 : base;
  }

  function linkColor(link) {
    const source = nodeOf(link.source);
    const target = nodeOf(link.target);
    if ((source && source.__filtered) || (target && target.__filtered)) {
      return themedColor(theme.edge, 0.05);
    }
    if (highlightLinks.has(link)) return themedColor(theme.accent, 0.95);
    if (highlightLinks.size) return themedColor(theme.edge, 0.18);
    return themedColor(theme.edge, theme.dark ? 0.55 : 0.65);
  }

  function linkWidth(link) {
    return highlightLinks.has(link) ? 1.5 : 0.5;
  }

  function linkParticles(link) {
    return !motionQuery.matches && highlightLinks.has(link) ? 3 : 0;
  }

  function refreshStyles() {
    if (!graph) return;
    graph
      .nodeColor(nodeColor)
      .nodeVal(nodeValue)
      .linkColor(linkColor)
      .linkWidth(linkWidth)
      .linkDirectionalParticles(linkParticles);
    for (const chip of legendChips) {
      chip.swatch.style.backgroundColor = themedColor(bundle.palette[chip.type], 1);
    }
    if (selectedId) {
      const node = nodeById.get(selectedId);
      if (node) byId("detail-type").style.backgroundColor = themedColor(node.color, 1);
    }
  }

  function readTokens() {
    const styles = getComputedStyle(root);
    theme = {
      dark: root.dataset.theme === "dark",
      background: styles.getPropertyValue("--graph-bg").trim() || "#e9eeec",
      edge: styles.getPropertyValue("--edge").trim() || "#8fa3a0",
      accent: styles.getPropertyValue("--accent").trim() || "#087f8c",
    };
    hslCache.clear();
  }

  function applyTheme(mode) {
    themeMode = mode;
    root.dataset.theme = mode === "auto" ? (darkQuery.matches ? "dark" : "light") : mode;
    for (const name of ["auto", "light", "dark"]) {
      byId(`theme-${name}`).setAttribute("aria-pressed", String(name === mode));
    }
    readTokens();
    if (graph) graph.backgroundColor(theme.background);
    refreshStyles();
    renderLabels();
  }

  try {
    const stored = window.localStorage.getItem(THEME_KEY);
    if (stored === "light" || stored === "dark" || stored === "auto") themeMode = stored;
  } catch (error) {
    themeMode = "auto";
  }

  for (const name of ["auto", "light", "dark"]) {
    byId(`theme-${name}`).addEventListener("click", () => {
      applyTheme(name);
      try {
        window.localStorage.setItem(THEME_KEY, name);
      } catch (error) {
        setStatus("Theme choice is not persisted in this context");
      }
    });
  }
  darkQuery.addEventListener("change", () => {
    if (themeMode === "auto") applyTheme("auto");
  });

  for (const type of bundle.types) {
    const option = document.createElement("option");
    option.value = type;
    option.textContent = type;
    typeSelect.appendChild(option);

    const chip = document.createElement("button");
    chip.type = "button";
    chip.className = "legend-chip";
    chip.setAttribute("aria-pressed", "false");
    const swatch = document.createElement("span");
    swatch.className = "legend-swatch";
    const text = document.createElement("span");
    text.textContent = type;
    chip.append(swatch, text);
    chip.addEventListener("click", () => setTypeFilter(typeSelect.value === type ? "" : type));
    legend.appendChild(chip);
    legendChips.push({ type, chip, swatch });
  }

  for (const node of [...nodes].sort((a, b) => a.label.localeCompare(b.label))) {
    const option = document.createElement("option");
    option.value = node.id;
    option.textContent = node.label;
    conceptPicker.appendChild(option);

    const label = document.createElement("div");
    label.className = "node-label";
    label.textContent = node.label;
    label.style.display = "none";
    labelLayer.appendChild(label);
    labelElements.set(node.id, label);
  }

  applyTheme(themeMode);

  if (typeof window.ForceGraph3D !== "function") {
    byId("graph-fallback-reason").textContent =
      "Check access to the pinned jsDelivr libraries, then reload.";
    fallback.hidden = false;
    setStatus("3D renderer unavailable");
  } else {
    graph = window.ForceGraph3D()(container)
      .graphData({ nodes, links })
      .backgroundColor(theme.background)
      .showNavInfo(false)
      .nodeRelSize(4)
      .nodeResolution(18)
      .nodeOpacity(1)
      .nodeLabel(() => "")
      .linkOpacity(1)
      .linkDirectionalArrowLength(3.2)
      .linkDirectionalArrowRelPos(1)
      .linkDirectionalParticleWidth(1.6)
      .dagLevelDistance(58)
      .onDagError(() => undefined)
      .onNodeHover(handleHover)
      .onNodeClick((node) => selectConcept(node.id, true))
      .onBackgroundClick(clearSelection)
      .onEngineStop(() => {
        if (fitted) return;
        fitted = true;
        fitGraph();
      });
    refreshStyles();
  }

  function handleHover(node) {
    hoveredId = node ? node.id : null;
    container.style.cursor = node ? "pointer" : "grab";
    updateHighlight(node ? node.id : selectedId);
    if (!node) {
      tooltip.hidden = true;
      return;
    }
    tooltip.replaceChildren();
    const title = document.createElement("strong");
    title.textContent = node.label;
    const meta = document.createElement("span");
    const facts = [node.type];
    if (node.status && node.status !== "stable") facts.push(node.status);
    if (node.stale) facts.push("stale");
    meta.textContent = facts.join(" / ");
    tooltip.append(title, meta);
    tooltip.hidden = false;
    positionTooltip(node);
  }

  function positionTooltip(node) {
    if (!graph || node.x === undefined) return;
    const screen = graph.graph2ScreenCoords(node.x, node.y, node.z);
    const width = tooltip.offsetWidth;
    const height = tooltip.offsetHeight;
    const left = clamp(screen.x - width / 2, 8, Math.max(8, container.clientWidth - width - 8));
    const top = clamp(screen.y - height - 16, 8, Math.max(8, container.clientHeight - height - 8));
    tooltip.style.transform = `translate3d(${Math.round(left)}px, ${Math.round(top)}px, 0)`;
  }

  function updateHighlight(id) {
    highlightNodes.clear();
    highlightLinks.clear();
    if (id) {
      highlightNodes.add(id);
      for (const link of graph ? graph.graphData().links : links) {
        const source = nodeOf(link.source);
        const target = nodeOf(link.target);
        if (!source || !target) continue;
        if (source.id === id || target.id === id) {
          highlightLinks.add(link);
          highlightNodes.add(source.id);
          highlightNodes.add(target.id);
        }
      }
    }
    refreshStyles();
    renderLabels();
  }

  function renderLabels() {
    if (!graph) return;
    const width = container.clientWidth;
    const height = container.clientHeight;
    const camera = graph.cameraPosition();
    const controls = graph.controls();
    const target = controls && controls.target ? controls.target : { x: 0, y: 0, z: 0 };
    const forward = {
      x: target.x - camera.x,
      y: target.y - camera.y,
      z: target.z - camera.z,
    };
    const budgeted = nodes.length <= LABEL_BUDGET;

    for (const node of nodes) {
      const element = labelElements.get(node.id);
      if (!element) continue;
      const active = node.id === selectedId || node.id === hoveredId;
      const related = highlightNodes.has(node.id);
      if (!labelsVisible || node.__filtered || node.x === undefined || !(active || related || budgeted)) {
        element.style.display = "none";
        continue;
      }
      const toNode = { x: node.x - camera.x, y: node.y - camera.y, z: node.z - camera.z };
      const depth = toNode.x * forward.x + toNode.y * forward.y + toNode.z * forward.z;
      if (depth <= 0) {
        element.style.display = "none";
        continue;
      }
      const screen = graph.graph2ScreenCoords(node.x, node.y, node.z);
      if (screen.x < -60 || screen.y < -40 || screen.x > width + 60 || screen.y > height + 40) {
        element.style.display = "none";
        continue;
      }
      const distance = Math.hypot(toNode.x, toNode.y, toNode.z);
      element.style.display = "block";
      element.style.opacity = String(active ? 1 : clamp(1.15 - distance / 900, 0.35, 1));
      element.style.transform =
        `translate3d(${Math.round(screen.x)}px, ${Math.round(screen.y)}px, 0) translate(-50%, 12px)`;
      element.classList.toggle("is-active", active);
    }
  }

  function orbitBy(azimuth, elevation) {
    if (!graph) return;
    const camera = graph.cameraPosition();
    const controls = graph.controls();
    const target = controls && controls.target ? controls.target : { x: 0, y: 0, z: 0 };
    const dx = camera.x - target.x;
    const dy = camera.y - target.y;
    const dz = camera.z - target.z;
    const radius = Math.hypot(dx, dy, dz) || 1;
    const angle = Math.atan2(dz, dx) + azimuth;
    const polar = clamp(Math.acos(clamp(dy / radius, -1, 1)) + elevation, 0.2, Math.PI - 0.2);
    graph.cameraPosition({
      x: target.x + radius * Math.sin(polar) * Math.cos(angle),
      y: target.y + radius * Math.cos(polar),
      z: target.z + radius * Math.sin(polar) * Math.sin(angle),
    });
  }

  function dolly(factor) {
    if (!graph) return;
    const camera = graph.cameraPosition();
    const controls = graph.controls();
    const target = controls && controls.target ? controls.target : { x: 0, y: 0, z: 0 };
    const dx = camera.x - target.x;
    const dy = camera.y - target.y;
    const dz = camera.z - target.z;
    const distance = Math.hypot(dx, dy, dz) || 1;
    const scaled = clamp(distance * factor, 24, 6000) / distance;
    graph.cameraPosition(
      { x: target.x + dx * scaled, y: target.y + dy * scaled, z: target.z + dz * scaled },
      undefined,
      motionQuery.matches ? 0 : 180
    );
  }

  function fitGraph() {
    if (!graph) return;
    graph.zoomToFit(motionQuery.matches ? 0 : 420, 60);
  }

  function focusNode(id) {
    if (!graph) return;
    const node = nodeById.get(id);
    if (!node || node.x === undefined) return;
    const distance = 120;
    const radius = Math.hypot(node.x, node.y, node.z) || 1;
    const ratio = 1 + distance / radius;
    graph.cameraPosition(
      { x: node.x * ratio, y: node.y * ratio, z: node.z * ratio },
      node,
      motionQuery.matches ? 0 : 800
    );
  }

  function setTypeFilter(value) {
    typeSelect.value = value;
    for (const chip of legendChips) {
      chip.chip.setAttribute("aria-pressed", String(chip.type === value));
    }
    applyFilters();
  }

  function applyFilters() {
    const query = search.value.trim().toLowerCase();
    const type = typeSelect.value;
    let visible = 0;
    for (const node of nodes) {
      const haystack = `${node.label || ""} ${node.id} ${(node.tags || []).join(" ")}`.toLowerCase();
      node.__filtered = Boolean((query && !haystack.includes(query)) || (type && node.type !== type));
      if (!node.__filtered) visible += 1;
    }
    countText.textContent =
      visible === nodes.length
        ? `${nodes.length} concepts / ${links.length} relationships`
        : `${visible} of ${nodes.length} concepts`;
    setStatus(visible === 0 ? "No concept matches the current filters" : "");
    refreshStyles();
    renderLabels();
  }

  function actorEvent(event) {
    if (!event || !event.by) return "-";
    return event.at ? `${event.by} / ${event.at}` : String(event.by);
  }

  function appendBadge(container_, text, className) {
    const badge = document.createElement("span");
    badge.className = `badge ${className}`;
    badge.textContent = text;
    container_.appendChild(badge);
  }

  function setResource(element, value, label) {
    element.replaceChildren();
    if (!value) {
      element.textContent = "-";
      return;
    }
    if (/^https?:\/\//i.test(value)) {
      const link = document.createElement("a");
      link.href = value;
      link.textContent = label || value;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      element.appendChild(link);
      return;
    }
    element.textContent = label ? `${label} (${value})` : value;
  }

  function normalizeConceptTarget(href, currentId) {
    if (!href || href.startsWith("#") || /^[a-z][a-z0-9+.-]*:/i.test(href)) return null;
    const raw = href.split("#", 1)[0].split("?", 1)[0];
    if (!raw.endsWith(".md")) return null;
    const base = raw.startsWith("/") ? [] : currentId.split("/").slice(0, -1);
    for (const part of raw.replace(/^\//, "").split("/")) {
      if (!part || part === ".") continue;
      if (part === "..") base.pop();
      else base.push(part);
    }
    const target = base.join("/").replace(/\.md$/, "");
    return nodeById.has(target) ? target : null;
  }

  function escapeHtml(value) {
    return String(value).replace(
      /[&<>"']/g,
      (character) =>
        ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;",
        })[character],
    );
  }

  // marked has no footnote support, so citations are resolved before parsing.
  function withFootnotes(markdown) {
    const definitions = new Map();
    const stripped = markdown.replace(
      /^\[\^([^\]\s^]+)\]:[ \t]*(.*)$/gm,
      (match, id, text) => {
        definitions.set(id, text.trim());
        return "";
      },
    );
    if (!definitions.size) return markdown;
    const order = [];
    const linked = stripped.replace(/\[\^([^\]\s^]+)\]/g, (match, id) => {
      if (!definitions.has(id)) return match;
      if (order.indexOf(id) === -1) order.push(id);
      const anchor = encodeURIComponent(id);
      return `<sup class="fn-ref"><a href="#fn-${anchor}">${order.indexOf(id) + 1}</a></sup>`;
    });
    if (!order.length) return markdown;
    const items = order
      .map(
        (id) =>
          `<li id="fn-${encodeURIComponent(id)}">${escapeHtml(definitions.get(id))}</li>`,
      )
      .join("");
    return `${linked.replace(/\n{3,}/g, "\n\n").trim()}\n\n<ol class="fn-list">${items}</ol>\n`;
  }

  function renderBody(conceptId) {
    const element = byId("detail-body");
    const markdown = bundle.bodies[conceptId] || "";
    if (window.marked && window.DOMPurify) {
      const rendered = window.marked.parse(withFootnotes(markdown), {
        gfm: true,
        breaks: false,
      });
      element.innerHTML = window.DOMPurify.sanitize(rendered, { USE_PROFILES: { html: true } });
    } else {
      element.textContent = markdown;
      setStatus("Markdown shown as text because a renderer is unavailable");
    }
    element.querySelectorAll("a[href]").forEach((link) => {
      const target = normalizeConceptTarget(link.getAttribute("href"), conceptId);
      if (!target) {
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        return;
      }
      link.removeAttribute("target");
      link.removeAttribute("rel");
      link.href = `#${encodeURIComponent(target)}`;
      link.addEventListener("click", (event) => {
        event.preventDefault();
        selectConcept(target, true);
      });
    });
  }

  function renderRelations(conceptId) {
    const section = byId("detail-relations");
    const groups = [
      { group: byId("detail-links-group"), list: byId("links-list"), ids: outgoing.get(conceptId) || [] },
      { group: byId("detail-backlinks"), list: byId("backlinks-list"), ids: incoming.get(conceptId) || [] },
    ];
    let any = false;
    for (const { group, list, ids } of groups) {
      list.replaceChildren();
      const unique = [...new Set(ids)];
      group.hidden = unique.length === 0;
      if (unique.length) any = true;
      for (const id of unique) {
        const item = document.createElement("li");
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = (nodeById.get(id) || {}).label || id;
        button.addEventListener("click", () => selectConcept(id, true));
        item.appendChild(button);
        list.appendChild(item);
      }
    }
    section.hidden = !any;
  }

  function selectConcept(conceptId, moveCamera) {
    const node = nodeById.get(conceptId);
    if (!node) return;
    selectedId = conceptId;
    conceptPicker.value = conceptId;
    updateHighlight(conceptId);

    byId("detail-empty").hidden = true;
    byId("detail-content").hidden = false;
    const chip = byId("detail-type");
    chip.textContent = node.type;
    chip.style.backgroundColor = themedColor(node.color, 1);
    byId("detail-title").textContent = node.label;
    byId("detail-id").textContent = conceptId;
    byId("detail-description").textContent = node.description || "-";
    setResource(byId("detail-resource"), node.resource);

    const tags = byId("detail-tags");
    tags.replaceChildren();
    if (node.tags && node.tags.length) {
      for (const value of node.tags) {
        const tag = document.createElement("span");
        tag.className = "tag";
        tag.textContent = value;
        tags.appendChild(tag);
      }
    } else {
      tags.textContent = "-";
    }

    const badges = byId("detail-badges");
    badges.replaceChildren();
    appendBadge(badges, node.status || "stable", `status-${node.status || "stable"}`);
    appendBadge(
      badges,
      (node.trust_tier || "unverified").replace(/-/g, " "),
      `trust-${node.trust_tier || "unverified"}`
    );
    if (node.stale) {
      appendBadge(badges, node.stale_after ? `stale since ${node.stale_after}` : "stale", "stale");
    } else if (node.stale_after) {
      appendBadge(badges, `stale after ${node.stale_after}`, "fresh");
    }

    byId("detail-generated").textContent = actorEvent(node.generated);
    byId("detail-verified").textContent =
      node.verified && node.verified.length ? node.verified.map(actorEvent).join("; ") : "-";

    const sources = byId("detail-sources");
    sources.replaceChildren();
    if (node.sources && node.sources.length) {
      const list = document.createElement("ul");
      list.className = "sources-list";
      for (const source of node.sources) {
        const item = document.createElement("li");
        setResource(item, source.resource, source.title || source.id || "Source");
        list.appendChild(item);
      }
      sources.appendChild(list);
    } else {
      sources.textContent = "-";
    }

    renderBody(conceptId);
    renderRelations(conceptId);
    if (moveCamera) focusNode(conceptId);
  }

  function clearSelection() {
    selectedId = null;
    conceptPicker.value = "";
    byId("detail-content").hidden = true;
    byId("detail-empty").hidden = false;
    updateHighlight(null);
  }

  search.addEventListener("input", applyFilters);
  typeSelect.addEventListener("change", () => setTypeFilter(typeSelect.value));
  conceptPicker.addEventListener("change", () => {
    if (conceptPicker.value) selectConcept(conceptPicker.value, true);
  });
  layoutSelect.addEventListener("change", () => {
    if (!graph) return;
    const mode = layoutSelect.value;
    graph.dagMode(mode === "force" ? null : mode);
    graph.d3ReheatSimulation();
    fitted = false;
  });
  byId("zoom-in").addEventListener("click", () => dolly(0.75));
  byId("zoom-out").addEventListener("click", () => dolly(1.33));
  byId("fit-view").addEventListener("click", fitGraph);
  byId("focus-node").addEventListener("click", () => {
    if (selectedId) focusNode(selectedId);
  });
  byId("toggle-labels").addEventListener("click", (event) => {
    labelsVisible = !labelsVisible;
    event.currentTarget.setAttribute("aria-pressed", String(labelsVisible));
    renderLabels();
  });
  byId("toggle-spin").addEventListener("click", (event) => {
    spinning = !spinning;
    event.currentTarget.setAttribute("aria-pressed", String(spinning));
  });
  byId("reset").addEventListener("click", () => {
    search.value = "";
    setTypeFilter("");
    fitGraph();
  });

  panel.addEventListener("keydown", (event) => {
    if (event.target !== panel) return;
    const step = 0.12;
    if (event.key === "ArrowLeft") orbitBy(-step, 0);
    else if (event.key === "ArrowRight") orbitBy(step, 0);
    else if (event.key === "ArrowUp") orbitBy(0, -step);
    else if (event.key === "ArrowDown") orbitBy(0, step);
    else if (event.key === "+" || event.key === "=") dolly(0.75);
    else if (event.key === "-") dolly(1.33);
    else if (event.key === "0") fitGraph();
    else return;
    event.preventDefault();
  });

  let resizeQueued = false;
  const observer = new ResizeObserver(() => {
    if (resizeQueued) return;
    resizeQueued = true;
    window.requestAnimationFrame(() => {
      resizeQueued = false;
      const width = panel.clientWidth;
      const height = panel.clientHeight;
      if (!graph || !width || !height) return;
      graph.width(width).height(height);
      renderLabels();
    });
  });
  observer.observe(panel);

  function tick() {
    if (spinning) orbitBy(0.0024, 0);
    if (hoveredId) {
      const node = nodeById.get(hoveredId);
      if (node) positionTooltip(node);
    }
    renderLabels();
    frame = window.requestAnimationFrame(tick);
  }

  document.addEventListener("visibilitychange", () => {
    if (document.hidden && frame !== null) {
      window.cancelAnimationFrame(frame);
      frame = null;
    } else if (!document.hidden && frame === null && graph) {
      frame = window.requestAnimationFrame(tick);
    }
  });

  applyFilters();
  if (graph) {
    frame = window.requestAnimationFrame(tick);
    if (nodes.length) selectConcept(nodes[0].id, false);
  }
})();

  </script>
</body>
</html>
