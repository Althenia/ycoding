enum RemoteDeviceCredentialState {
  REMOTEDEVICECREDENTIALSTATE_NOT_AUTHENTICATED = 1 [(ycoding.v5.domain_label) = "not_authenticated"];
  REMOTEDEVICECREDENTIALSTATE_VALID = 2 [(ycoding.v5.domain_label) = "valid"];
  REMOTEDEVICECREDENTIALSTATE_EXPIRED = 3 [(ycoding.v5.domain_label) = "expired"];
  REMOTEDEVICECREDENTIALSTATE_REVOKED = 4 [(ycoding.v5.domain_label) = "revoked"];
}

message RemoteDevice {
  required LosslessString deviceID = 1 [(ycoding.v5.constraints) = { utf16_min: 1 utf16_max: 128 }];
  required LosslessString name = 2 [(ycoding.v5.constraints) = { utf16_min: 1 utf16_max: 128 }];
  required LosslessString relayOrigin = 3 [(ycoding.v5.constraints) = { utf16_min: 1 utf16_max: 2048 }];
  required uint64 enrolledAt = 4 [(ycoding.v5.constraints) = { integer_min: "0" integer_max: "9007199254740991" }];
  required RemoteDeviceCredentialState credentialState = 5;
  optional uint64 credentialExpiresAt = 6 [(ycoding.v5.constraints) = { integer_min: "0" integer_max: "9007199254740991" }];
}

enum RemoteEnrollmentError__tag {
  REMOTEENROLLMENTERROR__TAG_REMOTEENROLLMENTERROR = 1 [(ycoding.v5.domain_label) = "RemoteEnrollmentError"];
}

enum RemoteEnrollmentError_code {
  REMOTEENROLLMENTERROR_CODE_INVALID_ORIGIN = 1 [(ycoding.v5.domain_label) = "invalid_origin"];
  REMOTEENROLLMENTERROR_CODE_INVALID_CODE = 2 [(ycoding.v5.domain_label) = "invalid_code"];
  REMOTEENROLLMENTERROR_CODE_ALREADY_ENROLLED = 3 [(ycoding.v5.domain_label) = "already_enrolled"];
  REMOTEENROLLMENTERROR_CODE_RELAY_REJECTED = 4 [(ycoding.v5.domain_label) = "relay_rejected"];
  REMOTEENROLLMENTERROR_CODE_RELAY_UNAVAILABLE = 5 [(ycoding.v5.domain_label) = "relay_unavailable"];
  REMOTEENROLLMENTERROR_CODE_KEY_FAILED = 6 [(ycoding.v5.domain_label) = "key_failed"];
  REMOTEENROLLMENTERROR_CODE_STORE_FAILED = 7 [(ycoding.v5.domain_label) = "store_failed"];
}

message RemoteEnrollmentError {
  required RemoteEnrollmentError__tag _tag = 1;
  required RemoteEnrollmentError_code code = 2;
}

enum RemoteEnrollmentPartialFailure__tag {
  REMOTEENROLLMENTPARTIALFAILURE__TAG_REMOTEENROLLMENTPARTIALFAILURE = 1 [(ycoding.v5.domain_label) = "RemoteEnrollmentPartialFailure"];
}

message RemoteEnrollmentPartialFailure {
  required RemoteEnrollmentPartialFailure__tag _tag = 1;
  required RemoteDevice device = 2;
}

message remote_enroll_Request_payload {
  required LosslessString relayOrigin = 1 [(ycoding.v5.constraints) = { utf16_min: 1 utf16_max: 2048 }];
  required LosslessString enrollmentID = 2 [(ycoding.v5.constraints) = { utf16_min: 1 utf16_max: 128 }];
  required LosslessString code = 3 [(ycoding.v5.constraints) = { utf16_min: 1 utf16_max: 128 }];
  optional LosslessString name = 4 [(ycoding.v5.constraints) = { utf16_min: 1 utf16_max: 128 }];
  optional bool replace = 5;
}

message remote_enroll_Request {
  required remote_enroll_Request_payload payload = 1;
}

message remote_enroll_Result {
  required RemoteDevice data = 1;
}

message RemoteMcpStatus {
  required remote_get_Result_data_state state = 1;
  optional LosslessString message = 2;
  optional LosslessString url = 3;
}

