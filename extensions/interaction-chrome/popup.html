<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>YCoding Interaction</title>
    <link rel="icon" type="image/png" sizes="32x32" href="icons/idle-32.png">
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <header class="deck-head">
      <div class="brand">
        <img class="brand-mark" src="icons/idle-32.png" width="20" height="20" alt="">
        <h1>YCoding Interaction</h1>
      </div>
      <span id="status" class="status-pill" role="status">Checking…</span>
    </header>
    <main class="deck-body">
      <div id="match-code" class="match-code" hidden></div>
      <button id="connect" type="button" class="btn btn--primary" hidden>Connect</button>
      <section id="requests" class="deck-list" aria-label="Pending decisions"></section>
      <section id="active" class="deck-list" aria-label="Active control"></section>
      <p id="feedback" class="feedback" role="alert"></p>
    </main>
    <footer class="deck-foot">
      <details id="advanced">
        <summary>Advanced</summary>
        <div class="advanced-body">
          <label class="field-label">
            <span>Local service address</span>
            <input name="address" type="url" value="http://127.0.0.1:42188" placeholder="http://127.0.0.1:42188" autocomplete="off" spellcheck="false">
          </label>
          <button id="forget" type="button" class="btn btn--secondary">Forget this profile</button>
        </div>
      </details>
      <button id="open-panel" type="button" class="btn btn--ghost">Mini panel</button>
    </footer>
    <script type="module" src="popup.js"></script>
  </body>
</html>
