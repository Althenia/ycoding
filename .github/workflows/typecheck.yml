name: typecheck

on:
  push:
    branches: [dev, v2]
  pull_request:
    branches: [dev, v2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          install-flags: --frozen-lockfile

      - name: Cache Turbo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/turbo
          key: turbo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('turbo.json', 'tsconfig.json', 'bun.lock', '**/package.json', '**/tsconfig.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('turbo.json', 'tsconfig.json', 'bun.lock', '**/package.json', '**/tsconfig.json') }}-
            turbo-${{ runner.os }}-${{ runner.arch }}-

      - name: Run typecheck
        run: bun typecheck
