name: test

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-inputs:
    name: select Desktop and Web build inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      desktop: ${{ steps.select.outputs.desktop }}
      web: ${{ steps.select.outputs.web }}
    steps:
      - name: Checkout comparison history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Install Bun
        uses: ./.github/actions/install-bun

      - name: Select production builds
        id: select
        shell: bash
        env:
          CI_PR_BASE: ${{ github.event.pull_request.base.sha }}
          CI_PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: bun script/ci-build-inputs.ts | tee -a "$GITHUB_OUTPUT"

  unit:
    # Temporarily disabled until the Rust release; remove this job-level if to restore.
    if: ${{ false }}
    name: unit (${{ matrix.settings.name }})
    strategy:
      fail-fast: false
      matrix:
        settings:
          - name: linux
            host: ubuntu-24.04
          - name: windows
            host: windows-2025
    runs-on: ${{ matrix.settings.host }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Configure git identity
        run: |
          git config --global user.email "bot@ycoding.ai"
          git config --global user.name "ycoding"

      - name: Cache Turbo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/turbo
          key: turbo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('turbo.json', 'tsconfig.json', 'bun.lock') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('turbo.json', 'tsconfig.json', 'bun.lock') }}-
            turbo-${{ runner.os }}-

      - name: Run unit tests
        timeout-minutes: 20
        run: GITHUB_ACTIONS=false bun turbo test
        env:
          YCODING_EXPERIMENTAL_DISABLE_FILEWATCHER: ${{ runner.os == 'Windows' && 'true' || 'false' }}

  source:
    name: source verification (linux)
    needs: build-inputs
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          install-flags: --frozen-lockfile

      - name: Configure git identity
        run: |
          git config --global user.email "bot@ycoding.ai"
          git config --global user.name "ycoding"

      - name: Verify production build selection
        run: bun test --cwd script ./ci-build-inputs.test.ts

      - name: Verify web application and relay
        run: |
          bun test --cwd apps/web ./src/content/changelog.test.ts ./src/content/docs/registry.test.ts ./src/remote/autonomy-source.test.ts ./src/remote/autonomy.test.ts ./src/remote/coordination.test.ts ./src/remote/prediction.test.ts ./src/remote/project-escalation.test.ts ./src/remote/projection.test.ts ./src/remote/prompt-generate.test.ts ./src/remote/queries.test.ts ./src/remote/ui/autonomous-panel.test.tsx ./src/remote/ui/command-palette-model.test.ts ./src/remote/ui/composer-action.test.ts ./src/remote/ui/composer-layout.test.ts ./src/remote/ui/composer-logic.test.ts ./src/remote/ui/provider-logo.test.ts ./src/remote/ui/remote-redesign.test.ts ./src/remote/ui/settings-layout.test.ts ./src/remote/ui/status-bar.test.ts ./src/remote/ui/todo-panel.test.ts ./src/remote/ui/transcript-rows.test.ts ./src/remote/ui/usage-accounting.test.ts ./src/remote/ui/usage-filters.test.ts ./src/remote/ui/usage-layout.test.ts ./src/remote/view-model.test.ts ./src/styles/design-md.test.ts ./src/styles/composition.test.ts ./src/remote/form-contract.test.ts ./src/remote/question-history.test.ts
          bun test --cwd packages/remote ./test/contract.test.ts ./test/coordination.test.ts ./test/dots-access-contract.test.ts ./test/completions.test.ts ./test/provider-auth.test.ts
          bun test --cwd apps/web ./src/content/boundary.test.ts

      # The Worker serves the built web application, so the web build must precede
      # the Cloudflare build check.
      - name: Build web application
        if: needs.build-inputs.outputs.web != 'false'
        run: bun run build:web

      - name: Report Web build skip
        if: needs.build-inputs.outputs.web == 'false'
        run: echo "Web and Cloudflare build inputs are unchanged."

      - name: Verify injected web transport boundaries
        run: |
          bun test --cwd apps/web ./test/remote-store-container.test.ts
          bun test --cwd apps/web ./src/remote/endpoint.test.ts ./src/pwa/offline.test.ts ./src/service-worker.push.test.ts
          bun test --cwd apps/web ./test/remote-http.test.ts ./test/remote-http-bulk.test.ts
          bun test --cwd apps/web ./test/remote-sync.test.ts -t 'oversized live invalidations'
          bun test --cwd packages/protocol ./test/http-bulk.test.ts
          bun test --cwd apps/web ./test/remote-todo.test.ts -t "a connector that never answers todo.list does not hold Session hydration or raise a state notice|a superseded same-Session read cannot overwrite reconnect's newer todo list"
          bun test --cwd apps/web ./test/remote-guardrail.test.ts -t "preserves inspectable guardrail metadata in the family read"

      - name: Verify Cloudflare Worker
        run: |
          bun test --cwd infra/cloudflare ./test/mcp-boundary.test.ts ./test/relay-core.test.ts ./test/auth-service.test.ts ./test/push-coordination-filter.test.ts ./test/device-alias.test.ts
          bun test --cwd infra/cloudflare ./test/router.test.ts -t 'websocket upgrades|message stream forwards|v5 message and attachment bulk selectors|relay presence|closes every device|after rotation|revokes an owned device'
          bun test --cwd infra/cloudflare ./test/relay-authority.test.ts ./test/relay-handoff.test.ts ./test/relay-http.test.ts ./test/relay-mcp.test.ts ./test/relay-resync.test.ts
          bun run typecheck:cloudflare

      - name: Build Cloudflare Worker
        if: needs.build-inputs.outputs.web != 'false'
        run: bun run build:cloudflare

      - name: Check generated client
        working-directory: packages/client
        run: bun run check:generated

  desktop:
    name: desktop frontend verification
    needs: build-inputs
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Report Desktop build skip
        if: needs.build-inputs.outputs.desktop == 'false'
        run: echo "Desktop frontend build inputs are unchanged."

      - name: Checkout repository
        if: needs.build-inputs.outputs.desktop != 'false'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Bun
        if: needs.build-inputs.outputs.desktop != 'false'
        uses: ./.github/actions/setup-bun
        with:
          install-flags: --frozen-lockfile

      - name: Build Desktop frontend
        if: needs.build-inputs.outputs.desktop != 'false'
        run: bun run --cwd packages/desktop build:frontend

  build:
    name: native and Node builds (${{ matrix.settings.name }})
    strategy:
      fail-fast: false
      matrix:
        settings:
          - name: linux
            host: ubuntu-24.04
    runs-on: ${{ matrix.settings.host }}
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          install-flags: --frozen-lockfile

      - name: Configure git identity
        run: |
          git config --global user.email "bot@ycoding.ai"
          git config --global user.name "ycoding"

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Build native executable
        timeout-minutes: 30
        working-directory: packages/cli
        run: bun run script/build.ts --single

      - name: Setup Node build runtime
        if: always()
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.4.0"

      - name: Verify Node build
        if: always()
        timeout-minutes: 15
        working-directory: packages/cli
        run: bun run script/build-node.ts --single --skip-install --outdir=dist/node

  native-windows:
    name: native runtime build (windows)
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      YCODING_CHANNEL: latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Resolve release version
        run: bash script/release-version.sh

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          install-flags: --frozen-lockfile

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Build Windows native executable
        run: bun run build:tui --target=win32-x64 --runtime-receipt="$RUNNER_TEMP/windows-runtime"

      - name: Verify the embedded Windows runtime
        run: bun packages/cli/script/runtime.ts verify-embedded dist/tui/tui-windows-x64/bin/ycoding.exe "$RUNNER_TEMP/windows-runtime/receipt.json"

  portability:
    # Temporarily disabled until the Rust release; remove this job-level if to restore.
    if: ${{ false }}
    name: portability regressions (windows)
    runs-on: windows-2025
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      YCODING_EXPERIMENTAL_DISABLE_FILEWATCHER: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
      - name: Configure git identity
        run: |
          git config --global user.email "bot@ycoding.ai"
          git config --global user.name "ycoding"
      # Direct suites remain independent of Turbo's sibling-abort behavior.
      # The complete Linux/Windows unit matrix remains authoritative.
      - name: Verify CLI portability regressions
        timeout-minutes: 10
        working-directory: packages/cli
        run: bun test --timeout 30000 test/binary-name.test.ts test/install-local.test.ts test/chrome-extension-packaging.test.ts test/computer-use-packaging.test.ts test/update.test.ts test/remote-operations.test.ts test-integration/task-mcp-node.test.ts
      - name: Verify exact shell output bytes
        if: always()
        timeout-minutes: 10
        working-directory: packages/cli
        run: bun test --timeout 30000 test/remote-integration.test.ts --test-name-pattern 'pages real shell output|joins real captured pages|holds a live incomplete|settles incomplete trailing|pages real Unicode'
      - name: Verify Core portability regressions
        if: always()
        timeout-minutes: 10
        working-directory: packages/core
        run: bun test --timeout 30000 test/browser-extension.test.ts test/tool-shell.test.ts test/session-guardrail-service.test.ts test/location-mutation.test.ts test/effect/cross-spawn-spawner.test.ts
      - name: Verify native inventory paths and pagination
        if: always()
        timeout-minutes: 5
        working-directory: packages/core
        run: bun test --timeout 30000 test/project-inventory.test.ts
