name: release

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      version:
        description: Release version without leading v (for example 0.1.3). Defaults to the newest docs/releases version file.
        required: false
        default: ""

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  YCODING_CHANNEL: latest

jobs:
  verify-source:
    name: verify release source
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout release source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag is reachable from main
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Resolve release version
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.version }}" ]; then
            version="${{ inputs.version }}"
          elif [[ "${{ github.ref_name }}" == v* ]]; then
            version="${{ github.ref_name }}"
            version="${version#v}"
          else
            version="$(ls docs/releases/v*.md | sed 's#.*/v##' | sed 's#\.md$##' | sort -V | tail -n 1)"
          fi
          printf '%s\n' "$version" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$' \
            || { echo "Invalid release version: $version" >&2; exit 1; }
          echo "RELEASE_VERSION=$version" >>"$GITHUB_ENV"
          echo "YCODING_VERSION=$version" >>"$GITHUB_ENV"

      - name: Verify release notes exist
        run: |
          set -euo pipefail
          release_notes="docs/releases/v$RELEASE_VERSION.md"
          test -f "$release_notes" || { echo "Missing release notes: $release_notes" >&2; exit 1; }
          test -s "$release_notes" || { echo "Release notes are empty: $release_notes" >&2; exit 1; }

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          install-flags: --frozen-lockfile

      - name: Check workspace and types
        run: |
          bun run check:ycoding-workspace
          bun run check:ycoding-brand
          bun run typecheck
          bun run lint:effect-patterns

      - name: Verify Cloudflare Worker
        run: |
          bun run test:cloudflare
          bun run build:cloudflare

      - name: Verify CLI suites
        working-directory: packages/cli
        run: bun test --timeout 30000

      - name: Verify transcript and approval suites
        working-directory: packages/tui
        run: bun test test/session-transcript-live-fixes.test.tsx test/cli/tui/permission-interaction.test.tsx test/cli/tui/permission.test.ts test/util/permission.test.ts test/branding.test.ts

      - name: Verify goal continuation
        working-directory: packages/core
        run: bun test test/session-execution.test.ts test/session-autonomy.test.ts

      - name: Verify installer and documentation
        run: cd /tmp && bun test "$GITHUB_WORKSPACE/script/install.test.ts" "$GITHUB_WORKSPACE/script/pages.test.ts" "$GITHUB_WORKSPACE/script/release.test.ts"

  build:
    name: build ${{ matrix.target }}
    needs: verify-source
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-26
            platform: darwin
            arch: arm64
          - target: darwin-x64
            runner: macos-15-intel
            platform: darwin
            arch: x64
          - target: linux-x64
            runner: ubuntu-24.04
            platform: linux
            arch: x64
          - target: windows-x64
            runner: windows-2025
            platform: win32
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Resolve release version
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.version }}" ]; then
            version="${{ inputs.version }}"
          elif [[ "${{ github.ref_name }}" == v* ]]; then
            version="${{ github.ref_name }}"
            version="${version#v}"
          else
            version="$(ls docs/releases/v*.md | sed 's#.*/v##' | sed 's#\.md$##' | sort -V | tail -n 1)"
          fi
          echo "RELEASE_VERSION=$version" >>"$GITHUB_ENV"
          echo "YCODING_VERSION=$version" >>"$GITHUB_ENV"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          install-flags: --frozen-lockfile

      - name: Verify native build host
        env:
          EXPECTED_PLATFORM: ${{ matrix.platform }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          bun -e '
            if (process.platform !== process.env.EXPECTED_PLATFORM || process.arch !== process.env.EXPECTED_ARCH) {
              console.error(`Expected ${process.env.EXPECTED_PLATFORM}/${process.env.EXPECTED_ARCH}, got ${process.platform}/${process.arch}`)
              process.exit(1)
            }
          '

      - name: Build TUI artifact
        run: bun run build:tui

      - name: Validate TUI artifact
        run: bun run smoke:tui

      - name: Validate runtime artifact
        run: bun run smoke:runtime

      - name: Verify build metadata
        run: |
          set -euo pipefail
          node -e 'const metadata = require("./dist/tui/tui-${{ matrix.target }}/package.json"); if (metadata.version !== process.env.YCODING_VERSION) process.exit(1)'

      - name: Stage native executables
        run: |
          set -euo pipefail
          staging="dist/release-bin/${{ matrix.target }}"
          mkdir -p "$staging"
          cp "dist/tui/tui-${{ matrix.target }}/bin/ycoding${{ runner.os == 'Windows' && '.exe' || '' }}" "$staging/"
          if [ "${{ runner.os }}" = "macOS" ]; then
            cp "dist/tui/tui-${{ matrix.target }}/bin/ycoding-computer-helper" "$staging/"
          fi

      - name: Upload native executables
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ycoding-${{ matrix.target }}
          path: dist/release-bin/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 7

  isolated-browser-acceptance:
    name: isolated browser acceptance (darwin-arm64, Chrome 152)
    needs: build
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          install-flags: --frozen-lockfile

      - name: Verify approved browser host
        run: |
          set -euo pipefail
          bun -e '
            if (process.platform !== "darwin" || process.arch !== "arm64") {
              console.error(`Expected darwin/arm64, got ${process.platform}/${process.arch}`)
              process.exit(1)
            }
          '
          chrome="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
          test -x "$chrome" || { echo "Google Chrome is not installed at the approved path" >&2; exit 1; }
          version="$("$chrome" --version)"
          major="$(printf '%s\n' "$version" | sed -E 's/.* ([0-9]+)\..*/\1/')"
          test "$major" = "152" || {
            echo "Isolated-browser acceptance requires installed Google Chrome major 152; found: $version" >&2
            exit 1
          }

      - name: Verify isolated-browser integration suites
        run: bun run test:integration:browser

      - name: Download darwin-arm64 executable
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ycoding-darwin-arm64
          path: dist/isolated-browser

      - name: Verify packaged isolated browser
        run: |
          set -euo pipefail
          chmod +x dist/isolated-browser/ycoding
          bun run --cwd packages/cli script/isolated-browser-smoke.ts --binary="$GITHUB_WORKSPACE/dist/isolated-browser/ycoding"

  office:
    name: office ${{ matrix.target }}
    needs: verify-source
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-universal
            runner: macos-26
            editor: Godot_v4.7.2-stable_macos.universal.zip
            editor_sha512: 38aa16e5bba2083941fc5b3e54be0089bd4cc35e32415f5b9fd9a8a6a7b9818255d44532ea8ef94b5aef56c4b407c2d634fa4f657e4ebe681ebbf59b7bac69ca
          - target: linux-x64
            runner: ubuntu-24.04
            editor: Godot_v4.7.2-stable_linux.x86_64.zip
            editor_sha512: 9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65
          # Godot cross-exports Windows from any host, so the Windows client needs no
          # Windows runner.
          - target: windows-x64
            runner: ubuntu-24.04
            editor: Godot_v4.7.2-stable_linux.x86_64.zip
            editor_sha512: 9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      GODOT_VERSION: 4.7.2
      GODOT_RELEASE_BASE: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable
      # Checksums published by Godot in SHA512-SUMS.txt for this release. The engine
      # and its templates execute with the runner's authority, so they are verified
      # against the publisher's own sums rather than a locally recorded hash.
      GODOT_TEMPLATES_SHA512: ca4d71c4d7b81dfc15d1a98baa07534aa95b03fdda78a0075b06672e1648d2e5f40980c9adc28d23e1b92e732ee7bf3461997aa804af74ec2fcd7a93ccb84079
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Resolve release version
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.version }}" ]; then
            version="${{ inputs.version }}"
          elif [[ "${{ github.ref_name }}" == v* ]]; then
            version="${{ github.ref_name }}"
            version="${version#v}"
          else
            version="$(ls docs/releases/v*.md | sed 's#.*/v##' | sed 's#\.md$##' | sort -V | tail -n 1)"
          fi
          echo "RELEASE_VERSION=$version" >>"$GITHUB_ENV"

      - name: Cache export templates
        id: templates-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/godot-templates
          key: godot-templates-${{ env.GODOT_VERSION }}-stable-${{ runner.os }}

      - name: Install Godot and export templates
        run: |
          set -euo pipefail
          downloads="$RUNNER_TEMP/godot-download"
          editor_dir="$RUNNER_TEMP/godot-editor"
          templates_dir="$RUNNER_TEMP/godot-templates/$GODOT_VERSION.stable"
          mkdir -p "$downloads" "$editor_dir"

          verify() {
            if command -v sha512sum >/dev/null 2>&1; then
              (cd "$downloads" && sha512sum -c "$1")
            else
              (cd "$downloads" && shasum -a 512 -c "$1")
            fi
          }

          curl --proto '=https' --proto-redir '=https' -fsSL -o "$downloads/${{ matrix.editor }}" "$GODOT_RELEASE_BASE/${{ matrix.editor }}"
          printf '%s  %s\n' "${{ matrix.editor_sha512 }}" "${{ matrix.editor }}" >"$downloads/editor.sums"
          verify editor.sums
          unzip -q -o "$downloads/${{ matrix.editor }}" -d "$editor_dir"

          templates_archive="Godot_v$GODOT_VERSION-stable_export_templates.tpz"
          if [ ! -d "$templates_dir" ]; then
            curl --proto '=https' --proto-redir '=https' -fsSL -o "$downloads/$templates_archive" "$GODOT_RELEASE_BASE/$templates_archive"
            printf '%s  %s\n' "$GODOT_TEMPLATES_SHA512" "$templates_archive" >"$downloads/templates.sums"
            verify templates.sums
            mkdir -p "$RUNNER_TEMP/godot-templates"
            unzip -q -o "$downloads/$templates_archive" -d "$RUNNER_TEMP/godot-templates"
            mv "$RUNNER_TEMP/godot-templates/templates" "$templates_dir"
          fi

          # The engine resolves templates under its per-user data directory.
          case "$RUNNER_OS" in
            macOS) system_templates="$HOME/Library/Application Support/Godot/export_templates" ;;
            *) system_templates="$HOME/.local/share/godot/export_templates" ;;
          esac
          mkdir -p "$system_templates"
          rm -rf "$system_templates/$GODOT_VERSION.stable"
          cp -R "$templates_dir" "$system_templates/$GODOT_VERSION.stable"

          case "$RUNNER_OS" in
            macOS) godot_bin="$editor_dir/Godot.app/Contents/MacOS/Godot" ;;
            *)
              godot_bin="$(find "$editor_dir" -maxdepth 1 -type f -name 'Godot_*' | head -n 1)"
              [ -n "$godot_bin" ] || { echo "No Godot executable in the downloaded editor archive" >&2; exit 1; }
              chmod +x "$godot_bin"
              ;;
          esac
          echo "GODOT_BIN=$godot_bin" >>"$GITHUB_ENV"
          "$godot_bin" --version

      - name: Build the desktop client
        run: |
          set -euo pipefail
          apps/office/tools/build-release.sh --version "$RELEASE_VERSION" --target "${{ matrix.target }}" --outdir dist/office/release

      # The installer mounts the macOS disk image with ditto and hdiutil, which only
      # exist on macOS, so that path is skipped on the Linux runner that also runs
      # this suite. Running it here covers it on the platform that uses it. These
      # tests need no repository dependencies, so Bun alone is enough.
      - name: Setup Bun
        if: matrix.target == 'darwin-universal'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Verify the installer mounts the disk image
        if: matrix.target == 'darwin-universal'
        run: cd /tmp && bun test "$GITHUB_WORKSPACE/script/install.test.ts"

      - name: Upload the desktop client archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: office-${{ matrix.target }}
          path: dist/office/release/
          if-no-files-found: error
          retention-days: 7

  package:
    name: package release assets
    needs: [build, isolated-browser-acceptance, office]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Resolve release version
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.version }}" ]; then
            version="${{ inputs.version }}"
          elif [[ "${{ github.ref_name }}" == v* ]]; then
            version="${{ github.ref_name }}"
            version="${version#v}"
          else
            version="$(ls docs/releases/v*.md | sed 's#.*/v##' | sed 's#\.md$##' | sort -V | tail -n 1)"
          fi
          echo "RELEASE_VERSION=$version" >>"$GITHUB_ENV"

      - name: Download native executables
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: unpacked
          pattern: ycoding-*

      - name: Download desktop client archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: office-unpacked
          pattern: office-*

      - name: Create release archives and checksums
        run: |
          set -euo pipefail
          version="$RELEASE_VERSION"
          mkdir release
          chmod +x unpacked/ycoding-darwin-arm64/ycoding unpacked/ycoding-darwin-arm64/ycoding-computer-helper unpacked/ycoding-darwin-x64/ycoding unpacked/ycoding-darwin-x64/ycoding-computer-helper unpacked/ycoding-linux-x64/ycoding
          test -x unpacked/ycoding-darwin-arm64/ycoding
          test -x unpacked/ycoding-darwin-arm64/ycoding-computer-helper
          test -x unpacked/ycoding-darwin-x64/ycoding
          test -x unpacked/ycoding-darwin-x64/ycoding-computer-helper
          test -x unpacked/ycoding-linux-x64/ycoding
          tar -C unpacked/ycoding-darwin-arm64 -czf "release/ycoding-$version-darwin-arm64.tar.gz" ycoding ycoding-computer-helper
          tar -C unpacked/ycoding-darwin-x64 -czf "release/ycoding-$version-darwin-x64.tar.gz" ycoding ycoding-computer-helper
          tar -C unpacked/ycoding-linux-x64 -czf "release/ycoding-$version-linux-x64.tar.gz" ycoding
          (cd unpacked/ycoding-windows-x64 && zip "../../release/ycoding-$version-windows-x64.zip" ycoding.exe)
          tar -tzvf "release/ycoding-$version-darwin-arm64.tar.gz" | grep '^-rwx' >/dev/null
          tar -tzvf "release/ycoding-$version-darwin-x64.tar.gz" | grep '^-rwx' >/dev/null
          tar -tzvf "release/ycoding-$version-linux-x64.tar.gz" | grep '^-rwx' >/dev/null
          tar -tzf "release/ycoding-$version-darwin-arm64.tar.gz" | grep -x 'ycoding-computer-helper' >/dev/null
          tar -tzf "release/ycoding-$version-darwin-x64.tar.gz" | grep -x 'ycoding-computer-helper' >/dev/null
          find office-unpacked -type f \( -name 'ycoding-office-*.tar.gz' -o -name 'ycoding-office-*.zip' -o -name 'ycoding-office-*.dmg' \) -exec mv {} release/ \;
          # One checksum file covers every asset in the release, so the installer
          # verifies the desktop client with the same rule as the terminal executable.
          (cd release && sha256sum "ycoding-$version-"*.tar.gz "ycoding-$version-"*.zip "ycoding-office-$version-"*.tar.gz "ycoding-office-$version-"*.zip "ycoding-office-$version-"*.dmg > "ycoding-$version-checksums.txt")

      - name: Upload prepared release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets-${{ env.RELEASE_VERSION }}
          path: release/
          if-no-files-found: error
          retention-days: 7

  release:
    name: publish release
    needs: package
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Resolve release version
        run: |
          set -euo pipefail
          version="${{ github.ref_name }}"
          version="${version#v}"
          echo "RELEASE_VERSION=$version" >>"$GITHUB_ENV"

      - name: Download prepared release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets-${{ env.RELEASE_VERSION }}
          path: release

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="$RELEASE_VERSION"
          export RELEASE_TAG="v$version"
          gh release view "v$version" >/dev/null 2>&1 && {
            echo "Release v$version already exists"
            exit 1
          }
          prev="$(gh release list --limit 100 --json tagName --jq '[.[] | select(.tagName != env.RELEASE_TAG) | .tagName] | first // empty' 2>/dev/null || true)"
          prev="${prev:-$(gh api "repos/$GH_REPO/releases?per_page=100" --jq "[.[] | select(.tag_name != \"v$version\" and .draft == false) | .tag_name] | first // empty" 2>/dev/null || true)}"
          range="${prev:+$prev...}v$version"
          {
            cat "docs/releases/v$version.md"
            echo ""
            echo "**Full Changelog**: https://github.com/Althenia/ycoding/compare/$range"
          } > release-notes.md
          gh release create "v$version" release/* "docs/releases/v$version.md" --verify-tag --title "YCoding $version" --notes-file release-notes.md
