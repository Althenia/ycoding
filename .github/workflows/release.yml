name: release

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      version:
        description: Release version without leading v (for example 0.7.0). Defaults to the newest docs/releases/v<version>.md file.
        required: false
        default: ""

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  YCODING_CHANNEL: latest

jobs:
  verify-source:
    name: verify release source (${{ matrix.suite }})
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: types
            runner: ubuntu-24.04
          - suite: web
            runner: ubuntu-24.04
          - suite: cli
            runner: ubuntu-24.04
          - suite: tui-project
            runner: ubuntu-24.04
          - suite: tui-runtime
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - name: Checkout release source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag is reachable from main
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Resolve release version
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.version }}" ]; then
            version="${{ inputs.version }}"
          elif [[ "${{ github.ref_name }}" == v* ]]; then
            version="${{ github.ref_name }}"
            version="${version#v}"
          else
            version="$(ls docs/releases/v*.md | sed 's#.*/v##' | sed 's#\.md$##' | sort -V | tail -n 1)"
          fi
          printf '%s\n' "$version" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$' \
            || { echo "Invalid release version: $version" >&2; exit 1; }
          echo "RELEASE_VERSION=$version" >>"$GITHUB_ENV"
          echo "YCODING_VERSION=$version" >>"$GITHUB_ENV"

      - name: Verify release notes exist
        run: |
          set -euo pipefail
          release_notes="docs/releases/v$RELEASE_VERSION.md"
          test -f "$release_notes" || { echo "Missing release notes: $release_notes" >&2; exit 1; }
          test -s "$release_notes" || { echo "Release notes are empty: $release_notes" >&2; exit 1; }

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          install-flags: --frozen-lockfile

      - name: Check workspace and types
        if: matrix.suite == 'types'
        run: |
          bun run check:ycoding-workspace
          bun run check:ycoding-brand
          bun test --cwd script ./typecheck-cache.integration.test.ts
          bun run typecheck
          bun run lint:effect-patterns

      - name: Verify web application and relay
        if: matrix.suite == 'web'
        run: |
          bun test --cwd apps/web ./src/content/changelog.test.ts ./src/content/docs/registry.test.ts ./src/remote/autonomy-source.test.ts ./src/remote/autonomy.test.ts ./src/remote/coordination.test.ts ./src/remote/prediction.test.ts ./src/remote/project-escalation.test.ts ./src/remote/projection.test.ts ./src/remote/prompt-generate.test.ts ./src/remote/queries.test.ts ./src/remote/ui/autonomous-panel.test.tsx ./src/remote/ui/command-palette-model.test.ts ./src/remote/ui/composer-action.test.ts ./src/remote/ui/composer-layout.test.ts ./src/remote/ui/composer-logic.test.ts ./src/remote/ui/provider-logo.test.ts ./src/remote/ui/remote-redesign.test.ts ./src/remote/ui/settings-layout.test.ts ./src/remote/ui/status-bar.test.ts ./src/remote/ui/todo-panel.test.ts ./src/remote/ui/transcript-rows.test.ts ./src/remote/ui/usage-accounting.test.ts ./src/remote/ui/usage-filters.test.ts ./src/remote/ui/usage-layout.test.ts ./src/remote/view-model.test.ts ./src/styles/design-md.test.ts ./src/styles/composition.test.ts ./src/remote/form-contract.test.ts ./src/remote/question-history.test.ts
          bun test --cwd packages/remote ./test/contract.test.ts ./test/coordination.test.ts ./test/completions.test.ts ./test/provider-auth.test.ts
          bun test --cwd apps/web ./src/content/boundary.test.ts

      - name: Build web application
        if: matrix.suite == 'web'
        run: bun run build:web

      - name: Verify injected web transport boundaries
        if: matrix.suite == 'web'
        run: |
          bun test --cwd apps/web ./test/remote-store-container.test.ts
          bun test --cwd apps/web ./test/dots.test.ts ./src/remote/ui/dots-composer.test.ts
          bun test --cwd apps/web ./test/remote-todo.test.ts -t "a connector that never answers todo.list does not hold Session hydration or raise a state notice|a superseded same-Session read cannot overwrite reconnect's newer todo list"
          bun test --cwd apps/web ./test/remote-guardrail.test.ts -t "preserves inspectable guardrail metadata in the family read"

      - name: Verify Cloudflare Worker
        if: matrix.suite == 'web'
        run: |
          bun test --cwd infra/cloudflare ./test/mcp-boundary.test.ts ./test/relay-core.test.ts ./test/auth-service.test.ts ./test/push-coordination-filter.test.ts ./test/device-alias.test.ts
          bun run build:cloudflare

      - name: Verify CLI suites
        if: matrix.suite == 'cli'
        working-directory: packages/cli
        run: |
          bun test --timeout 30000 ./test/binary-name.test.ts ./test/install-local.test.ts ./test/update.test.ts ./test/chrome-extension-packaging.test.ts ./test/build-bytecode.test.ts ./test/remote-operations.test.ts ./test/remote-retirement.test.ts ./test/remote-decision-boundary.test.ts ./test/remote-control-config.test.ts ./test/remote-control-native.test.ts ./test/remote-control-native-escalation.test.ts ./test/remote-control-projection.test.ts ./test/remote-control-sequence.test.ts ./test/remote-control-stream-isolation.test.ts
          bun test --timeout 30000 ./test/computer-use-packaging.test.ts -t "filters unsupported targets without planning a native helper|plans a sibling helper for each supported macOS architecture|signs with a configured stable identity and a secure timestamp, otherwise ad hoc|keeps only complete artifacts when the host cannot compile the macOS helper|plans the explicit source-development helper in Core's ignored cache|rejects a macOS package without the signed application bundle|rejects an unexpected macOS application bundle in a non-macOS package"
          bun test --timeout 30000 ./test/remote-bridge.test.ts -t "remote bridge|global Dots reads remain available during a pending write without Session inventory|quota observations use the global control frame without Session subscriptions or private fields|quota pending results retry through the existing refresh and settled results stop retries|expired and malformed quota events never enter the relay queue|quota retry survives connection replacement and ignores the replaced connection's receipt|ID-only shell deletions invalidate family lists without forwarding shell identities|pages explicit completion receipts without a browser subscription and refreshes on accepted completion|retries a failed completion page without declaring a partial baseline complete|discards a pending completion page from a prior opening of the same connection|live completion receipts wait for a complete baseline and reject stale or child ownership|pending-request events invalidate shared list classification before the next cursor or carousel read"
          bun test --timeout 30000 ./test/remote-control.test.ts -t "remote-control wire types|remote-control envelope|remote-control app-server mapping|state store persists installation and enrollment without configuration or tokens|host enrolls, connects with headers, serves one RPC, and answers ping with pong|enabling reports connecting before credentials resolve|fresh host enrolls when only an old websocket URL key exists|fresh host refreshes saved enrollment and uses the refreshed token|refresh 404 deletes the enrollment and re-enrolls; unrecognized enroll 404 preserves and fails closed"
          bun test --timeout 30000 ./test/remote-access.test.ts -t "global Dots operations need no Session inventory and preserve exact revision and conflicts"

      - name: Verify Antigravity provider and build fixture boundaries
        if: matrix.suite == 'cli'
        run: |
          bun test --cwd packages/core ./test/plugin/provider-antigravity.test.ts
          bun test --cwd packages/cli/script ./antigravity-build-env.test.ts ./antigravity-build.test.ts

      - name: Verify Chrome extension suites
        if: matrix.suite == 'cli'
        run: bun test --cwd extensions/chrome ./test/protocol.test.js ./test/service-worker.test.js ./test/design-md.test.js

      - name: Verify transcript and approval suites
        if: matrix.suite == 'tui-project'
        working-directory: packages/tui
        run: |
          bun test test/cli/tui/permission-interaction.test.tsx test/cli/tui/permission.test.ts test/cli/tui/guardrail.test.tsx test/util/permission.test.ts test/branding.test.ts
          bun test ./test/session-transcript-live-fixes.test.tsx -t "derives pending, running, terminal, cancelled, and overridden tool lifecycle states from durable time"

      - name: Verify goal continuation
        if: matrix.suite == 'tui-project'
        working-directory: packages/core
        run: |
          bun test test/session-execution.test.ts test/session-autonomy.test.ts
          bun test --timeout 40000 test/session-runner.test.ts -t "promotes queued input after continuation ends|resets the configured step allowance when steering input promotes|keeps the configured step allowance when only Dots peer input promotes|resets the step allowance when Dots peer input promotes with user steering|resets the step allowance when an ordinary synthetic input promotes without Dots attribution|promotes queued inputs one at a time in FIFO order|promotes queued input after steering continuation ends|promotes steers before the next queued input|coalesces multiple active steering prompts into one continuation step|preserves durable queued input for a later wake after interruption"

      - name: Verify typed decision suites
        if: matrix.suite == 'tui-runtime'
        working-directory: packages/core
        run: bun test test/decision-agent-provider.test.ts test/decision-agent.test.ts test/decision-judgment.test.ts test/decision.test.ts test/session-guardrail-service.test.ts

      - name: Verify Project ownership and native routing
        if: matrix.suite == 'tui-project'
        run: |
          bun test --cwd packages/core --timeout 40000 ./test/coordination.test.ts ./test/coordination-tool.test.ts ./test/coordination-runtime.test.ts ./test/coordination-assignment.test.ts ./test/coordination-hierarchy-prompt.test.ts ./test/coordination-decisions.test.ts ./test/decision-choice-redaction.test.ts ./script/migration.test.ts
          bun test --cwd packages/schema ./test/coordination.test.ts ./test/session-text.test.ts ./test/event-manifest.test.ts
          bun test --cwd packages/protocol ./test/form-contract.test.ts ./test/session-autonomy.test.ts ./test/session-autonomy-toggle.test.ts
          bun test --cwd packages/server --timeout 40000 ./test/coordination-http.test.ts ./test/form.test.ts ./test/permission.test.ts ./test/guardrail.test.ts ./test/session-autonomy.test.ts

      - name: Verify ownership upgrade and native decision boundaries
        if: matrix.suite == 'tui-project'
        run: bun test --cwd packages/core --timeout 40000 ./test/database-migration.test.ts ./test/coordination-decisions-native.test.ts ./test/coordination-decision-runtime.test.ts ./test/coordination-instructions.test.ts ./test/coordination-model-request.test.ts ./test/session-projector.test.ts

      - name: Verify footer state and short-terminal controls
        if: matrix.suite == 'tui-runtime'
        run: bun test --cwd packages/tui --timeout 40000 ./test/session-footer-autonomy.test.tsx ./test/isolated-browser-dialog.test.tsx ./test/cli/tui/projects-layout.test.tsx ./test/theme-v1-parity.test.ts

      - name: Verify compact Project and transcript layouts
        if: matrix.suite == 'tui-runtime'
        run: |
          bun test --cwd packages/tui --timeout 40000 ./test/cli/tui/session-rows-chronology.test.tsx ./test/cli/tui/sidebar-cache.test.tsx ./test/design-md.test.ts
          bun test --cwd packages/tui --timeout 40000 ./test/screen/subagent-picker-capture.test.tsx -t "captures populated subagent picker states at reference terminal dimensions|sizes picker metadata to the measured composer width with and without the docked rail"

      - name: Verify native Dots access and retirement boundaries
        if: matrix.suite == 'tui-runtime'
        run: |
          bun test --cwd packages/core --timeout 40000 ./test/dots-context.test.ts ./test/dots-access.test.ts ./test/dots-access-config.test.ts ./test/dots-native.test.ts ./test/dots-native-admission.test.ts ./test/dots-native-projection.test.ts ./test/dots-native-decisions.test.ts ./test/dots-retirement-promotion.test.ts
          bun test --cwd packages/schema ./test/dots.test.ts ./test/dots-report.test.ts ./test/dots-report-state.test.ts ./test/dots-access.test.ts ./test/dots-native-source.test.ts ./test/dots-retirement.test.ts
          bun test --cwd packages/protocol ./test/native-dots-only.test.ts
          bun test --cwd packages/server --timeout 40000 ./test/dots-access.test.ts
          bun test --cwd packages/remote ./test/dots-access-contract.test.ts
          bun test --cwd packages/client ./test/dots-peer.test.ts ./test/dots-access.test.ts ./test/dots-codegen.test.ts
          bun test --cwd packages/tui --timeout 40000 ./test/dots-connection.test.ts ./test/dots-connection-dialog.test.tsx ./test/dots-access-boundary.test.ts ./test/dots-delegation-review.test.tsx
          bun test --cwd packages/tui --timeout 40000 ./test/screen/dots.screen.test.ts -t "remote source attribution accepts resident reactive metadata"

      - name: Verify question grading and native Form views
        if: matrix.suite == 'tui-runtime'
        run: |
          bun test --cwd packages/core --timeout 40000 ./test/question-grading.test.ts
          bun test --cwd packages/core --timeout 40000 ./test/yolo-decision.test.ts -t "graded values retain their original mapping when an environment credential rotates during evaluation"
          bun test --cwd packages/schema ./test/form.test.ts
          bun test --cwd packages/tui --timeout 40000 ./test/cli/tui/form.test.tsx
          bun test --cwd packages/tui --timeout 40000 ./test/cli/tui/inline-tool-wrap-snapshot.test.tsx -t "filters malformed nested tool wire data|preserves native question selection modes|renders parsed multi-choice recommendations"

      - name: Verify subagent model selection boundaries
        if: matrix.suite == 'tui-runtime'
        run: |
          bun test --cwd packages/schema ./test/subagent-model-selection.test.ts
          bun test --cwd packages/core --timeout 40000 ./test/session-step-boundary.test.ts ./test/session-subagent-model-switch.test.ts
          bun test --cwd packages/server --timeout 40000 ./test/session-subagent-model-switch.test.ts
          bun test --cwd packages/client ./test/subagent-model-codegen.test.ts
          bun test --cwd packages/remote ./test/subagent-model-boundary.test.ts
          bun test --cwd packages/protocol ./test/session-orchestration.test.ts
          bun test --cwd packages/tui --timeout 40000 ./test/cli/tui/subagent-model-selection.test.tsx

      - name: Verify installer and web assets
        if: matrix.suite == 'web'
        run: |
          cd /tmp && bun test "$GITHUB_WORKSPACE/script/install.test.ts" "$GITHUB_WORKSPACE/script/build-web-assets.test.ts" "$GITHUB_WORKSPACE/script/release.test.ts" "$GITHUB_WORKSPACE/script/release-archive.test.ts"
          bun test "$GITHUB_WORKSPACE/script/chrome-for-testing.test.ts" -t "pins one exact version whose root metadata document is the default source"

      - name: Upload verified web build
        if: matrix.suite == 'web'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-web
          path: apps/web/dist/
          if-no-files-found: error
          retention-days: 7

  build:
    name: build ${{ matrix.target }}
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-26
            platform: darwin
            arch: arm64
          - target: darwin-x64
            runner: macos-15-intel
            platform: darwin
            arch: x64
          - target: linux-x64
            runner: ubuntu-24.04
            platform: linux
            arch: x64
          - target: windows-x64
            runner: windows-2025
            platform: win32
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      YCODING_MACOS_SIGNING_IDENTITY: YCoding Code Signing
      YCODING_MACOS_SIGNING_SHA1: 9dd524184b0db949ffac7f0ada0ae860ac7f5f85
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Resolve release version
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.version }}" ]; then
            version="${{ inputs.version }}"
          elif [[ "${{ github.ref_name }}" == v* ]]; then
            version="${{ github.ref_name }}"
            version="${version#v}"
          else
            version="$(ls docs/releases/v*.md | sed 's#.*/v##' | sed 's#\.md$##' | sort -V | tail -n 1)"
          fi
          echo "RELEASE_VERSION=$version" >>"$GITHUB_ENV"
          echo "YCODING_VERSION=$version" >>"$GITHUB_ENV"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          install-flags: --frozen-lockfile

      - name: Verify native build host
        env:
          EXPECTED_PLATFORM: ${{ matrix.platform }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          bun -e '
            if (process.platform !== process.env.EXPECTED_PLATFORM || process.arch !== process.env.EXPECTED_ARCH) {
              console.error(`Expected ${process.env.EXPECTED_PLATFORM}/${process.env.EXPECTED_ARCH}, got ${process.platform}/${process.arch}`)
              process.exit(1)
            }
          '

      - name: Import macOS signing identity
        if: runner.os == 'macOS'
        env:
          YCODING_MACOS_SIGNING_P12: ${{ secrets.YCODING_MACOS_SIGNING_P12 }}
          YCODING_MACOS_SIGNING_PASSWORD: ${{ secrets.YCODING_MACOS_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$YCODING_MACOS_SIGNING_P12" || { echo "Missing YCODING_MACOS_SIGNING_P12 Actions secret" >&2; exit 1; }
          test -n "$YCODING_MACOS_SIGNING_PASSWORD" || { echo "Missing YCODING_MACOS_SIGNING_PASSWORD Actions secret" >&2; exit 1; }
          keychain="$RUNNER_TEMP/ycoding-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          echo "::add-mask::$keychain_password"
          printf '%s' "$YCODING_MACOS_SIGNING_P12" | base64 --decode > "$RUNNER_TEMP/ycoding-signing.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/ycoding-signing.p12" -k "$keychain" -P "$YCODING_MACOS_SIGNING_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/ycoding-signing.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user | sed -e 's/^[[:space:]]*"//' -e 's/"$//' > "$RUNNER_TEMP/ycoding-keychains.txt"
          original=()
          while IFS= read -r line; do original+=("$line"); done < "$RUNNER_TEMP/ycoding-keychains.txt"
          security list-keychains -d user -s "$keychain" ${original[@]+"${original[@]}"}
          security find-identity -p codesigning "$keychain" | grep -F "$(printf '%s' "$YCODING_MACOS_SIGNING_SHA1" | tr a-f A-F) \"$YCODING_MACOS_SIGNING_IDENTITY\"" >/dev/null \
            || { echo "The signing bundle does not contain the pinned $YCODING_MACOS_SIGNING_IDENTITY certificate" >&2; exit 1; }

      - name: Build TUI artifact
        env:
          YCODING_ANTIGRAVITY_CLIENT_ID: ${{ secrets.YCODING_ANTIGRAVITY_CLIENT_ID }}
          YCODING_ANTIGRAVITY_CLIENT_SECRET: ${{ secrets.YCODING_ANTIGRAVITY_CLIENT_SECRET }}
        run: bun run build:tui

      - name: Verify build metadata
        run: |
          set -euo pipefail
          node -e 'const metadata = require("./dist/tui/tui-${{ matrix.target }}/package.json"); if (metadata.version !== process.env.YCODING_VERSION) process.exit(1)'

      - name: Verify standalone TUI build boundary
        if: matrix.target == 'linux-x64'
        run: bun test --cwd packages/cli ./test/import-boundaries.test.ts

      - name: Stage native executables
        run: |
          set -euo pipefail
          staging="dist/release-bin/${{ matrix.target }}"
          mkdir -p "$staging"
          cp "dist/tui/tui-${{ matrix.target }}/bin/ycoding${{ runner.os == 'Windows' && '.exe' || '' }}" "$staging/"
          cp -R "dist/tui/tui-${{ matrix.target }}/bin/ycoding-chrome-extension" "$staging/"
          if [ "${{ runner.os }}" = "macOS" ]; then
            cp -R "dist/tui/tui-${{ matrix.target }}/bin/YCoding Computer Use.app" "$staging/"
            codesign --verify --deep --strict "$staging/YCoding Computer Use.app"
            codesign -d -r- "$staging/YCoding Computer Use.app" 2>&1 | grep -Ex "designated => identifier \"app\.ycoding\.computer-use\" and certificate (leaf|root) = H\"$YCODING_MACOS_SIGNING_SHA1\"" >/dev/null
          fi

      - name: Create and validate native archive
        run: bun script/release-archive.ts create "${{ matrix.target }}" "$RELEASE_VERSION" "dist/release-bin/${{ matrix.target }}" "dist/release-archive/${{ matrix.target }}"

      - name: Upload native archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-archive-${{ matrix.target }}
          path: dist/release-archive/${{ matrix.target }}/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

      - name: Remove macOS signing keychain
        if: ${{ always() && runner.os == 'macOS' }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/ycoding-signing.keychain-db"
          saved="$RUNNER_TEMP/ycoding-keychains.txt"
          rm -f "$RUNNER_TEMP/ycoding-signing.p12"
          if [ -e "$saved" ]; then
            original=()
            while IFS= read -r line; do original+=("$line"); done < "$saved"
            if [ "${#original[@]}" -gt 0 ]; then security list-keychains -d user -s "${original[@]}"; fi
            rm -f "$saved"
          fi
          if [ -e "$keychain" ]; then security delete-keychain "$keychain"; fi

  release-tui:
    name: finalize and publish TUI release
    needs: [verify-source, build]
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Resolve release version
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.version }}" ]; then
            version="${{ inputs.version }}"
          elif [[ "${{ github.ref_name }}" == v* ]]; then
            version="${{ github.ref_name }}"
            version="${version#v}"
          else
            version="$(ls docs/releases/v*.md | sed 's#.*/v##' | sed 's#\.md$##' | sort -V | tail -n 1)"
          fi
          echo "RELEASE_VERSION=$version" >>"$GITHUB_ENV"

      - name: Download prepared target archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: downloaded
          pattern: release-archive-*
          merge-multiple: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
          bun-download-url: https://github.com/oven-sh/bun/releases/latest/download/bun-linux-x64-baseline.zip

      - name: Validate release archives and checksums
        run: bun script/release-archive.ts finalize "$RELEASE_VERSION" downloaded release

      - name: Upload release checksums
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-checksums-${{ env.RELEASE_VERSION }}
          path: release/*-checksums.txt
          if-no-files-found: error
          retention-days: 7

      - name: Publish GitHub release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="$RELEASE_VERSION"
          export RELEASE_TAG="v$version"
          prev="$(gh release list --limit 100 --json tagName --jq '[.[] | select(.tagName != env.RELEASE_TAG and (.tagName | test("^v[0-9]"))) | .tagName] | first // empty' 2>/dev/null || true)"
          prev="${prev:-$(gh api "repos/$GH_REPO/releases?per_page=100" --jq "[.[] | select(.tag_name != \"$RELEASE_TAG\" and .draft == false and (.tag_name | test(\"^v[0-9]\"))) | .tag_name] | first // empty" 2>/dev/null || true)}"
          range="${prev:+$prev...}$RELEASE_TAG"
          {
            cat "docs/releases/v$version.md"
            echo ""
            echo "**Full Changelog**: https://github.com/Althenia/ycoding/compare/$range"
          } > release-notes.md
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            bun script/release-publish.ts --repository "$GH_REPO" --tag "$RELEASE_TAG" --title "YCoding $version" --notes-file release-notes.md --run "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --manifest release-publish-manifest.json release/* "docs/releases/v$version.md"
          else
            gh release create "v$version" release/* "docs/releases/v$version.md" --verify-tag --title "YCoding $version" --notes-file release-notes.md
          fi

      - name: Upload release publication manifest
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-publish-manifest-${{ env.RELEASE_VERSION }}
          path: release-publish-manifest.json
          if-no-files-found: ignore
          retention-days: 90

  deploy-web:
    name: deploy web (cloudflare)
    needs: release-tui
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          install-flags: --frozen-lockfile

      - name: Download verified web build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-web
          path: apps/web/dist

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN Actions secret" >&2; exit 1; }
          bun run deploy:cloudflare

      - name: Deploy app preview Worker
        if: vars.YCODING_APP_PREVIEW_DEPLOY == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN Actions secret" >&2; exit 1; }
          bun run deploy:cloudflare-preview
