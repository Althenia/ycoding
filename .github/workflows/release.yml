name: release

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      version:
        description: Release version without leading v (for example 0.1.3). Defaults to the newest docs/releases version file.
        required: false
        default: ""

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  YCODING_CHANNEL: latest

jobs:
  verify-source:
    name: verify release source
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout release source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag is reachable from main
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Resolve release version
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.version }}" ]; then
            version="${{ inputs.version }}"
          elif [[ "${{ github.ref_name }}" == v* ]]; then
            version="${{ github.ref_name }}"
            version="${version#v}"
          else
            version="$(ls docs/releases/v*.md | sed 's#.*/v##' | sed 's#\.md$##' | sort -V | tail -n 1)"
          fi
          printf '%s\n' "$version" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$' \
            || { echo "Invalid release version: $version" >&2; exit 1; }
          echo "RELEASE_VERSION=$version" >>"$GITHUB_ENV"
          echo "YCODING_VERSION=$version" >>"$GITHUB_ENV"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          install-flags: --frozen-lockfile

      - name: Check workspace and types
        run: |
          bun run check:ycoding-workspace
          bun run check:ycoding-brand
          bun run typecheck
          bun run lint:effect-patterns

      - name: Verify CLI suites
        working-directory: packages/cli
        run: bun test --timeout 30000

      - name: Verify transcript and approval suites
        working-directory: packages/tui
        run: bun test test/session-transcript-live-fixes.test.tsx test/cli/tui/permission-interaction.test.tsx test/cli/tui/permission.test.ts test/util/permission.test.ts test/branding.test.ts

      - name: Verify goal continuation
        working-directory: packages/core
        run: bun test test/session-execution.test.ts test/session-autonomy.test.ts

      - name: Verify installer and documentation
        run: cd /tmp && bun test "$GITHUB_WORKSPACE/script/install.test.ts" "$GITHUB_WORKSPACE/script/pages.test.ts"

  build:
    name: build ${{ matrix.target }}
    needs: verify-source
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-latest
          - target: darwin-x64
            runner: macos-15-intel
          - target: linux-x64
            runner: ubuntu-24.04
          - target: windows-x64
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Resolve release version
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.version }}" ]; then
            version="${{ inputs.version }}"
          elif [[ "${{ github.ref_name }}" == v* ]]; then
            version="${{ github.ref_name }}"
            version="${version#v}"
          else
            version="$(ls docs/releases/v*.md | sed 's#.*/v##' | sed 's#\.md$##' | sort -V | tail -n 1)"
          fi
          echo "RELEASE_VERSION=$version" >>"$GITHUB_ENV"
          echo "YCODING_VERSION=$version" >>"$GITHUB_ENV"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          install-flags: --frozen-lockfile

      - name: Build TUI artifact
        run: bun run build:tui

      - name: Validate TUI artifact
        run: bun run smoke:tui

      - name: Validate runtime artifact
        run: bun run smoke:runtime

      - name: Verify build metadata
        run: |
          set -euo pipefail
          node -e 'const metadata = require("./dist/tui/tui-${{ matrix.target }}/package.json"); if (metadata.version !== process.env.YCODING_VERSION) process.exit(1)'

      - name: Upload native executable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ycoding-${{ matrix.target }}
          path: dist/tui/tui-${{ matrix.target }}/bin/ycoding${{ runner.os == 'Windows' && '.exe' || '' }}
          if-no-files-found: error
          retention-days: 7

  package:
    name: package release assets
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Resolve release version
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.version }}" ]; then
            version="${{ inputs.version }}"
          elif [[ "${{ github.ref_name }}" == v* ]]; then
            version="${{ github.ref_name }}"
            version="${version#v}"
          else
            version="$(ls docs/releases/v*.md | sed 's#.*/v##' | sed 's#\.md$##' | sort -V | tail -n 1)"
          fi
          echo "RELEASE_VERSION=$version" >>"$GITHUB_ENV"

      - name: Download native executables
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: unpacked
          pattern: ycoding-*

      - name: Create release archives and checksums
        run: |
          set -euo pipefail
          version="$RELEASE_VERSION"
          mkdir release
          chmod +x unpacked/ycoding-darwin-arm64/ycoding unpacked/ycoding-darwin-x64/ycoding unpacked/ycoding-linux-x64/ycoding
          test -x unpacked/ycoding-darwin-arm64/ycoding
          test -x unpacked/ycoding-darwin-x64/ycoding
          test -x unpacked/ycoding-linux-x64/ycoding
          tar -C unpacked/ycoding-darwin-arm64 -czf "release/ycoding-$version-darwin-arm64.tar.gz" ycoding
          tar -C unpacked/ycoding-darwin-x64 -czf "release/ycoding-$version-darwin-x64.tar.gz" ycoding
          tar -C unpacked/ycoding-linux-x64 -czf "release/ycoding-$version-linux-x64.tar.gz" ycoding
          (cd unpacked/ycoding-windows-x64 && zip "../../release/ycoding-$version-windows-x64.zip" ycoding.exe)
          tar -tzvf "release/ycoding-$version-darwin-arm64.tar.gz" | grep -q '^-rwx'
          tar -tzvf "release/ycoding-$version-darwin-x64.tar.gz" | grep -q '^-rwx'
          tar -tzvf "release/ycoding-$version-linux-x64.tar.gz" | grep -q '^-rwx'
          (cd release && sha256sum "ycoding-$version-"*.tar.gz "ycoding-$version-"*.zip > "ycoding-$version-checksums.txt")

      - name: Upload prepared release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets-${{ env.RELEASE_VERSION }}
          path: release/
          if-no-files-found: error
          retention-days: 7

  release:
    name: publish release
    needs: package
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Resolve release version
        run: |
          set -euo pipefail
          version="${{ github.ref_name }}"
          version="${version#v}"
          echo "RELEASE_VERSION=$version" >>"$GITHUB_ENV"

      - name: Download prepared release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets-${{ env.RELEASE_VERSION }}
          path: release

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="$RELEASE_VERSION"
          export RELEASE_TAG="v$version"
          gh release view "v$version" >/dev/null 2>&1 && {
            echo "Release v$version already exists"
            exit 1
          }
          prev="$(gh release list --limit 100 --json tagName --jq '[.[] | select(.tagName != env.RELEASE_TAG) | .tagName] | first // empty' 2>/dev/null || true)"
          prev="${prev:-$(gh api "repos/$GH_REPO/releases?per_page=100" --jq "[.[] | select(.tag_name != \"v$version\" and .draft == false) | .tag_name] | first // empty" 2>/dev/null || true)}"
          range="${prev:+$prev...}v$version"
          {
            cat "docs/releases/v$version.md"
            echo ""
            echo "**Full Changelog**: https://github.com/Althenia/ycoding/compare/$range"
          } > release-notes.md
          gh release create "v$version" release/* "docs/releases/v$version.md" --verify-tag --title "YCoding $version" --notes-file release-notes.md
