name: release

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      version:
        description: Release version without leading v (for example 0.7.0). Defaults to the newest docs/releases/v<version>.md file.
        required: false
        default: ""

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  YCODING_CHANNEL: latest

jobs:
  verify-source:
    name: verify release source
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout release source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag is reachable from main
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Resolve release version
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.version }}" ]; then
            version="${{ inputs.version }}"
          elif [[ "${{ github.ref_name }}" == v* ]]; then
            version="${{ github.ref_name }}"
            version="${version#v}"
          else
            version="$(ls docs/releases/v*.md | sed 's#.*/v##' | sed 's#\.md$##' | sort -V | tail -n 1)"
          fi
          printf '%s\n' "$version" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$' \
            || { echo "Invalid release version: $version" >&2; exit 1; }
          echo "RELEASE_VERSION=$version" >>"$GITHUB_ENV"
          echo "YCODING_VERSION=$version" >>"$GITHUB_ENV"

      - name: Verify release notes exist
        run: |
          set -euo pipefail
          release_notes="docs/releases/v$RELEASE_VERSION.md"
          test -f "$release_notes" || { echo "Missing release notes: $release_notes" >&2; exit 1; }
          test -s "$release_notes" || { echo "Release notes are empty: $release_notes" >&2; exit 1; }

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          install-flags: --frozen-lockfile

      - name: Check workspace and types
        run: |
          bun run check:ycoding-workspace
          bun run check:ycoding-brand
          bun run typecheck
          bun run lint:effect-patterns

      - name: Verify web application and relay
        run: |
          bun run test:web
          bun run test:remote

      - name: Build web application
        run: bun run build:web

      - name: Verify built web integration
        run: bun run test:integration:web

      - name: Verify local remote integration
        timeout-minutes: 20
        run: bun run test:integration:remote

      - name: Verify Cloudflare Worker
        run: |
          bun run test:cloudflare
          bun run build:cloudflare

      - name: Verify CLI suites
        working-directory: packages/cli
        run: bun test --timeout 30000

      - name: Verify transcript and approval suites
        working-directory: packages/tui
        run: bun test test/session-transcript-live-fixes.test.tsx test/cli/tui/permission-interaction.test.tsx test/cli/tui/permission.test.ts test/util/permission.test.ts test/branding.test.ts

      - name: Verify goal continuation
        working-directory: packages/core
        run: bun test test/session-execution.test.ts test/session-autonomy.test.ts

      - name: Verify installer and web assets
        run: cd /tmp && bun test "$GITHUB_WORKSPACE/script/install.test.ts" "$GITHUB_WORKSPACE/script/build-web-assets.test.ts" "$GITHUB_WORKSPACE/script/release.test.ts"

  build:
    name: build ${{ matrix.target }}
    needs: verify-source
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-26
            platform: darwin
            arch: arm64
          - target: darwin-x64
            runner: macos-15-intel
            platform: darwin
            arch: x64
          - target: linux-x64
            runner: ubuntu-24.04
            platform: linux
            arch: x64
          - target: windows-x64
            runner: windows-2025
            platform: win32
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Resolve release version
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.version }}" ]; then
            version="${{ inputs.version }}"
          elif [[ "${{ github.ref_name }}" == v* ]]; then
            version="${{ github.ref_name }}"
            version="${version#v}"
          else
            version="$(ls docs/releases/v*.md | sed 's#.*/v##' | sed 's#\.md$##' | sort -V | tail -n 1)"
          fi
          echo "RELEASE_VERSION=$version" >>"$GITHUB_ENV"
          echo "YCODING_VERSION=$version" >>"$GITHUB_ENV"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          install-flags: --frozen-lockfile

      - name: Verify native build host
        env:
          EXPECTED_PLATFORM: ${{ matrix.platform }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          bun -e '
            if (process.platform !== process.env.EXPECTED_PLATFORM || process.arch !== process.env.EXPECTED_ARCH) {
              console.error(`Expected ${process.env.EXPECTED_PLATFORM}/${process.env.EXPECTED_ARCH}, got ${process.platform}/${process.arch}`)
              process.exit(1)
            }
          '

      # A stable Developer ID signature keeps macOS privacy grants for YCoding Computer Use across updates.
      - name: Import macOS signing identity
        if: ${{ runner.os == 'macOS' }}
        env:
          MACOS_SIGNING_CERTIFICATE: ${{ secrets.MACOS_SIGNING_CERTIFICATE }}
          MACOS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          test -n "$MACOS_SIGNING_CERTIFICATE" || { echo "Missing MACOS_SIGNING_CERTIFICATE Actions secret" >&2; exit 1; }
          test -n "$MACOS_SIGNING_CERTIFICATE_PASSWORD" || { echo "Missing MACOS_SIGNING_CERTIFICATE_PASSWORD Actions secret" >&2; exit 1; }
          test -n "$MACOS_SIGNING_IDENTITY" || { echo "Missing MACOS_SIGNING_IDENTITY Actions secret" >&2; exit 1; }
          keychain="$RUNNER_TEMP/ycoding-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          printf '%s' "$MACOS_SIGNING_CERTIFICATE" | base64 --decode >"$RUNNER_TEMP/ycoding-signing.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/ycoding-signing.p12" -k "$keychain" -P "$MACOS_SIGNING_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/ycoding-signing.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain" | grep -F "\"$MACOS_SIGNING_IDENTITY\"" >/dev/null ||
            { echo "MACOS_SIGNING_IDENTITY is not a valid code-signing identity in MACOS_SIGNING_CERTIFICATE" >&2; exit 1; }
          echo "YCODING_MACOS_SIGNING_IDENTITY=$MACOS_SIGNING_IDENTITY" >>"$GITHUB_ENV"

      - name: Build TUI artifact
        run: bun run build:tui

      - name: Validate TUI artifact
        run: bun run smoke:tui

      - name: Validate runtime artifact
        run: bun run smoke:runtime

      - name: Verify build metadata
        run: |
          set -euo pipefail
          node -e 'const metadata = require("./dist/tui/tui-${{ matrix.target }}/package.json"); if (metadata.version !== process.env.YCODING_VERSION) process.exit(1)'

      - name: Stage native executables
        run: |
          set -euo pipefail
          staging="dist/release-bin/${{ matrix.target }}"
          mkdir -p "$staging"
          cp "dist/tui/tui-${{ matrix.target }}/bin/ycoding${{ runner.os == 'Windows' && '.exe' || '' }}" "$staging/"
          cp -R "dist/tui/tui-${{ matrix.target }}/bin/ycoding-chrome-extension" "$staging/"
          if [ "${{ runner.os }}" = "macOS" ]; then
            cp -R "dist/tui/tui-${{ matrix.target }}/bin/YCoding Computer Use.app" "$staging/"
            codesign --verify --deep --strict "$staging/YCoding Computer Use.app"
            if codesign -d -r- "$staging/YCoding Computer Use.app" 2>&1 | grep -F "designated => cdhash" >/dev/null; then
              echo "YCoding Computer Use.app must be signed with the stable Developer ID identity" >&2
              exit 1
            fi
          fi

      - name: Upload native executables
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ycoding-${{ matrix.target }}
          path: dist/release-bin/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 7

  isolated-browser-acceptance:
    name: isolated browser acceptance (darwin-arm64, Chrome 152+)
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          install-flags: --frozen-lockfile

      - name: Verify approved browser host
        run: |
          set -euo pipefail
          bun -e '
            if (process.platform !== "darwin" || process.arch !== "arm64") {
              console.error(`Expected darwin/arm64, got ${process.platform}/${process.arch}`)
              process.exit(1)
            }
          '
          chrome="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
          test -x "$chrome" || { echo "Google Chrome is not installed at the approved path" >&2; exit 1; }
          version="$("$chrome" --version)"
          major="$(printf '%s\n' "$version" | sed -E 's/.* ([0-9]+)\..*/\1/')"
          case "$major" in
            '' | *[!0-9]*) major=0 ;;
          esac
          test "$major" -ge 152 || {
            echo "Isolated-browser acceptance requires installed Google Chrome major 152 or newer; found: $version" >&2
            exit 1
          }

      - name: Verify isolated-browser integration suites
        run: bun run test:integration:browser

      - name: Download darwin-arm64 executable
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ycoding-darwin-arm64
          path: dist/isolated-browser

      - name: Verify packaged isolated browser
        run: |
          set -euo pipefail
          chmod +x dist/isolated-browser/ycoding
          bun run --cwd packages/cli script/isolated-browser-smoke.ts --binary="$GITHUB_WORKSPACE/dist/isolated-browser/ycoding"

  package:
    name: package TUI release assets
    needs: [build, isolated-browser-acceptance]
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Resolve release version
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.version }}" ]; then
            version="${{ inputs.version }}"
          elif [[ "${{ github.ref_name }}" == v* ]]; then
            version="${{ github.ref_name }}"
            version="${version#v}"
          else
            version="$(ls docs/releases/v*.md | sed 's#.*/v##' | sed 's#\.md$##' | sort -V | tail -n 1)"
          fi
          echo "RELEASE_VERSION=$version" >>"$GITHUB_ENV"

      - name: Download native executables
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: unpacked
          pattern: ycoding-*

      - name: Create release archives and checksums
        run: |
          set -euo pipefail
          version="$RELEASE_VERSION"
          mkdir release
          chmod +x unpacked/ycoding-darwin-arm64/ycoding "unpacked/ycoding-darwin-arm64/YCoding Computer Use.app/Contents/MacOS/ycoding-computer-use" unpacked/ycoding-darwin-x64/ycoding "unpacked/ycoding-darwin-x64/YCoding Computer Use.app/Contents/MacOS/ycoding-computer-use" unpacked/ycoding-linux-x64/ycoding
          test -x unpacked/ycoding-darwin-arm64/ycoding
          test -x unpacked/ycoding-darwin-x64/ycoding
          for target in darwin-arm64 darwin-x64; do
            app="unpacked/ycoding-$target/YCoding Computer Use.app"
            test -d "$app" && test ! -L "$app"
            test "$(find "$app" -mindepth 1 -printf '%P\n' | LC_ALL=C sort)" = "$(printf '%s\n' Contents Contents/Info.plist Contents/MacOS Contents/MacOS/ycoding-computer-use Contents/Resources Contents/Resources/YCoding.icns Contents/_CodeSignature Contents/_CodeSignature/CodeResources | LC_ALL=C sort)"
            test -f "$app/Contents/Info.plist" && test ! -L "$app/Contents/Info.plist" && test -s "$app/Contents/Info.plist"
            test -f "$app/Contents/_CodeSignature/CodeResources" && test ! -L "$app/Contents/_CodeSignature/CodeResources" && test -s "$app/Contents/_CodeSignature/CodeResources"
            test -f "$app/Contents/MacOS/ycoding-computer-use" && test ! -L "$app/Contents/MacOS/ycoding-computer-use" && test -x "$app/Contents/MacOS/ycoding-computer-use"
            test -f "$app/Contents/Resources/YCoding.icns" && test ! -L "$app/Contents/Resources/YCoding.icns" && test -s "$app/Contents/Resources/YCoding.icns"
            grep -Fq '<key>CFBundleIdentifier</key><string>app.ycoding.computer-use</string>' "$app/Contents/Info.plist"
            grep -Fq '<key>CFBundleDisplayName</key><string>YCoding Computer Use</string>' "$app/Contents/Info.plist"
            grep -Fq '<key>CFBundleIconFile</key><string>YCoding.icns</string>' "$app/Contents/Info.plist"
          done
          test -x unpacked/ycoding-linux-x64/ycoding
          mac_entries=(ycoding ycoding-chrome-extension)
          version_core="${version%%+*}"
          prerelease=false
          if [[ "$version_core" == *-* ]]; then prerelease=true; fi
          if printf '%s\n' "${version_core%%-*}" | awk -F . -v prerelease="$prerelease" '
            $1 > 0 || ($1 == 0 && ($2 > 7 || ($2 == 7 && ($3 > 1 || ($3 == 1 && prerelease == "false"))))) { found=1 }
            END { exit !found }
          '; then mac_entries+=("YCoding Computer Use.app"); fi
          tar -C unpacked/ycoding-darwin-arm64 -czf "release/ycoding-$version-darwin-arm64.tar.gz" "${mac_entries[@]}"
          tar -C unpacked/ycoding-darwin-x64 -czf "release/ycoding-$version-darwin-x64.tar.gz" "${mac_entries[@]}"
          tar -C unpacked/ycoding-linux-x64 -czf "release/ycoding-$version-linux-x64.tar.gz" ycoding ycoding-chrome-extension
          (cd unpacked/ycoding-windows-x64 && zip -r "../../release/ycoding-$version-windows-x64.zip" ycoding.exe ycoding-chrome-extension)
          tar -tzvf "release/ycoding-$version-darwin-arm64.tar.gz" | grep '^-rwx' >/dev/null
          tar -tzvf "release/ycoding-$version-darwin-x64.tar.gz" | grep '^-rwx' >/dev/null
          tar -tzvf "release/ycoding-$version-linux-x64.tar.gz" | grep '^-rwx' >/dev/null
          tar -tzf "release/ycoding-$version-darwin-arm64.tar.gz" | grep -x 'YCoding Computer Use.app/Contents/MacOS/ycoding-computer-use' >/dev/null
          tar -tzf "release/ycoding-$version-darwin-x64.tar.gz" | grep -x 'YCoding Computer Use.app/Contents/MacOS/ycoding-computer-use' >/dev/null
          tar -tzf "release/ycoding-$version-darwin-arm64.tar.gz" | grep -x 'ycoding-chrome-extension/manifest.json' >/dev/null
          tar -tzf "release/ycoding-$version-darwin-x64.tar.gz" | grep -x 'ycoding-chrome-extension/manifest.json' >/dev/null
          tar -tzf "release/ycoding-$version-linux-x64.tar.gz" | grep -x 'ycoding-chrome-extension/manifest.json' >/dev/null
          # One checksum file covers every released archive, so the installer
          # verifies each download with the same rule.
          (cd release && sha256sum "ycoding-$version-"*.tar.gz "ycoding-$version-"*.zip > "ycoding-$version-checksums.txt")

      - name: Upload prepared release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets-${{ env.RELEASE_VERSION }}
          path: release/
          if-no-files-found: error
          retention-days: 7

  release-tui:
    name: publish TUI release
    needs: deploy-web
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Resolve release version
        run: |
          set -euo pipefail
          version="${{ github.ref_name }}"
          version="${version#v}"
          echo "RELEASE_VERSION=$version" >>"$GITHUB_ENV"

      - name: Download prepared release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets-${{ env.RELEASE_VERSION }}
          path: release

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="$RELEASE_VERSION"
          export RELEASE_TAG="v$version"
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 && {
            echo "Release $RELEASE_TAG already exists"
            exit 1
          }
          prev="$(gh release list --limit 100 --json tagName --jq '[.[] | select(.tagName != env.RELEASE_TAG and (.tagName | test("^v[0-9]"))) | .tagName] | first // empty' 2>/dev/null || true)"
          prev="${prev:-$(gh api "repos/$GH_REPO/releases?per_page=100" --jq "[.[] | select(.tag_name != \"$RELEASE_TAG\" and .draft == false and (.tag_name | test(\"^v[0-9]\"))) | .tag_name] | first // empty" 2>/dev/null || true)}"
          range="${prev:+$prev...}$RELEASE_TAG"
          {
            cat "docs/releases/v$version.md"
            echo ""
            echo "**Full Changelog**: https://github.com/Althenia/ycoding/compare/$range"
          } > release-notes.md
          gh release create "v$version" release/* "docs/releases/v$version.md" --verify-tag --title "YCoding $version" --notes-file release-notes.md

  deploy-web:
    name: deploy web (cloudflare)
    needs: [verify-source, package]
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          install-flags: --frozen-lockfile

      - name: Build web
        run: bun run build:web

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN Actions secret" >&2; exit 1; }
          bun run deploy:cloudflare
