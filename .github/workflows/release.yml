name: release

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      version:
        description: Release version without leading v (for example 0.7.0). Defaults to the newest docs/releases/v<version>.md file.
        required: false
        default: ""

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  YCODING_CHANNEL: latest
  REQUESTED_RELEASE_VERSION: ${{ inputs.version }}
  RELEASE_REF_NAME: ${{ github.ref_name }}
  RELEASE_REF_TYPE: ${{ github.ref_type }}

jobs:
  verify-source:
    name: verify release source (${{ matrix.suite }})
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && !github.event.deleted && startsWith(github.ref, 'refs/tags/v')) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: types
            runner: ubuntu-24.04
          - suite: web
            runner: ubuntu-24.04
          - suite: cli
            runner: ubuntu-24.04
          - suite: cli-antigravity
            runner: ubuntu-24.04
          - suite: cli-muse
            runner: ubuntu-24.04
          - suite: tui-project
            runner: ubuntu-24.04
          - suite: tui-runtime
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - name: Checkout release source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: ${{ github.event_name == 'push' && 1 || 0 }}
          persist-credentials: false

      - name: Verify release tag provenance
        if: github.event_name == 'push'
        run: bash script/release-version.sh --verify-tag

      - name: Resolve release version
        run: bash script/release-version.sh

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          install-flags: --frozen-lockfile

      - name: Cache Turbo
        if: matrix.suite == 'types'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/turbo
          key: turbo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('turbo.json', 'tsconfig.json', 'bun.lock') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('turbo.json', 'tsconfig.json', 'bun.lock') }}-
            turbo-${{ runner.os }}-${{ runner.arch }}-

      - name: Check workspace and types
        if: matrix.suite == 'types'
        run: |
          bun run check:ycoding-workspace
          bun test --cwd script ./ycoding-workspace.test.ts
          bun run check:ycoding-brand
          bun test --cwd script ./typecheck-cache.integration.test.ts
          bun run typecheck
          bun run lint:effect-patterns
          bun test --cwd packages/core ./test/aisdk.test.ts -t "AI SDK incomplete completion|AI SDK disabled-tool declarations"
          bun test --cwd packages/core --timeout 40000 ./test/session-runner.test.ts -t "disabled-tool declarations|rejects a declared (Google|Codex|OpenAI SDK) tool during terminal recovery|fails provider-executed tool-only terminal response recovery without a third request|fails repeated (empty|reasoning-only) responses without a third response step"

      - name: Verify stored OpenAI Responses continuation
        if: matrix.suite == 'types'
        run: |
          bun test --cwd packages/ai ./test/provider/openai-responses.test.ts
          bun test --cwd packages/core ./test/openai-api-key-cache-boundary.test.ts

      - name: Verify Interaction wire and runtime boundaries
        if: matrix.suite == 'types'
        run: |
          bun test --cwd packages/schema ./test/interaction.test.ts
          bun test --cwd packages/protocol ./test/interaction.test.ts
          bun test --cwd packages/client ./test/session-interaction.test.ts
          bun test --cwd packages/core ./test/interaction.test.ts ./test/interaction-chrome.test.ts ./test/interaction-macos.test.ts
          bun test --cwd packages/server ./test/interaction.test.ts ./test/interaction-platform.test.ts

      - name: Verify web application and relay
        if: matrix.suite == 'web'
        run: |
          bun test --cwd apps/web ./src/content/changelog.test.ts ./src/content/docs/registry.test.ts ./src/remote/autonomy-source.test.ts ./src/remote/autonomy.test.ts ./src/remote/coordination.test.ts ./src/remote/prediction.test.ts ./src/remote/project-escalation.test.ts ./src/remote/projection.test.ts ./src/remote/prompt-generate.test.ts ./src/remote/queries.test.ts ./src/remote/ui/autonomous-panel.test.tsx ./src/remote/ui/command-palette-model.test.ts ./src/remote/ui/composer-action.test.ts ./src/remote/ui/composer-layout.test.ts ./src/remote/ui/composer-logic.test.ts ./src/remote/ui/provider-logo.test.ts ./src/remote/ui/remote-redesign.test.ts ./src/remote/ui/settings-layout.test.ts ./src/remote/ui/status-bar.test.ts ./src/remote/ui/todo-panel.test.ts ./src/remote/ui/transcript-rows.test.ts ./src/remote/ui/usage-accounting.test.ts ./src/remote/ui/usage-filters.test.ts ./src/remote/ui/usage-layout.test.ts ./src/remote/view-model.test.ts ./src/styles/design-md.test.ts ./src/styles/composition.test.ts ./src/remote/form-contract.test.ts ./src/remote/question-history.test.ts
          bun test --cwd packages/remote ./test/contract.test.ts ./test/coordination.test.ts ./test/completions.test.ts ./test/provider-auth.test.ts
          bun test --cwd apps/web ./src/content/boundary.test.ts ./src/content/site.test.ts

      - name: Build web application
        if: matrix.suite == 'web'
        run: bun run build:web

      - name: Verify injected web transport boundaries
        if: matrix.suite == 'web'
        run: |
          bun test --cwd apps/web ./test/remote-store-container.test.ts
          bun test --cwd apps/web ./src/remote/endpoint.test.ts ./src/pwa/offline.test.ts ./src/service-worker.push.test.ts ./src/remote/notifications.test.ts ./src/remote/alert.test.ts ./src/remote/invite.test.ts
          bun test --cwd apps/web ./src/remote/catalog.test.ts ./src/remote/keep-awake.test.ts
          bun test --cwd apps/web ./test/remote-http.test.ts ./test/remote-http-bulk.test.ts
          bun test --cwd apps/web ./test/remote-sync.test.ts -t 'oversized live invalidations'
          bun test --cwd packages/protocol ./test/http-bulk.test.ts
          bun test --cwd apps/web ./test/dots.test.ts ./src/remote/ui/dots-composer.test.ts
          bun test --cwd apps/web ./test/remote-todo.test.ts -t "a connector that never answers todo.list does not hold Session hydration or raise a state notice|a superseded same-Session read cannot overwrite reconnect's newer todo list"
          bun test --cwd apps/web ./test/remote-guardrail.test.ts -t "preserves inspectable guardrail metadata in the family read"

      - name: Verify Cloudflare Worker
        if: matrix.suite == 'web'
        run: |
          bun test --cwd infra/cloudflare ./test/mcp-boundary.test.ts ./test/relay-core.test.ts ./test/auth-service.test.ts ./test/push-coordination-filter.test.ts ./test/device-alias.test.ts
          bun test --cwd infra/cloudflare ./test/router.test.ts -t 'websocket upgrades|message stream forwards|v5 message and attachment bulk selectors|relay presence|closes every device|after rotation|revokes an owned device|static asset delegation'
          bun test --cwd infra/cloudflare ./test/config.test.ts ./test/push-send.test.ts ./test/push-router.test.ts
          bun test --cwd infra/cloudflare ./test/relay-authority.test.ts ./test/relay-handoff.test.ts ./test/relay-http.test.ts ./test/relay-mcp.test.ts ./test/relay-resync.test.ts
          bun run build:cloudflare

      - name: Verify CLI suites
        if: matrix.suite == 'cli'
        working-directory: packages/cli
        run: |
          bun test --timeout 30000 ./test/binary-name.test.ts ./test/install-local.test.ts ./test/update.test.ts ./test/chrome-extension-packaging.test.ts ./test/build-bytecode.test.ts ./test/remote-operations.test.ts ./test/remote-retirement.test.ts ./test/remote-decision-boundary.test.ts ./test/remote-control-config.test.ts ./test/remote-control-native.test.ts ./test/remote-control-native-escalation.test.ts ./test/remote-control-projection.test.ts ./test/remote-control-sequence.test.ts ./test/remote-control-stream-isolation.test.ts
          bun test --timeout 30000 ./test/computer-use-packaging.test.ts -t "filters unsupported targets without planning a native helper|plans a sibling helper for each supported macOS architecture|signs with a configured stable identity and a secure timestamp, otherwise ad hoc|keeps only complete artifacts when the host cannot compile the macOS helper|plans the explicit source-development helper in Core's ignored cache|rejects a macOS package without the signed application bundle|rejects an unexpected macOS application bundle in a non-macOS package"
          bun test --timeout 30000 ./test/remote-bridge.test.ts -t "remote bridge|global Dots reads remain available during a pending write without Session inventory|quota observations use the global control frame without Session subscriptions or private fields|quota pending results retry through the existing refresh and settled results stop retries|expired and malformed quota events never enter the relay queue|quota retry survives connection replacement and ignores the replaced connection's receipt|ID-only shell deletions invalidate family lists without forwarding shell identities|pages explicit completion receipts without a browser subscription and refreshes on accepted completion|retries a failed completion page without declaring a partial baseline complete|discards a pending completion page from a prior opening of the same connection|live completion receipts wait for a complete baseline and reject stale or child ownership|pending-request events invalidate shared list classification before the next cursor or carousel read"
          bun test --timeout 30000 ./test/remote-control.test.ts -t "remote-control wire types|remote-control envelope|remote-control app-server mapping|state store persists installation and enrollment without configuration or tokens|host enrolls, connects with headers, serves one RPC, and answers ping with pong|enabling reports connecting before credentials resolve|fresh host enrolls when only an old websocket URL key exists|fresh host refreshes saved enrollment and uses the refreshed token|refresh 404 deletes the enrollment and re-enrolls; unrecognized enroll 404 preserves and fails closed"
          bun test --timeout 30000 ./test/remote-access.test.ts -t "global Dots operations need no Session inventory and preserve exact revision and conflicts"

      - name: Verify native decision follow
        if: matrix.suite == 'cli'
        working-directory: packages/cli
        run: |
          bun test --timeout 30000 ./test/decision-follow-state.test.ts ./test/decision-follow.test.ts ./test/decision-follow-command.test.ts
          bun test --timeout 30000 ./test/decision-watch.test.ts -t "both entrypoints advertise|already pending decision|every decision kind|completion is reported only|failed, interrupted, and rejected|timeout reports progress|resume command keeps|root accepted receipt|a family checkpoint|checkpoint boundary: rejects invalid|explicit conflicting root cursor is rejected|zero cursor against absent watermark rejects|assessment cut off by the deadline|read cut off by the deadline outside the assessment|resumed after an unavailable assessment|cancelling or killing a watch during a stalled assessment|queued work in outstanding data blocks completion only inside the watched scope"

      - name: Verify Antigravity provider and build fixture boundaries
        if: matrix.suite == 'cli-antigravity'
        run: |
          bun test --cwd packages/core ./test/plugin/provider-antigravity.test.ts ./test/plugin/provider-antigravity-signature-replay.test.ts
          bun test --cwd packages/cli/script ./antigravity-build-env.test.ts ./antigravity-build.test.ts

      - name: Verify Muse provider and build fixture boundaries
        if: matrix.suite == 'cli-muse'
        run: |
          bun test --cwd packages/core ./test/plugin/provider-muse.test.ts ./test/plugin/provider-muse-tools.test.ts ./test/provider-usage-muse.test.ts
          bun test --cwd packages/cli/script ./muse-build-env.test.ts ./muse-build.test.ts

      - name: Verify Chrome extension suites
        if: matrix.suite == 'cli'
        run: bun test --cwd extensions/chrome ./test/protocol.test.js ./test/service-worker.test.js ./test/design-md.test.js

      - name: Verify Interaction connector and extension
        if: matrix.suite == 'cli'
        run: |
          bun test --cwd packages/cli ./test/interaction-platform.test.ts ./test/remote-interaction.test.ts
          bun test --cwd packages/remote ./test/interaction.test.ts
          bun test --cwd extensions/interaction-chrome ./test/interaction-chrome-controller.test.js

      - name: Verify transcript and approval suites
        if: matrix.suite == 'tui-project'
        working-directory: packages/tui
        run: |
          bun test test/cli/tui/permission-interaction.test.tsx test/cli/tui/permission.test.ts test/cli/tui/guardrail.test.tsx test/util/permission.test.ts test/branding.test.ts
          bun test ./test/session-transcript-live-fixes.test.tsx -t "derives pending, running, terminal, cancelled, and overridden tool lifecycle states from durable time"

      - name: Verify goal continuation
        if: matrix.suite == 'tui-project'
        working-directory: packages/core
        run: |
          bun test test/session-execution.test.ts test/session-autonomy.test.ts
          bun test --timeout 40000 test/session-runner.test.ts -t "promotes queued input after continuation ends|resets the configured step allowance when steering input promotes|keeps the configured step allowance when only Dots peer input promotes|resets the step allowance when Dots peer input promotes with user steering|resets the step allowance when an ordinary synthetic input promotes without Dots attribution|promotes queued inputs one at a time in FIFO order|promotes queued input after steering continuation ends|promotes steers before the next queued input|coalesces multiple active steering prompts into one continuation step|preserves durable queued input for a later wake after interruption"

      - name: Verify native release bootstrap
        if: matrix.suite == 'tui-runtime'
        run: bun test --cwd script ./native-bootstrap.test.ts ./native-setup-release.test.ts ./runtime-receipt.test.ts "$GITHUB_WORKSPACE/packages/cli/test/runtime-build.test.ts"

      - name: Setup Rust for native contracts
        if: matrix.suite == 'tui-runtime'
        uses: ./.github/actions/setup-rust
        with:
          cache-profile: dev

      - name: Build and verify native runtime receipt
        if: matrix.suite == 'tui-runtime'
        env:
          RECEIPT_TARGET: linux-x64
        run: |
          set -euo pipefail
          cargo build --locked --manifest-path rust/Cargo.toml -p ycoding-runtime --bin ycoding-runtime
          bash script/runtime-receipt.sh write rust/target/debug/ycoding-runtime "$RUNNER_TEMP/runtime-receipt"
          bash script/runtime-receipt.sh verify "$RUNNER_TEMP/runtime-receipt" "$RUNNER_TEMP/verified-runtime/ycoding-runtime"

      - name: Verify native contract boundaries
        if: matrix.suite == 'tui-runtime'
        run: |
          cargo test --locked --manifest-path rust/Cargo.toml -p ycoding-schema --test autonomy_review
          cargo test --locked --manifest-path rust/Cargo.toml -p ycoding-protocol --test wire_session
          cargo test --locked --manifest-path rust/Cargo.toml -p ycoding-protocol --test connection ac_wire_002_handshake_invalid_input_matrix_dispatches_nothing
          cargo test --locked --manifest-path rust/Cargo.toml -p ycoding-core --test coordination_admission admitted_project_input_reaches_execution_through_pause_gate_restart_and_settlement -- --exact
          cargo test --locked --manifest-path rust/Cargo.toml -p ycoding-runtime --test daily_workflows restarting_with_a_running_root_tool_exposes_its_unknown_effect_without_resuming -- --exact
          cargo test --locked --manifest-path rust/Cargo.toml -p ycoding-runtime --test events reconnect_reconciles_an_unacknowledged_prompt_by_its_durable_identity -- --exact

      - name: Verify native startup diagnostics
        if: matrix.suite == 'tui-runtime'
        run: |
          cargo test --locked --manifest-path rust/Cargo.toml -p ycoding-runtime --test service_failed_boot failed_composition_registration_deletion_stops_owner_and_releases_listener -- --exact
          cargo test --locked --manifest-path rust/Cargo.toml -p ycoding-runtime --test service_failed_boot failed_store_boot_retains_native_owner_until_authenticated_exact_instance_stop -- --exact
          cargo test --locked --manifest-path rust/Cargo.toml -p ycoding-runtime --lib production::tests::retention_settings_fail_startup_when_the_first_load_fails -- --exact

      - name: Verify Session pin durability
        if: matrix.suite == 'tui-runtime'
        run: |
          cargo test --locked --manifest-path rust/Cargo.toml -p ycoding-core --test session_lifecycle duplicate_pin_leaves_the_file_unchanged_and_pin_follows_a_queued_unpin -- --exact
          cargo test --locked --manifest-path rust/Cargo.toml -p ycoding-core --test session_lifecycle pin_and_unpin_toggle_the_pinned_time_and_ignore_repeats -- --exact
          cargo test --locked --manifest-path rust/Cargo.toml -p ycoding-store --lib engine::tests::ordinary_empty_submissions_and_both_reclaim_passes_sync -- --exact

      - name: Verify typed decision suites
        if: matrix.suite == 'tui-runtime'
        working-directory: packages/core
        run: bun test test/decision-agent-provider.test.ts test/decision-agent.test.ts test/decision-judgment.test.ts test/decision.test.ts test/session-guardrail-service.test.ts

      - name: Verify Project ownership and native routing
        if: matrix.suite == 'tui-project'
        run: |
          bun test --cwd packages/core --timeout 40000 ./test/coordination.test.ts ./test/coordination-tool.test.ts ./test/coordination-runtime.test.ts ./test/coordination-assignment.test.ts ./test/coordination-hierarchy-prompt.test.ts ./test/coordination-decisions.test.ts ./test/decision-choice-redaction.test.ts ./script/migration.test.ts
          bun test --cwd packages/schema ./test/coordination.test.ts ./test/session-text.test.ts ./test/event-manifest.test.ts
          bun test --cwd packages/protocol ./test/form-contract.test.ts ./test/session-autonomy.test.ts ./test/session-autonomy-toggle.test.ts
          bun test --cwd packages/server --timeout 40000 ./test/coordination-http.test.ts ./test/form.test.ts ./test/permission.test.ts ./test/guardrail.test.ts ./test/session-autonomy.test.ts

      - name: Verify ownership upgrade and native decision boundaries
        if: matrix.suite == 'tui-project'
        run: bun test --cwd packages/core --timeout 40000 ./test/database-migration.test.ts ./test/coordination-decisions-native.test.ts ./test/coordination-decision-runtime.test.ts ./test/coordination-instructions.test.ts ./test/coordination-model-request.test.ts ./test/session-projector.test.ts

      - name: Verify footer state and short-terminal controls
        if: matrix.suite == 'tui-runtime'
        run: bun test --cwd packages/tui --timeout 40000 ./test/session-footer-autonomy.test.tsx ./test/isolated-browser-dialog.test.tsx ./test/cli/tui/projects-layout.test.tsx ./test/theme-v1-parity.test.ts

      - name: Verify session switcher grouping
        if: matrix.suite == 'tui-runtime'
        run: bun test --cwd packages/tui --timeout 40000 ./test/dialog-session-list-groups.test.tsx

      - name: Verify compact Project and transcript layouts
        if: matrix.suite == 'tui-runtime'
        run: |
          bun test --cwd packages/tui --timeout 40000 ./test/cli/tui/session-rows-chronology.test.tsx ./test/cli/tui/sidebar-cache.test.tsx ./test/design-md.test.ts
          bun test --cwd packages/tui --timeout 40000 ./test/screen/subagent-picker-capture.test.tsx -t "captures populated subagent picker states at reference terminal dimensions|sizes picker metadata to the measured composer width with and without the docked rail"

      - name: Verify native Dots access and retirement boundaries
        if: matrix.suite == 'tui-project'
        run: |
          bun test --cwd packages/core --timeout 40000 ./test/dots-context.test.ts ./test/dots-access.test.ts ./test/dots-access-config.test.ts ./test/dots-native.test.ts ./test/dots-native-admission.test.ts ./test/dots-native-projection.test.ts ./test/dots-native-decisions.test.ts ./test/dots-retirement-promotion.test.ts
          bun test --cwd packages/schema ./test/dots.test.ts ./test/dots-report.test.ts ./test/dots-report-state.test.ts ./test/dots-access.test.ts ./test/dots-native-source.test.ts ./test/dots-retirement.test.ts
          bun test --cwd packages/protocol ./test/native-dots-only.test.ts
          bun test --cwd packages/server --timeout 40000 ./test/dots-access.test.ts
          bun test --cwd packages/remote ./test/dots-access-contract.test.ts
          bun test --cwd packages/client ./test/dots-peer.test.ts ./test/dots-access.test.ts ./test/dots-codegen.test.ts
          bun test --cwd packages/tui --timeout 40000 ./test/dots-connection.test.ts ./test/dots-connection-dialog.test.tsx ./test/dots-access-boundary.test.ts ./test/dots-delegation-review.test.tsx
          bun test --cwd packages/tui --timeout 40000 ./test/screen/dots.screen.test.ts -t "remote source attribution accepts resident reactive metadata"

      - name: Verify question grading and native Form views
        if: matrix.suite == 'tui-runtime'
        run: |
          bun test --cwd packages/core --timeout 40000 ./test/question-grading.test.ts
          bun test --cwd packages/core --timeout 40000 ./test/yolo-decision.test.ts -t "graded values retain their original mapping when an environment credential rotates during evaluation"
          bun test --cwd packages/schema ./test/form.test.ts
          bun test --cwd packages/tui --timeout 40000 ./test/cli/tui/form.test.tsx
          bun test --cwd packages/tui --timeout 40000 ./test/cli/tui/inline-tool-wrap-snapshot.test.tsx -t "filters malformed nested tool wire data|preserves native question selection modes|renders parsed multi-choice recommendations"

      - name: Verify subagent model selection boundaries
        if: matrix.suite == 'tui-runtime'
        run: |
          bun test --cwd packages/schema ./test/subagent-model-selection.test.ts
          bun test --cwd packages/core --timeout 40000 ./test/session-step-boundary.test.ts ./test/session-subagent-model-switch.test.ts
          bun test --cwd packages/server --timeout 40000 ./test/session-subagent-model-switch.test.ts
          bun test --cwd packages/client ./test/subagent-model-codegen.test.ts
          bun test --cwd packages/remote ./test/subagent-model-boundary.test.ts
          bun test --cwd packages/protocol ./test/session-orchestration.test.ts
          bun test --cwd packages/tui --timeout 40000 ./test/cli/tui/subagent-model-selection.test.tsx

      - name: Verify installer and web assets
        if: matrix.suite == 'web'
        run: |
          cd /tmp && bun test "$GITHUB_WORKSPACE/script/install.test.ts" "$GITHUB_WORKSPACE/script/build-web-assets.test.ts" "$GITHUB_WORKSPACE/script/release.test.ts" "$GITHUB_WORKSPACE/script/release-archive.test.ts"
          bun test "$GITHUB_WORKSPACE/script/chrome-for-testing.test.ts" -t "pins one exact version whose root metadata document is the default source"

      - name: Upload verified web build
        if: matrix.suite == 'web'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-web
          path: apps/web/dist/
          if-no-files-found: error
          retention-days: 7

  build-desktop-runtime:
    name: build Apple Silicon release packages
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && !github.event.deleted && startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify release tag provenance
        if: github.event_name == 'push'
        run: bash script/release-version.sh --verify-tag

      - name: Resolve release version
        run: bash script/release-version.sh

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          install-flags: --frozen-lockfile

      - name: Verify native build host
        run: |
          bun -e '
            if (process.platform !== "darwin" || process.arch !== "arm64") {
              console.error("Apple Silicon release packaging requires macOS arm64")
              process.exit(1)
            }
          '

      - name: Setup Rust
        id: desktop-rust
        uses: ./.github/actions/setup-rust
        with:
          release-cache: writer

      - name: Stage Apple Silicon release runtime
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          bun packages/cli/script/runtime.ts stage-release "$RUNNER_TEMP/release-runtime"
          digest=$(shasum -a 256 < "$RUNNER_TEMP/release-runtime/receipt.json" | cut -d' ' -f1)
          printf 'receipt-sha256=%s\n' "$digest" >> "$GITHUB_OUTPUT"

      - name: Upload Apple Silicon release runtime
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-runtime-darwin-arm64-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-runtime/
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

      - name: Save Apple Silicon release dependencies
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.desktop-rust.outputs.release-cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            rust/target/release
          key: ${{ steps.desktop-rust.outputs.release-cache-key }}

      - name: Cache Electrobun native assets
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/electrobun-cache-1.18.1
          key: ${{ runner.os }}-${{ runner.arch }}-electrobun-1.18.1

      - name: Provision Electrobun native assets
        run: |
          set -euo pipefail
          sdk="$(cd packages/desktop/node_modules/electrobun && pwd -P)"
          test "$(node -p 'require(process.argv[1]).version' "$sdk/package.json")" = "1.18.1"
          cache="$RUNNER_TEMP/electrobun-cache-1.18.1"
          mkdir -p "$cache"
          cd "$RUNNER_TEMP"
          if [ -f "$cache/electrobun-cli-darwin-arm64.tar.gz" ] && [ -f "$cache/electrobun-core-darwin-arm64.tar.gz" ]; then
            cp "$cache/electrobun-cli-darwin-arm64.tar.gz" "$cache/electrobun-core-darwin-arm64.tar.gz" .
          fi
          if ! { [ -f electrobun-cli-darwin-arm64.tar.gz ] && [ -f electrobun-core-darwin-arm64.tar.gz ] && echo "1ef4a4b42a957d3349f491f7fbe53153d1d5f427bacbda340c8d7fadce6b58d9  electrobun-cli-darwin-arm64.tar.gz" | shasum -a 256 -c - && echo "474c24f3af26eb5d59ce9fa90483fef2a35974fcdedebb8df969aebc4350e62f  electrobun-core-darwin-arm64.tar.gz" | shasum -a 256 -c -; } >/dev/null 2>&1; then
            curl -fsSL --retry 3 -o electrobun-cli-darwin-arm64.tar.gz https://github.com/blackboardsh/electrobun/releases/download/v1.18.1/electrobun-cli-darwin-arm64.tar.gz
            curl -fsSL --retry 3 -o electrobun-core-darwin-arm64.tar.gz https://github.com/blackboardsh/electrobun/releases/download/v1.18.1/electrobun-core-darwin-arm64.tar.gz
          fi
          echo "1ef4a4b42a957d3349f491f7fbe53153d1d5f427bacbda340c8d7fadce6b58d9  electrobun-cli-darwin-arm64.tar.gz" | shasum -a 256 -c -
          echo "474c24f3af26eb5d59ce9fa90483fef2a35974fcdedebb8df969aebc4350e62f  electrobun-core-darwin-arm64.tar.gz" | shasum -a 256 -c -
          cp electrobun-cli-darwin-arm64.tar.gz electrobun-core-darwin-arm64.tar.gz "$cache/"
          rm -rf electrobun-cli
          mkdir electrobun-cli
          tar -xzf electrobun-cli-darwin-arm64.tar.gz -C electrobun-cli
          install -m 755 electrobun-cli/electrobun "$sdk/bin/electrobun"
          mkdir -p "$sdk/dist-macos-arm64"
          tar -xzf electrobun-core-darwin-arm64.tar.gz -C "$sdk/dist-macos-arm64"

      - name: Import macOS signing identity
        env:
          YCODING_MACOS_SIGNING_P12: ${{ secrets.YCODING_MACOS_SIGNING_P12 }}
          YCODING_MACOS_SIGNING_PASSWORD: ${{ secrets.YCODING_MACOS_SIGNING_PASSWORD }}
          YCODING_MACOS_SIGNING_IDENTITY: YCoding Code Signing
          YCODING_MACOS_SIGNING_SHA1: 9dd524184b0db949ffac7f0ada0ae860ac7f5f85
        run: |
          set -euo pipefail
          test -n "$YCODING_MACOS_SIGNING_P12" || { echo "Missing YCODING_MACOS_SIGNING_P12 Actions secret" >&2; exit 1; }
          test -n "$YCODING_MACOS_SIGNING_PASSWORD" || { echo "Missing YCODING_MACOS_SIGNING_PASSWORD Actions secret" >&2; exit 1; }
          keychain="$RUNNER_TEMP/ycoding-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          echo "::add-mask::$keychain_password"
          printf '%s' "$YCODING_MACOS_SIGNING_P12" | base64 --decode > "$RUNNER_TEMP/ycoding-signing.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/ycoding-signing.p12" -k "$keychain" -P "$YCODING_MACOS_SIGNING_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/ycoding-signing.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user | sed -e 's/^[[:space:]]*"//' -e 's/"$//' > "$RUNNER_TEMP/ycoding-keychains.txt"
          original=()
          while IFS= read -r line; do original+=("$line"); done < "$RUNNER_TEMP/ycoding-keychains.txt"
          security list-keychains -d user -s "$keychain" ${original[@]+"${original[@]}"}
          security find-identity -p codesigning "$keychain" | grep -F "$(printf '%s' "$YCODING_MACOS_SIGNING_SHA1" | tr a-f A-F) \"$YCODING_MACOS_SIGNING_IDENTITY\"" >/dev/null \
            || { echo "The signing bundle does not contain the pinned $YCODING_MACOS_SIGNING_IDENTITY certificate" >&2; exit 1; }

      - name: Build TUI artifact
        env:
          YCODING_MACOS_SIGNING_IDENTITY: YCoding Code Signing
          YCODING_MACOS_SIGNING_SHA1: 9dd524184b0db949ffac7f0ada0ae860ac7f5f85
          YCODING_RELEASE_RUNTIME_DIR: ${{ runner.temp }}/release-runtime
          RECEIPT_SHA256: ${{ steps.runtime.outputs.receipt-sha256 }}
          YCODING_ANTIGRAVITY_CLIENT_ID: ${{ secrets.YCODING_ANTIGRAVITY_CLIENT_ID }}
          YCODING_ANTIGRAVITY_CLIENT_SECRET: ${{ secrets.YCODING_ANTIGRAVITY_CLIENT_SECRET }}
          YCODING_MUSE_CLIENT_ID: ${{ secrets.YCODING_MUSE_CLIENT_ID }}
          YCODING_MUSE_CLIENT_SECRET: ${{ secrets.YCODING_MUSE_CLIENT_SECRET }}
        run: bun run build:tui

      - name: Verify build metadata
        run: |
          set -euo pipefail
          node -e 'const metadata = require("./dist/tui/tui-darwin-arm64/package.json"); if (metadata.version !== process.env.YCODING_VERSION) process.exit(1)'

      - name: Verify standalone TUI build boundary
        run: bun test --cwd packages/cli ./test/import-boundaries.test.ts

      - name: Stage native executables
        run: |
          set -euo pipefail
          staging="dist/release-bin/darwin-arm64"
          mkdir -p "$staging"
          cp "dist/tui/tui-darwin-arm64/bin/ycoding" "$staging/"
          cp -R dist/tui/tui-darwin-arm64/bin/ycoding-chrome-extension "$staging/"
          cp -R "dist/tui/tui-darwin-arm64/bin/YCoding Interaction.app" "$staging/"

      - name: Create and validate native archive
        run: bun script/release-archive.ts create darwin-arm64 "$RELEASE_VERSION" dist/release-bin/darwin-arm64 dist/release-archive/darwin-arm64

      - name: Verify packaged macOS signatures
        env:
          YCODING_MACOS_SIGNING_SHA1: 9dd524184b0db949ffac7f0ada0ae860ac7f5f85
        run: |
          set -euo pipefail
          payload=$(mktemp -d "$RUNNER_TEMP/ycoding-payload.XXXXXX")
          trap 'rm -rf "$payload"' EXIT
          tar -xzf "dist/release-archive/darwin-arm64/"*.tar.gz -C "$payload"
          executable="$(bun script/release-archive.ts executable darwin-arm64 "$RELEASE_VERSION")"
          codesign --verify --strict -R "=identifier \"app.ycoding.cli\" and certificate leaf = H\"$YCODING_MACOS_SIGNING_SHA1\"" "$payload/$executable"
          codesign --verify --deep --strict -R "=identifier \"app.ycoding.interaction\" and certificate leaf = H\"$YCODING_MACOS_SIGNING_SHA1\"" "$payload/YCoding Interaction.app"

      - name: Upload native archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-archive-darwin-arm64
          path: dist/release-archive/darwin-arm64/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

      - name: Build desktop app
        env:
          YCODING_RELEASE_RUNTIME_DIR: ${{ runner.temp }}/release-runtime
          RECEIPT_SHA256: ${{ steps.runtime.outputs.receipt-sha256 }}
        run: /bin/sh packages/desktop/script/build.sh --outdir="$RUNNER_TEMP/desktop" --sign-identity=9dd524184b0db949ffac7f0ada0ae860ac7f5f85

      - name: Verify desktop backend version
        run: |
          set -euo pipefail
          node -e 'const receipt = require(process.argv[1]); if (receipt.version !== process.env.YCODING_VERSION) process.exit(1)' "$RUNNER_TEMP/desktop/build-receipt.json"

      - name: Verify desktop signature
        run: |
          set -euo pipefail
          codesign --verify --deep --strict "$RUNNER_TEMP/desktop/YCoding Desktop.app"
          codesign -d -r- "$RUNNER_TEMP/desktop/YCoding Desktop.app" 2>&1 | grep -Ex "designated => identifier \"app\.ycoding\.desktop\" and certificate (leaf|root) = H\"9dd524184b0db949ffac7f0ada0ae860ac7f5f85\"" >/dev/null

      - name: Verify and archive the Desktop CLI distribution
        run: |
          set -euo pipefail
          dist="packages/cli/dist/cli-darwin-arm64"
          backend="$RUNNER_TEMP/desktop/validation/YCoding Desktop.app/Contents/Resources/app/runtime/backend"
          node -e 'const pkg = require(process.argv[1]); if (pkg.name !== "@ycoding-ai/cli-darwin-arm64" || pkg.version !== process.env.YCODING_VERSION) process.exit(1)' "$GITHUB_WORKSPACE/$dist/package.json"
          cmp "$dist/bin/ycoding" "$backend/ycoding"
          codesign --verify --strict -R '=identifier "app.ycoding.cli" and certificate leaf = H"9dd524184b0db949ffac7f0ada0ae860ac7f5f85"' "$dist/bin/ycoding"
          codesign --verify --deep --strict -R '=identifier "app.ycoding.interaction" and certificate leaf = H"9dd524184b0db949ffac7f0ada0ae860ac7f5f85"' "$dist/bin/YCoding Interaction.app"
          tar -czf "$RUNNER_TEMP/cli-darwin-arm64.tar.gz" -C packages/cli/dist cli-darwin-arm64

      - name: Upload Desktop CLI distribution for verification
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-cli-distribution-darwin-arm64-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cli-darwin-arm64.tar.gz
            ${{ runner.temp }}/desktop/build-receipt.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

      - name: Create and validate desktop archive
        run: bun script/release-archive.ts create-desktop "$RELEASE_VERSION" "$RUNNER_TEMP/desktop/YCoding Desktop.app" dist/release-archive/desktop-darwin-arm64

      - name: Verify archived Desktop signatures
        run: |
          set -euo pipefail
          payload=$(mktemp -d "$RUNNER_TEMP/ycoding-desktop.XXXXXX")
          trap 'rm -rf -- "$payload"' EXIT
          tar -xf "dist/release-archive/desktop-darwin-arm64/YCoding-Desktop-v$RELEASE_VERSION-darwin-arm64.zip" -C "$payload"
          app="$payload/YCoding Desktop.app"
          requirement='=identifier "app.ycoding.desktop" and certificate leaf = H"9dd524184b0db949ffac7f0ada0ae860ac7f5f85"'
          codesign --verify --deep --strict -R "$requirement" "$app"
          resources="$app/Contents/Resources"
          hash=$(jq -er '.hash | select(test("^[a-z0-9]+$"))' "$resources/metadata.json")
          mkdir "$payload/inner"
          tar -xf "$resources/$hash.tar.zst" -C "$payload/inner"
          codesign --verify --deep --strict -R "$requirement" "$payload/inner/YCoding Desktop.app"

      - name: Upload desktop archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-archive-desktop-darwin-arm64
          path: dist/release-archive/desktop-darwin-arm64/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

      - name: Remove macOS signing keychain
        if: always()
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/ycoding-signing.keychain-db"
          saved="$RUNNER_TEMP/ycoding-keychains.txt"
          rm -f "$RUNNER_TEMP/ycoding-signing.p12"
          if [ -e "$saved" ]; then
            original=()
            while IFS= read -r line; do original+=("$line"); done < "$saved"
            if [ "${#original[@]}" -gt 0 ]; then security list-keychains -d user -s "${original[@]}"; fi
            rm -f "$saved"
          fi
          if [ -e "$keychain" ]; then security delete-keychain "$keychain"; fi

  finalize-release:
    name: finalize release archives and checksums
    needs: [verify-source, build-desktop-runtime]
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && !github.event.deleted && startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      checksums-sha256: ${{ steps.finalize.outputs.checksums-sha256 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve release version
        run: bash script/release-version.sh

      - name: Download prepared target archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: downloaded
          pattern: release-archive-*
          merge-multiple: true
          digest-mismatch: error

      - name: Install Bun
        uses: ./.github/actions/install-bun

      - name: Validate release archives and checksums
        id: finalize
        run: |
          set -euo pipefail
          bun script/release-archive.ts finalize "$RELEASE_VERSION" downloaded release
          digest=$(sha256sum < "release/ycoding-$RELEASE_VERSION-checksums.txt" | cut -d ' ' -f 1)
          printf 'checksums-sha256=%s\n' "$digest" >> "$GITHUB_OUTPUT"

      - name: Upload release checksums
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-checksums-${{ env.RELEASE_VERSION }}
          path: release/*-checksums.txt
          if-no-files-found: error
          retention-days: 7

  release-tui:
    name: publish TUI release
    needs: finalize-release
    if: ${{ github.event_name == 'push' && !github.event.deleted && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve release version
        run: bash script/release-version.sh

      - name: Download prepared target archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release
          pattern: release-archive-*
          merge-multiple: true
          digest-mismatch: error

      - name: Download validated checksums
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-checksums-${{ env.RELEASE_VERSION }}
          path: release
          digest-mismatch: error

      - name: Verify publication inputs
        env:
          EXPECTED_CHECKSUMS: ${{ needs.finalize-release.outputs.checksums-sha256 }}
        run: |
          set -euo pipefail
          cp LICENSE NOTICE release/
          printf '%s  %s\n' "$EXPECTED_CHECKSUMS" "release/ycoding-$RELEASE_VERSION-checksums.txt" | sha256sum --check --strict
          (cd release && sha256sum --check --strict "ycoding-$RELEASE_VERSION-checksums.txt")

      - name: Install Bun
        uses: ./.github/actions/install-bun

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          : "${GH_TOKEN:?Missing GitHub release token}"
          version="$RELEASE_VERSION"
          tag="v$version"
          pages=$(gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100")
          releases=$(jq -ce '
            if type == "array" and length > 0 and all(.[]; type == "array") then add else error("Invalid release list") end
            | if all(.[]; (.tag_name | type) == "string" and (.draft | type) == "boolean") then . else error("Invalid release records") end
          ' <<< "$pages")
          matches=$(jq --arg tag "$tag" '[.[] | select(.tag_name == $tag)] | length' <<< "$releases")
          if (( matches > 1 )); then echo "Multiple releases found for $tag" >&2; exit 1; fi
          prev=$(jq -r --arg tag "$tag" '[.[] | select(.tag_name != $tag and (.draft | not) and (.tag_name | test("^v[0-9]"))) | .tag_name] | first // empty' <<< "$releases")
          range="${prev:+$prev...}$tag"
          notes="docs/releases/$tag.md"
          {
            cat "$notes"
            printf '\n**Full Changelog**: https://github.com/%s/compare/%s\n' "$GH_REPO" "$range"
          } > release-notes.md
          if (( matches == 1 )); then
            bash script/release-version.sh --verify-tag
            bun script/release-publish.ts --repository "$GH_REPO" --tag "$tag" --title "YCoding $version" --notes-file release-notes.md --run "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --manifest release-publish-manifest.json release/* "$notes"
          else
            previous_latest=$(gh api "repos/$GH_REPO/releases/latest" --jq '.tag_name | strings | select(length > 0)')
            test -n "$previous_latest"
            latest=$(bun script/release-publish.ts latest "$tag" "$previous_latest")
            expected_latest="$previous_latest"
            if [[ "$latest" == true ]]; then expected_latest="$tag"; fi
            prerelease=()
            if [[ "${version%%+*}" == *-* ]]; then prerelease+=(--prerelease); fi
            bash script/release-version.sh --verify-tag
            gh release create "$tag" release/* "$notes" --verify-tag --latest="$latest" "${prerelease[@]}" --title "YCoding $version" --notes-file release-notes.md
            actual_latest=$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)
            if [[ "$actual_latest" != "$expected_latest" ]]; then
              echo "GitHub Latest does not point to $expected_latest" >&2
              exit 1
            fi
          fi

      - name: Upload release publication manifest
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-publish-manifest-${{ env.RELEASE_VERSION }}
          path: release-publish-manifest.json
          if-no-files-found: ignore
          retention-days: 90

  deploy-web:
    name: deploy web (cloudflare)
    needs: release-tui
    if: ${{ github.event_name == 'push' && !github.event.deleted && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          install-flags: --frozen-lockfile

      - name: Download verified web build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-web
          path: apps/web/dist
          digest-mismatch: error

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN Actions secret" >&2; exit 1; }
          test -s apps/web/dist/index.html || { echo "Missing verified Web entry point" >&2; exit 1; }
          bun run deploy:cloudflare

      - name: Deploy app preview Worker
        if: vars.YCODING_APP_PREVIEW_DEPLOY == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN Actions secret" >&2; exit 1; }
          bun run deploy:cloudflare-preview
