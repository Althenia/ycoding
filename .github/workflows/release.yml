name: release

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      version:
        description: Release version without leading v (for example 0.7.0). Defaults to the newest docs/releases/v<version>.md file.
        required: false
        default: ""

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  YCODING_CHANNEL: latest

jobs:
  scope:
    name: resolve release scope
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.select.outputs.version }}
      channel: ${{ steps.select.outputs.channel }}
      suites: ${{ steps.select.outputs.suites }}
      targets: ${{ steps.select.outputs.targets }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout release source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag is reachable from release branch
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          branch=main
          case "$GITHUB_REF_NAME" in v*-beta.*) branch=beta ;; esac
          git fetch --no-tags origin "$branch:refs/remotes/origin/$branch"
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/$branch"

      - name: Select release scope
        id: select
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_VERSION" ]; then
            version="$INPUT_VERSION"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(ls docs/releases/v*.md | sed 's#.*/v##' | sed 's#\.md$##' | sort -V | tail -n 1)"
          fi
          printf '%s\n' "$version" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$' \
            || { echo "Invalid release version: $version" >&2; exit 1; }
          release_notes="docs/releases/v$version.md"
          test -f "$release_notes" || { echo "Missing release notes: $release_notes" >&2; exit 1; }
          test -s "$release_notes" || { echo "Release notes are empty: $release_notes" >&2; exit 1; }
          suites='[
            {"suite":"types","runner":"ubuntu-24.04"},
            {"suite":"web","runner":"ubuntu-24.04"},
            {"suite":"remote","runner":"ubuntu-24.04"},
            {"suite":"cli","runner":"ubuntu-24.04"},
            {"suite":"tui","runner":"ubuntu-24.04"},
            {"suite":"browser","runner":"macos-26"},
            {"suite":"extension","runner":"macos-26"},
            {"suite":"rust","runner":"ubuntu-24.04"},
            {"suite":"rust-macos","runner":"macos-26"},
            {"suite":"rust-windows","runner":"windows-2025"}
          ]'
          targets='[
            {"target":"darwin-arm64","runner":"macos-26","platform":"darwin","arch":"arm64"},
            {"target":"linux-x64","runner":"ubuntu-24.04","platform":"linux","arch":"x64"},
            {"target":"windows-x64","runner":"windows-2025","platform":"win32","arch":"x64"}
          ]'
          channel=latest
          case "$version" in
            *-beta.*)
              channel=beta
              suites="$(jq 'map(select(.suite != "rust" and .suite != "rust-windows"))' <<<"$suites")"
              targets="$(jq 'map(select(.target == "darwin-arm64"))' <<<"$targets")"
              ;;
          esac
          {
            echo "version=$version"
            echo "channel=$channel"
            echo "suites=$(jq -c . <<<"$suites")"
            echo "targets=$(jq -c . <<<"$targets")"
          } >>"$GITHUB_OUTPUT"

  verify-source:
    name: verify release source (${{ matrix.suite }})
    needs: scope
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.scope.outputs.suites) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      RELEASE_VERSION: ${{ needs.scope.outputs.version }}
      YCODING_VERSION: ${{ needs.scope.outputs.version }}
      YCODING_CHANNEL: ${{ needs.scope.outputs.channel }}
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout release source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        if: matrix.suite != 'rust-windows'
        uses: ./.github/actions/setup-bun
        with:
          install-flags: --frozen-lockfile

      - name: Setup Rust
        if: matrix.suite == 'rust' || matrix.suite == 'rust-macos' || matrix.suite == 'remote' || matrix.suite == 'cli' || matrix.suite == 'browser' || matrix.suite == 'rust-windows'
        uses: ./.github/actions/setup-rust
        with:
          save-registry: ${{ startsWith(matrix.suite, 'rust') }}

      - name: Build debug runtime
        if: matrix.suite == 'rust' || matrix.suite == 'rust-macos' || matrix.suite == 'remote' || matrix.suite == 'cli' || matrix.suite == 'browser'
        run: cargo build --locked --manifest-path rust/Cargo.toml -p ycoding-runtime --bin ycoding-runtime

      - name: Check workspace and types
        if: matrix.suite == 'types'
        run: |
          bun run check:ycoding-workspace
          bun run check:ycoding-brand
          bun test --cwd script ./typecheck-cache.integration.test.ts
          bun run typecheck
          bun run lint:effect-patterns

      - name: Verify web application and relay
        if: matrix.suite == 'web'
        run: |
          bun run test:web
          bun run test:remote

      - name: Build web application
        if: matrix.suite == 'web' || matrix.suite == 'remote'
        run: bun run build:web

      - name: Verify built web integration
        if: matrix.suite == 'web'
        run: bun run test:integration:web

      - name: Verify local remote integration
        if: matrix.suite == 'remote'
        timeout-minutes: 20
        run: bun run test:integration:remote

      - name: Verify Cloudflare Worker
        if: matrix.suite == 'web'
        run: |
          bun run test:cloudflare
          bun run build:cloudflare

      - name: Verify CLI suites
        if: matrix.suite == 'cli'
        working-directory: packages/cli
        run: bun test --timeout 30000

      - name: Verify Chrome extension suites
        if: matrix.suite == 'cli'
        run: bun run test:extension

      - name: Verify transcript and approval suites
        if: matrix.suite == 'tui'
        working-directory: packages/tui
        run: bun test test/session-transcript-live-fixes.test.tsx test/cli/tui/permission-interaction.test.tsx test/cli/tui/permission.test.ts test/util/permission.test.ts test/branding.test.ts

      - name: Verify goal continuation
        if: matrix.suite == 'tui'
        working-directory: packages/core
        run: bun test test/session-execution.test.ts test/session-autonomy.test.ts

      - name: Verify installer and web assets
        if: matrix.suite == 'web'
        run: cd /tmp && bun test "$GITHUB_WORKSPACE/script/install.test.ts" "$GITHUB_WORKSPACE/script/build-web-assets.test.ts" "$GITHUB_WORKSPACE/script/release.test.ts" "$GITHUB_WORKSPACE/script/rust-ci.test.ts" "$GITHUB_WORKSPACE/script/chrome-for-testing.test.ts"

      - name: Verify approved browser host
        if: matrix.suite == 'browser' || matrix.suite == 'extension'
        uses: ./.github/actions/verify-browser-host

      - name: Verify isolated-browser integration suites
        if: matrix.suite == 'browser'
        run: |
          set -euo pipefail
          bun run --cwd packages/core test:integration:browser
          bun run --cwd packages/server test:integration:browser

      - name: Verify native isolated-browser runtime
        if: matrix.suite == 'browser'
        run: bun run rust/crates/runtime/tests/support/ready-runtime.ts "$GITHUB_WORKSPACE/rust/target/debug/ycoding-runtime" bun run --cwd packages/tui test:integration:browser

      - name: Verify Rust isolated-browser integration
        if: matrix.suite == 'browser'
        env:
          YCODING_TEST_ISOLATED_BROWSER_CHROME: "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
        run: cargo test --locked --manifest-path rust/Cargo.toml -p ycoding-core --test browser_native_integration -- --ignored

      - name: Provision Chrome for Testing
        if: matrix.suite == 'extension'
        run: |
          set -euo pipefail
          executable="$(bun script/chrome-for-testing.ts "$RUNNER_TEMP/chrome-for-testing")"
          echo "YCODING_TEST_ISOLATED_BROWSER_CHROME=$executable" >> "$GITHUB_ENV"

      - name: Verify Chrome extension integration suite
        if: matrix.suite == 'extension'
        run: bun run test:integration:extension

      - name: Verify Rust workspace
        if: matrix.suite == 'rust' || matrix.suite == 'rust-macos'
        env:
          YCODING_MCP_SERVER_ROOT: ${{ github.workspace }}/packages/core/node_modules/@modelcontextprotocol/server
          YCODING_MCP_FIXTURE_REF: refs/remotes/origin/main
        run: |
          set -euo pipefail
          python3 script/rust-workspace-check.py
          bun test --cwd packages/core ./test/rust-baseline/immutable.test.ts
          cargo fmt --manifest-path rust/Cargo.toml --all -- --check
          cargo clippy --locked --manifest-path rust/Cargo.toml --workspace --all-targets -- -D warnings
          cargo test --locked --manifest-path rust/Cargo.toml --workspace --no-fail-fast

      - name: Verify Rust runtime client interoperability
        if: matrix.suite == 'rust' || matrix.suite == 'rust-macos'
        run: bun run rust/crates/runtime/tests/support/ready-runtime.ts "$GITHUB_WORKSPACE/rust/target/debug/ycoding-runtime" bun run --cwd packages/client test:integration:rust

      - name: Verify Windows process lifecycle
        if: matrix.suite == 'rust-windows'
        shell: bash
        run: |
          set -euo pipefail
          test_name=platform::process::tree::windows_tests::terminating_an_already_reaped_child_never_signals_the_stored_pid
          cargo test --locked --manifest-path rust/Cargo.toml -p ycoding-core --lib platform::process 2>&1 | tee "$RUNNER_TEMP/windows-process-tests.log"
          grep -Fq "test $test_name ... ok" "$RUNNER_TEMP/windows-process-tests.log" || { echo "Windows process test did not run: $test_name" >&2; exit 1; }

      - name: Fetch locked Rust sources
        if: matrix.suite == 'rust' || (matrix.suite == 'rust-macos' && needs.scope.outputs.channel == 'beta')
        run: cargo fetch --locked --manifest-path rust/Cargo.toml

      - name: Verify Rust notices
        if: matrix.suite == 'rust' || (matrix.suite == 'rust-macos' && needs.scope.outputs.channel == 'beta')
        run: |
          set -euo pipefail
          bun run check:rust-notices
          bun test --cwd script ./rust-notices.test.ts

  build:
    name: build ${{ matrix.target }}
    needs: scope
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.scope.outputs.targets) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      RELEASE_VERSION: ${{ needs.scope.outputs.version }}
      YCODING_VERSION: ${{ needs.scope.outputs.version }}
      YCODING_CHANNEL: ${{ needs.scope.outputs.channel }}
      YCODING_MACOS_SIGNING_IDENTITY: YCoding Code Signing
      YCODING_MACOS_SIGNING_SHA1: 9dd524184b0db949ffac7f0ada0ae860ac7f5f85
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          install-flags: --frozen-lockfile

      - name: Verify native build host
        env:
          EXPECTED_PLATFORM: ${{ matrix.platform }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          bun -e '
            if (process.platform !== process.env.EXPECTED_PLATFORM || process.arch !== process.env.EXPECTED_ARCH) {
              console.error(`Expected ${process.env.EXPECTED_PLATFORM}/${process.env.EXPECTED_ARCH}, got ${process.platform}/${process.arch}`)
              process.exit(1)
            }
          '

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Verify release panic recovery
        run: |
          set -euo pipefail
          models="$(bun -e 'console.log(require("node:path").resolve("packages/cli/script/models-dev.snapshot.json"))')"
          test -f "$models"
          export YCODING_BUNDLED_MODELS_PATH="$models"
          cargo build --locked --manifest-path rust/Cargo.toml --release -p ycoding-runtime -p ycoding-store --bin ycoding-runtime --example release_recovery
          "rust/target/release/examples/release_recovery${{ runner.os == 'Windows' && '.exe' || '' }}"

      - name: Import macOS signing identity
        if: runner.os == 'macOS'
        env:
          YCODING_MACOS_SIGNING_P12: ${{ secrets.YCODING_MACOS_SIGNING_P12 }}
          YCODING_MACOS_SIGNING_PASSWORD: ${{ secrets.YCODING_MACOS_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$YCODING_MACOS_SIGNING_P12" || { echo "Missing YCODING_MACOS_SIGNING_P12 Actions secret" >&2; exit 1; }
          test -n "$YCODING_MACOS_SIGNING_PASSWORD" || { echo "Missing YCODING_MACOS_SIGNING_PASSWORD Actions secret" >&2; exit 1; }
          keychain="$RUNNER_TEMP/ycoding-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          echo "::add-mask::$keychain_password"
          printf '%s' "$YCODING_MACOS_SIGNING_P12" | base64 --decode > "$RUNNER_TEMP/ycoding-signing.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/ycoding-signing.p12" -k "$keychain" -P "$YCODING_MACOS_SIGNING_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/ycoding-signing.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user | sed -e 's/^[[:space:]]*"//' -e 's/"$//' > "$RUNNER_TEMP/ycoding-keychains.txt"
          original=()
          while IFS= read -r line; do original+=("$line"); done < "$RUNNER_TEMP/ycoding-keychains.txt"
          security list-keychains -d user -s "$keychain" ${original[@]+"${original[@]}"}
          security find-identity -p codesigning "$keychain" | grep -F "$(printf '%s' "$YCODING_MACOS_SIGNING_SHA1" | tr a-f A-F) \"$YCODING_MACOS_SIGNING_IDENTITY\"" >/dev/null \
            || { echo "The signing bundle does not contain the pinned $YCODING_MACOS_SIGNING_IDENTITY certificate" >&2; exit 1; }

      - name: Build TUI artifact
        run: bun run build:tui

      - name: Validate TUI artifact
        run: bun run smoke:tui

      - name: Validate runtime artifact
        run: bun run smoke:runtime

      - name: Verify build metadata
        run: |
          set -euo pipefail
          node -e 'const metadata = require("./dist/tui/tui-${{ matrix.target }}/package.json"); if (metadata.version !== process.env.YCODING_VERSION) process.exit(1)'

      - name: Stage native executables
        run: |
          set -euo pipefail
          staging="dist/release-bin/${{ matrix.target }}"
          mkdir -p "$staging"
          cp "dist/tui/tui-${{ matrix.target }}/bin/ycoding${{ runner.os == 'Windows' && '.exe' || '' }}" "$staging/"
          cp -R "dist/tui/tui-${{ matrix.target }}/bin/ycoding-chrome-extension" "$staging/"
          if [ "${{ runner.os }}" = "macOS" ]; then
            cp -R "dist/tui/tui-${{ matrix.target }}/bin/YCoding Computer Use.app" "$staging/"
            codesign --verify --deep --strict "$staging/YCoding Computer Use.app"
            codesign -d -r- "$staging/YCoding Computer Use.app" 2>&1 | grep -Ex "designated => identifier \"app\.ycoding\.computer-use\" and certificate (leaf|root) = H\"$YCODING_MACOS_SIGNING_SHA1\"" >/dev/null
          fi

      - name: Upload native executables
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ycoding-${{ matrix.target }}
          path: dist/release-bin/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 7

      - name: Remove macOS signing keychain
        if: ${{ always() && runner.os == 'macOS' }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/ycoding-signing.keychain-db"
          saved="$RUNNER_TEMP/ycoding-keychains.txt"
          rm -f "$RUNNER_TEMP/ycoding-signing.p12"
          if [ -e "$saved" ]; then
            original=()
            while IFS= read -r line; do original+=("$line"); done < "$saved"
            if [ "${#original[@]}" -gt 0 ]; then security list-keychains -d user -s "${original[@]}"; fi
            rm -f "$saved"
          fi
          if [ -e "$keychain" ]; then security delete-keychain "$keychain"; fi

      - name: Verify macOS CLI packaging, installer, and updater
        if: runner.os == 'macOS'
        working-directory: packages/cli
        env:
          YCODING_MACOS_SIGNING_IDENTITY: ""
        run: |
          set -euo pipefail
          bun test --timeout 30000 test-integration/node-build.test.ts test/computer-use-packaging.test.ts test/update.test.ts test/install-local.test.ts 2>&1 | tee "$RUNNER_TEMP/macos-cli-tests.log"
          if grep -Eq '^ *[1-9][0-9]* (skip|todo)$' "$RUNNER_TEMP/macos-cli-tests.log"; then
            echo "macOS CLI gates must run every test" >&2
            exit 1
          fi

  isolated-browser-acceptance:
    name: isolated browser acceptance (darwin-arm64, Chrome 152+)
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          install-flags: --frozen-lockfile

      - name: Verify approved browser host
        uses: ./.github/actions/verify-browser-host

      - name: Download darwin-arm64 executable
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ycoding-darwin-arm64
          path: dist/isolated-browser

      - name: Verify packaged isolated browser
        run: |
          set -euo pipefail
          chmod +x dist/isolated-browser/ycoding
          bun run --cwd packages/cli script/isolated-browser-smoke.ts --binary="$GITHUB_WORKSPACE/dist/isolated-browser/ycoding"

  package:
    name: package TUI release assets
    needs: [scope, build]
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RELEASE_VERSION: ${{ needs.scope.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Download native executables
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: unpacked
          pattern: ycoding-*

      - name: Create release archives and checksums
        env:
          RELEASE_TARGETS: ${{ needs.scope.outputs.targets }}
        run: |
          set -euo pipefail
          version="$RELEASE_VERSION"
          targets=()
          while IFS= read -r target; do targets+=("$target"); done < <(jq -r '.[].target' <<<"$RELEASE_TARGETS")
          test "${#targets[@]}" -gt 0
          test "$(ls unpacked | LC_ALL=C sort)" = "$(printf 'ycoding-%s\n' "${targets[@]}" | LC_ALL=C sort)" \
            || { echo "Downloaded executables do not match the release targets: ${targets[*]}" >&2; exit 1; }
          mkdir release
          mac_entries=(ycoding ycoding-chrome-extension)
          version_core="${version%%+*}"
          prerelease=false
          if [[ "$version_core" == *-* ]]; then prerelease=true; fi
          if printf '%s\n' "${version_core%%-*}" | awk -F . -v prerelease="$prerelease" '
            $1 > 0 || ($1 == 0 && ($2 > 7 || ($2 == 7 && ($3 > 1 || ($3 == 1 && prerelease == "false"))))) { found=1 }
            END { exit !found }
          '; then mac_entries+=("YCoding Computer Use.app"); fi
          assets=()
          for target in "${targets[@]}"; do
            source="unpacked/ycoding-$target"
            case "$target" in
              darwin-arm64)
                app="$source/YCoding Computer Use.app"
                test -d "$app" && test ! -L "$app"
                chmod +x "$source/ycoding" "$app/Contents/MacOS/ycoding-computer-use"
                test "$(cd "$app" && find . -mindepth 1 | sed 's#^\./##' | LC_ALL=C sort)" = "$(printf '%s\n' Contents Contents/Info.plist Contents/MacOS Contents/MacOS/ycoding-computer-use Contents/Resources Contents/Resources/YCoding.icns Contents/_CodeSignature Contents/_CodeSignature/CodeResources | LC_ALL=C sort)"
                test -f "$app/Contents/Info.plist" && test ! -L "$app/Contents/Info.plist" && test -s "$app/Contents/Info.plist"
                test -f "$app/Contents/_CodeSignature/CodeResources" && test ! -L "$app/Contents/_CodeSignature/CodeResources" && test -s "$app/Contents/_CodeSignature/CodeResources"
                test -f "$app/Contents/MacOS/ycoding-computer-use" && test ! -L "$app/Contents/MacOS/ycoding-computer-use" && test -x "$app/Contents/MacOS/ycoding-computer-use"
                test -f "$app/Contents/Resources/YCoding.icns" && test ! -L "$app/Contents/Resources/YCoding.icns" && test -s "$app/Contents/Resources/YCoding.icns"
                grep -Fq '<key>CFBundleIdentifier</key><string>app.ycoding.computer-use</string>' "$app/Contents/Info.plist"
                grep -Fq '<key>CFBundleDisplayName</key><string>YCoding Computer Use</string>' "$app/Contents/Info.plist"
                grep -Fq '<key>CFBundleIconFile</key><string>YCoding.icns</string>' "$app/Contents/Info.plist"
                expected=("${mac_entries[@]}")
                tar -C "$source" -czf "release/ycoding-$version-$target.tar.gz" "${expected[@]}"
                tar -tzf "release/ycoding-$version-$target.tar.gz" | grep -x 'YCoding Computer Use.app/Contents/MacOS/ycoding-computer-use' >/dev/null
                ;;
              linux-x64)
                chmod +x "$source/ycoding"
                expected=(ycoding ycoding-chrome-extension)
                tar -C "$source" -czf "release/ycoding-$version-$target.tar.gz" ycoding ycoding-chrome-extension
                ;;
              windows-x64)
                (cd "$source" && zip -r "../../release/ycoding-$version-$target.zip" ycoding.exe ycoding-chrome-extension)
                test "$(unzip -Z1 "release/ycoding-$version-$target.zip" | cut -d/ -f1 | LC_ALL=C sort -u)" = "$(printf '%s\n' ycoding.exe ycoding-chrome-extension | LC_ALL=C sort)"
                assets+=("ycoding-$version-$target.zip")
                continue
                ;;
              *)
                echo "Unsupported release target: $target" >&2
                exit 1
                ;;
            esac
            test -x "$source/ycoding"
            tar -tzvf "release/ycoding-$version-$target.tar.gz" | grep '^-rwx' >/dev/null
            tar -tzf "release/ycoding-$version-$target.tar.gz" | grep -x 'ycoding-chrome-extension/manifest.json' >/dev/null
            test "$(tar -tzf "release/ycoding-$version-$target.tar.gz" | cut -d/ -f1 | LC_ALL=C sort -u)" = "$(printf '%s\n' "${expected[@]}" | LC_ALL=C sort)"
            assets+=("ycoding-$version-$target.tar.gz")
          done
          cp LICENSE NOTICE "docs/releases/v$version.md" release/
          # One checksum file covers every released asset, so the installer
          # verifies each download with the same rule.
          (cd release && sha256sum "${assets[@]}" LICENSE NOTICE "v$version.md" > "ycoding-$version-checksums.txt")

      - name: Upload prepared release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets-${{ env.RELEASE_VERSION }}
          path: release/
          if-no-files-found: error
          retention-days: 7

  release-tui:
    name: publish TUI release
    needs: [scope, verify-source, package, isolated-browser-acceptance, deploy-web]
    if: ${{ !cancelled() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.verify-source.result == 'success' && needs.package.result == 'success' && needs.isolated-browser-acceptance.result == 'success' && (needs.deploy-web.result == 'success' || (needs.scope.outputs.channel == 'beta' && needs.deploy-web.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.scope.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Download prepared release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets-${{ env.RELEASE_VERSION }}
          path: release

      - name: Verify prepared release assets
        env:
          RELEASE_TARGETS: ${{ needs.scope.outputs.targets }}
        run: |
          set -euo pipefail
          version="$RELEASE_VERSION"
          checksums="ycoding-$version-checksums.txt"
          signed=(LICENSE NOTICE "v$version.md")
          while IFS= read -r target; do
            case "$target" in
              windows-*) signed+=("ycoding-$version-$target.zip") ;;
              *) signed+=("ycoding-$version-$target.tar.gz") ;;
            esac
          done < <(jq -r '.[].target' <<<"$RELEASE_TARGETS")
          test "$(ls release | LC_ALL=C sort)" = "$(printf '%s\n' "$checksums" "${signed[@]}" | LC_ALL=C sort)" \
            || { echo "Prepared release assets do not match the release targets" >&2; exit 1; }
          test "$(awk '{ print $2 }' "release/$checksums" | LC_ALL=C sort)" = "$(printf '%s\n' "${signed[@]}" | LC_ALL=C sort)" \
            || { echo "The checksum file does not cover exactly the release assets" >&2; exit 1; }
          (cd release && sha256sum -c "$checksums")

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="$RELEASE_VERSION"
          export RELEASE_TAG="v$version"
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 && {
            echo "Release $RELEASE_TAG already exists"
            exit 1
          }
          case "$version" in
            *-beta.*)
              release_query='[.[] | select(.tagName != env.RELEASE_TAG and (.tagName | test("^v[0-9]"))) | .tagName] | first // empty'
              api_query="[.[] | select(.tag_name != \"$RELEASE_TAG\" and .draft == false and (.tag_name | test(\"^v[0-9]\"))) | .tag_name] | first // empty"
              ;;
            *)
              release_query='[.[] | select(.tagName != env.RELEASE_TAG and .isPrerelease == false and (.tagName | test("^v[0-9]"))) | .tagName] | first // empty'
              api_query="[.[] | select(.tag_name != \"$RELEASE_TAG\" and .draft == false and .prerelease == false and (.tag_name | test(\"^v[0-9]\"))) | .tag_name] | first // empty"
              ;;
          esac
          prev="$(gh release list --limit 100 --json tagName,isPrerelease --jq "$release_query" 2>/dev/null || true)"
          prev="${prev:-$(gh api "repos/$GH_REPO/releases?per_page=100" --jq "$api_query" 2>/dev/null || true)}"
          range="${prev:+$prev...}$RELEASE_TAG"
          {
            cat "docs/releases/v$version.md"
            echo ""
            echo "**Full Changelog**: https://github.com/Althenia/ycoding/compare/$range"
          } > release-notes.md
          release_flags=()
          case "$version" in *-beta.*) release_flags=(--prerelease --latest=false) ;; esac
          gh release create "v$version" release/* --verify-tag --target "$GITHUB_SHA" --title "YCoding $version" --notes-file release-notes.md "${release_flags[@]}"

  deploy-web:
    name: deploy web (cloudflare)
    needs: [scope, verify-source, package, isolated-browser-acceptance]
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.scope.outputs.channel == 'latest' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          install-flags: --frozen-lockfile

      - name: Build web
        run: bun run build:web

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN Actions secret" >&2; exit 1; }
          bun run deploy:cloudflare
