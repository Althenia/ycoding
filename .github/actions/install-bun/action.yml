name: "Install Bun"
description: "Install the pinned Bun runtime, retrying the GitHub release download and then falling back to the npm registry"
runs:
  using: "composite"
  steps:
    # Single source of truth for the Bun version used by every CI and release job. Bump it here only.
    - name: Pin Bun version
      id: bun-pin
      shell: bash
      run: echo "version=1.4.4" >> "$GITHUB_OUTPUT"

    - name: Get baseline download URL
      id: bun-url
      shell: bash
      run: |
        if [ "$RUNNER_ARCH" = "X64" ]; then
          case "$RUNNER_OS" in
            macOS)   OS=darwin ;;
            Linux)   OS=linux ;;
            Windows) OS=windows ;;
          esac
          echo "url=https://github.com/oven-sh/bun/releases/download/bun-v${{ steps.bun-pin.outputs.version }}/bun-${OS}-x64-baseline.zip" >> "$GITHUB_OUTPUT"
        fi

    - name: Setup Bun
      id: bun-attempt-1
      continue-on-error: true
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ steps.bun-pin.outputs.version }}
        bun-download-url: ${{ steps.bun-url.outputs.url }}

    - name: Wait before retrying Bun setup
      if: steps.bun-attempt-1.outcome == 'failure'
      shell: bash
      run: sleep 30

    - name: Setup Bun (retry)
      id: bun-attempt-2
      if: steps.bun-attempt-1.outcome == 'failure'
      continue-on-error: true
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ steps.bun-pin.outputs.version }}
        bun-download-url: ${{ steps.bun-url.outputs.url }}

    # GitHub release-asset downloads can fail for longer than the retries above.
    # The npm registry publishes the same pinned Bun version and baseline builds; npm verifies each tarball's
    # integrity hash, and the job fails if the install or the version check fails.
    - name: Install Bun from the npm registry
      if: steps.bun-attempt-1.outcome == 'failure' && steps.bun-attempt-2.outcome == 'failure'
      shell: bash
      env:
        BUN_VERSION: ${{ steps.bun-pin.outputs.version }}
      run: |
        set -euo pipefail
        case "$RUNNER_OS-$RUNNER_ARCH" in
          Linux-X64) package=@oven/bun-linux-x64-baseline ;;
          macOS-X64) package=@oven/bun-darwin-x64-baseline ;;
          macOS-ARM64) package=@oven/bun-darwin-aarch64 ;;
          Windows-X64) package=@oven/bun-windows-x64-baseline ;;
          *) echo "No npm Bun package for $RUNNER_OS-$RUNNER_ARCH" >&2; exit 1 ;;
        esac
        prefix="$RUNNER_TEMP/bun-npm"
        bin="$RUNNER_TEMP/bun-npm-bin"
        exe=bun
        if [ "$RUNNER_OS" = "Windows" ]; then exe=bun.exe; fi
        mkdir -p "$prefix" "$bin"
        npm install --prefix "$prefix" --no-audit --no-fund --ignore-scripts --loglevel=error "$package@$BUN_VERSION"
        cp "$prefix/node_modules/$package/bin/$exe" "$bin/$exe"
        chmod +x "$bin/$exe"
        if [ "$RUNNER_OS" = "Windows" ]; then cp "$bin/bun.exe" "$bin/bunx.exe"; else ln -sf bun "$bin/bunx"; fi
        installed="$("$bin/$exe" --version)"
        test "$installed" = "$BUN_VERSION" || { echo "Bun $installed does not match pinned $BUN_VERSION" >&2; exit 1; }
        echo "Installed Bun $installed ($("$bin/$exe" --revision)) from $package"
        if [ "$RUNNER_OS" = "Windows" ]; then bin="$(cygpath -w "$bin")"; fi
        echo "$bin" >> "$GITHUB_PATH"
