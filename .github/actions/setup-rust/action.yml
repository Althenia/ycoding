name: "Setup Rust"
description: "Select the pinned Rust toolchain with rustfmt and clippy, and install a checksum-verified protoc"
inputs:
  cache-profile:
    description: "Cargo build profile key (release or dev)"
    required: false
    default: "release"
  release-cache:
    description: "Restore the shared cache written by the Apple Silicon Desktop release job"
    required: false
    default: ""
  sccache:
    description: "Install the checksum-verified sccache compiler wrapper"
    required: false
    default: "false"
outputs:
  cargo-cache-hit:
    description: "Whether the dependency cache was restored by its exact key"
    value: ${{ steps.cargo-cache.outputs.cache-hit }}
  cargo-cache-key:
    description: "Primary key for the dependency cache saved by setup-rust/save"
    value: ${{ steps.cargo-cache.outputs.cache-primary-key }}
  release-cache-hit:
    description: "Whether the Apple Silicon cache was restored"
    value: ${{ steps.release-cache.outputs.cache-hit }}
  release-cache-key:
    description: "Primary key for the Apple Silicon cache"
    value: ${{ steps.release-cache.outputs.cache-primary-key }}
runs:
  using: "composite"
  steps:
    - name: Cache Rust toolchain
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.rustup/toolchains
          ~/.rustup/update-hashes
          ~/.rustup/settings.toml
        key: ${{ runner.os }}-${{ runner.arch }}-rustup-1.98.1

    - name: Install Rust toolchain
      shell: bash
      env:
        RUST_VERSION: "1.98.1"
      run: |
        set -euo pipefail
        command -v rustup >/dev/null || { echo "rustup is not installed on this runner; setup-rust requires a runner image that provides rustup" >&2; exit 1; }
        if ! { rustup run "$RUST_VERSION" rustc --version >/dev/null 2>&1 && rustup run "$RUST_VERSION" cargo fmt --version >/dev/null 2>&1 && rustup run "$RUST_VERSION" cargo clippy --version >/dev/null 2>&1; }; then
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt --component clippy
        fi
        {
          echo "RUSTUP_TOOLCHAIN=$RUST_VERSION"
          echo "CARGO_INCREMENTAL=0"
          echo "CARGO_PROFILE_DEV_DEBUG=0"
          echo "CARGO_PROFILE_TEST_DEBUG=0"
        } >> "$GITHUB_ENV"
        export RUSTUP_TOOLCHAIN="$RUST_VERSION"
        test "$(rustc --version | cut -d' ' -f2)" = "$RUST_VERSION"
        if [ "$RUNNER_OS" = Windows ]; then
          rustc -vV | tr -d '\r' | grep -Fx 'host: x86_64-pc-windows-msvc'
        fi
        cargo --version
        cargo fmt --version
        cargo clippy --version

    - name: Cache protoc archive
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/protoc-cache-36.2
        key: ${{ runner.os }}-${{ runner.arch }}-protoc-36.2

    - name: Install protoc
      shell: bash
      env:
        PROTOC_VERSION: "36.2"
      run: |
        set -euo pipefail
        case "$RUNNER_OS-$RUNNER_ARCH" in
          Linux-X64) asset=linux-x86_64; sha256=121f6c7afe1d4d0e3ea6aab9432038599250134cbf4474cb1167d2c7decd4278 ;;
          macOS-ARM64) asset=osx-aarch_64; sha256=9cd98a532c5c5e0c4161314de0225de27e4c8a323917b6ea7b1b714d3ae23466 ;;
          macOS-X64) asset=osx-x86_64; sha256=228cc7add4616cc14ca5e80dee83209d44449a7aee95a914ae748fa374efb078 ;;
          Windows-X64) asset=win64; sha256=f0c128dc0d8492eceece83bb459a4c0e316764b929ffbf1aa416357fd644edd3 ;;
          *) echo "Unsupported runner for protoc $PROTOC_VERSION: $RUNNER_OS-$RUNNER_ARCH" >&2; exit 1 ;;
        esac
        cache_dir="$RUNNER_TEMP/protoc-cache-$PROTOC_VERSION"
        cached_archive="$cache_dir/protoc-$PROTOC_VERSION-$asset.zip"
        directory="$RUNNER_TEMP/protoc-$PROTOC_VERSION"
        archive="$directory/protoc-$PROTOC_VERSION-$asset.zip"
        archive_digest() {
          if command -v sha256sum >/dev/null; then sha256sum < "$archive"; else shasum -a 256 < "$archive"; fi | cut -d' ' -f1
        }
        rm -rf "$directory"
        mkdir -p "$directory" "$cache_dir"
        if [ -f "$cached_archive" ]; then
          cp "$cached_archive" "$archive"
          actual="$(archive_digest)"
          if [ "$actual" != "$sha256" ]; then rm -f "$cached_archive" "$archive"; fi
        fi
        if [ ! -f "$archive" ]; then
          curl --fail --silent --show-error --location --retry 3 --output "$archive" "https://github.com/protocolbuffers/protobuf/releases/download/v$PROTOC_VERSION/protoc-$PROTOC_VERSION-$asset.zip"
          actual="$(archive_digest)"
          test "$actual" = "$sha256" || { echo "protoc checksum mismatch for $asset: expected $sha256, got $actual" >&2; exit 1; }
          cp "$archive" "$cached_archive"
        fi
        if [ "$RUNNER_OS" = "Windows" ]; then
          powershell -NoProfile -Command "Expand-Archive -LiteralPath '$(cygpath -w "$archive")' -DestinationPath '$(cygpath -w "$directory")'"
          executable="$directory/bin/protoc.exe"
        else
          unzip -q "$archive" -d "$directory"
          executable="$directory/bin/protoc"
        fi
        test "$("$executable" --version | tr -d '\r')" = "libprotoc $PROTOC_VERSION"
        if [ "$RUNNER_OS" = "Windows" ]; then executable="$(cygpath -w "$executable")"; fi
        echo "PROTOC=$executable" >> "$GITHUB_ENV"

    - name: Cache sccache archive
      if: inputs.sccache == 'true'
      id: sccache-archive
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/sccache-archive-0.19.0
        key: ${{ runner.os }}-${{ runner.arch }}-sccache-archive-0.19.0

    - name: Install sccache
      if: inputs.sccache == 'true'
      shell: bash
      run: |
        set -euo pipefail
        version=0.19.0
        case "$RUNNER_OS-$RUNNER_ARCH" in
          macOS-ARM64) target=aarch64-apple-darwin; sha256=a35a0b7d622618774bc1bb8102d72562dfb21e619f88b153b370d7f89bc286af ;;
          Linux-X64) target=x86_64-unknown-linux-musl; sha256=aa73c7270c997894038c0d8f0d297865f57569e1687883322bc431713d4bb9dd ;;
          *) echo "Unsupported runner for sccache $version: $RUNNER_OS-$RUNNER_ARCH" >&2; exit 1 ;;
        esac
        name="sccache-v$version-$target"
        cache="$RUNNER_TEMP/sccache-archive-$version"
        directory="$RUNNER_TEMP/sccache-$version"
        mkdir -p "$cache" "$directory"
        archive="$cache/$name.tar.gz"
        if [ -f "$archive" ] && [ "$(shasum -a 256 < "$archive" | cut -d' ' -f1)" != "$sha256" ]; then rm -f "$archive"; fi
        if [ ! -f "$archive" ]; then
          curl --fail --silent --show-error --location --retry 3 --output "$archive" "https://github.com/mozilla/sccache/releases/download/v$version/$name.tar.gz"
        fi
        test "$(shasum -a 256 < "$archive" | cut -d' ' -f1)" = "$sha256" || { echo "sccache checksum mismatch for $target" >&2; exit 1; }
        tar -xzf "$archive" -C "$directory"
        executable="$directory/$name/sccache"
        test "$("$executable" --version)" = "sccache $version"
        echo "$(dirname "$executable")" >> "$GITHUB_PATH"
        echo "SCCACHE_DIR=$RUNNER_TEMP/sccache-store" >> "$GITHUB_ENV"

    - name: Save sccache archive
      if: inputs.sccache == 'true' && github.ref_type == 'branch' && steps.sccache-archive.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/sccache-archive-0.19.0
        key: ${{ steps.sccache-archive.outputs.cache-primary-key }}

    - name: Restore Rust dependencies and build artifacts
      if: inputs.release-cache == ''
      id: cargo-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          rust/target
        key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ inputs.cache-profile }}-v${{ hashFiles('rust/vendor/**') }}-${{ hashFiles('rust/Cargo.lock', 'rust/Cargo.toml') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-cargo-${{ inputs.cache-profile }}-v${{ hashFiles('rust/vendor/**') }}-
          ${{ runner.os }}-${{ runner.arch }}-cargo-${{ inputs.cache-profile }}-

    - name: Restore Apple Silicon release dependencies
      if: inputs.release-cache != ''
      id: release-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          rust/target/release
        key: ${{ runner.os }}-${{ runner.arch }}-cargo-desktop-release-v${{ hashFiles('rust/vendor/**') }}-${{ hashFiles('rust/Cargo.lock', 'rust/Cargo.toml') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-cargo-desktop-release-v${{ hashFiles('rust/vendor/**') }}-
          ${{ runner.os }}-${{ runner.arch }}-cargo-desktop-release-

    - name: Normalize vendored source timestamps
      if: startsWith(steps.release-cache.outputs.cache-matched-key, format('{0}-{1}-cargo-desktop-release-v{2}-', runner.os, runner.arch, hashFiles('rust/vendor/**'))) || startsWith(steps.cargo-cache.outputs.cache-matched-key, format('{0}-{1}-cargo-{2}-v{3}-', runner.os, runner.arch, inputs.cache-profile, hashFiles('rust/vendor/**')))
      shell: bash
      run: find rust/vendor -exec touch -t 200001010000 {} +

    - name: Verify Windows native build tools
      if: runner.os == 'Windows'
      shell: bash
      run: |
        set -euo pipefail
        perl='C:\Strawberry\perl\bin\perl.exe'
        executable="$(cygpath -u "$perl")"
        test -x "$executable" || { echo "Windows OpenSSL builds require the runner's Strawberry Perl at $perl" >&2; exit 1; }
        "$executable" -MIPC::Cmd -MLocale::Maketext::Simple -e 'die "Expected native Windows Perl\n" unless $^O eq "MSWin32"; print "Windows Perl $^V\n"'
        nasm -v
        printf '%s\n' "OPENSSL_SRC_PERL=$perl" "AWS_LC_SYS_PREBUILT_NASM=1" >> "$GITHUB_ENV"
