name: "Setup Bun"
description: "Setup Bun and install dependencies"
inputs:
  install-flags:
    description: "Additional flags to pass to 'bun install'"
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    # node-gyp@latest (invoked via bunx for native install scripts) requires Node >=22;
    # some runner images ship an older system Node on PATH
    - name: Setup Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: "24"

    - name: Get baseline download URL
      id: bun-url
      shell: bash
      run: |
        if [ "$RUNNER_ARCH" = "X64" ]; then
          case "$RUNNER_OS" in
            macOS)   OS=darwin ;;
            Linux)   OS=linux ;;
            Windows) OS=windows ;;
          esac
          echo "url=https://github.com/oven-sh/bun/releases/latest/download/bun-${OS}-x64-baseline.zip" >> "$GITHUB_OUTPUT"
        fi

    - name: Setup Bun
      id: bun-attempt-1
      continue-on-error: true
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: latest
        bun-download-url: ${{ steps.bun-url.outputs.url }}

    - name: Wait before retrying Bun setup
      if: steps.bun-attempt-1.outcome == 'failure'
      shell: bash
      run: sleep 30

    - name: Setup Bun (retry)
      id: bun-attempt-2
      if: steps.bun-attempt-1.outcome == 'failure'
      continue-on-error: true
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: latest
        bun-download-url: ${{ steps.bun-url.outputs.url }}

    # GitHub release-asset downloads can return HTTP 504 for longer than the retries above.
    # The npm registry publishes the same Bun version and baseline builds, so install it from there
    # and fail the job if that install or its version check fails.
    - name: Install Bun from the npm registry
      if: steps.bun-attempt-1.outcome == 'failure' && steps.bun-attempt-2.outcome == 'failure'
      shell: bash
      run: |
        set -euo pipefail
        case "$RUNNER_OS-$RUNNER_ARCH" in
          Linux-X64) package=@oven/bun-linux-x64-baseline ;;
          macOS-X64) package=@oven/bun-darwin-x64-baseline ;;
          macOS-ARM64) package=@oven/bun-darwin-aarch64 ;;
          Windows-X64) package=@oven/bun-windows-x64-baseline ;;
          *) echo "No npm Bun package for $RUNNER_OS-$RUNNER_ARCH" >&2; exit 1 ;;
        esac
        prefix="$RUNNER_TEMP/bun-npm"
        bin="$RUNNER_TEMP/bun-npm-bin"
        exe=bun
        if [ "$RUNNER_OS" = "Windows" ]; then exe=bun.exe; fi
        mkdir -p "$prefix" "$bin"
        npm install --prefix "$prefix" --no-audit --no-fund --ignore-scripts --loglevel=error "$package@latest"
        cp "$prefix/node_modules/$package/bin/$exe" "$bin/$exe"
        chmod +x "$bin/$exe"
        if [ "$RUNNER_OS" = "Windows" ]; then cp "$bin/bun.exe" "$bin/bunx.exe"; else ln -sf bun "$bin/bunx"; fi
        installed="$("$bin/$exe" --version)"
        expected="$(node -p "require(process.argv[1]).version" "$prefix/node_modules/$package/package.json")"
        test "$installed" = "$expected" || { echo "Bun $installed does not match $package@$expected" >&2; exit 1; }
        echo "Installed Bun $installed ($("$bin/$exe" --revision)) from $package"
        if [ "$RUNNER_OS" = "Windows" ]; then bin="$(cygpath -w "$bin")"; fi
        echo "$bin" >> "$GITHUB_PATH"

    - name: Keep the Bun cache on the workspace disk
      if: runner.os == 'Windows'
      shell: bash
      run: echo "BUN_INSTALL_CACHE_DIR=$RUNNER_TEMP/bun-install-cache" >> "$GITHUB_ENV"

    - name: Install setuptools for distutils compatibility
      run: python3 -m pip install setuptools || pip install setuptools || true
      shell: bash

    - name: Install dependencies
      run: |
        # Workaround for patched peer variants
        # e.g. ./patches/ for standard-openapi
        # https://github.com/oven-sh/bun/issues/28147
        if [ "$RUNNER_OS" = "Windows" ]; then
          bun install --linker hoisted ${{ inputs.install-flags }}
        else
          bun install ${{ inputs.install-flags }}
        fi
      shell: bash
