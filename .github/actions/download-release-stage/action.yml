name: Download verified release stage
description: Download immutable artifact IDs from the original staging run
inputs:
  token:
    required: true
  run-id:
    required: true
  archives:
    required: true
  checksums:
    required: true
  stage:
    required: true
  web:
    required: true
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        github-token: ${{ inputs.token }}
        run-id: ${{ inputs.run-id }}
        artifact-ids: ${{ inputs.archives }}
        digest-mismatch: error
        merge-multiple: true
        path: archives
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        github-token: ${{ inputs.token }}
        run-id: ${{ inputs.run-id }}
        artifact-ids: ${{ inputs.checksums }}
        digest-mismatch: error
        merge-multiple: true
        path: checksums
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        github-token: ${{ inputs.token }}
        run-id: ${{ inputs.run-id }}
        artifact-ids: ${{ inputs.stage }}
        digest-mismatch: error
        merge-multiple: true
        path: stage
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        github-token: ${{ inputs.token }}
        run-id: ${{ inputs.run-id }}
        artifact-ids: ${{ inputs.web }}
        digest-mismatch: error
        merge-multiple: true
        path: apps/web/dist
