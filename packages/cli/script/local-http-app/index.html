<!doctype html>
<html lang="en">
  <head>

    <title>App preview</title>
    <style id="shared">:root {
  color-scheme: light dark;
  --yc-green-strong: #0a7b47;
  --yc-primary-bg: #0b8550;
  --yc-primary-fg: #ffffff;
  --yc-danger: #c53a3a;
  --yc-focus: #0b8b50;
  --yc-bg: #ffffff;
  --yc-surface: #f7f9f8;
  --yc-surface-sunken: #eff3f1;
  --yc-surface-raised: #ffffff;
  --yc-text: #0b0f14;
  --yc-text-muted: #5c6672;
  --yc-text-subtle: #646d78;
  --yc-border: #e4e8e6;
  --yc-border-strong: #78847e;
  --yc-font-sans: "Geist", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --yc-font-mono: "Geist Mono", ui-monospace, "SFMono-Regular", "JetBrains Mono", Menlo, monospace;
  --yc-size-xs: 13px;
  --yc-leading-xs: 20px;
  --yc-size-sm: 14px;
  --yc-leading-sm: 22px;
  --yc-size-md: 16px;
  --yc-leading-md: 26px;
  --yc-size-lg: 18px;
  --yc-leading-lg: 28px;
  --yc-size-2xl: 24px;
  --yc-leading-2xl: 32px;
  --yc-weight-regular: 400;
  --yc-weight-medium: 500;
  --yc-weight-semibold: 600;
  --yc-space-1: 4px;
  --yc-space-2: 8px;
  --yc-space-3: 12px;
  --yc-space-4: 16px;
  --yc-space-6: 24px;
  --yc-radius-sm: 6px;
  --yc-radius-md: 10px;
  --yc-radius-lg: 14px;
  --yc-control-h: 44px;
  --yc-control-pad-x: 16px;
  --yc-border-width: 1px;
  --yc-measure: 68ch;
  --yc-gutter: 16px;
  --yc-focus-ring: 0 0 0 2px var(--yc-bg), 0 0 0 4px var(--yc-focus);
}

@media (prefers-color-scheme: dark) {
  :root {
    --yc-green-strong: #4ee29b;
    --yc-primary-bg: #4ee29b;
    --yc-primary-fg: #04150c;
    --yc-danger: #ef6f6f;
    --yc-focus: #4ee29b;
    --yc-bg: #0b1115;
    --yc-surface: #11181d;
    --yc-surface-sunken: #0e151a;
    --yc-surface-raised: #151e24;
    --yc-text: #f4f7f6;
    --yc-text-muted: #99a2ad;
    --yc-text-subtle: #7d8792;
    --yc-border: #263039;
    --yc-border-strong: #718278;
  }
}

@media (min-width: 640px) {
  :root {
    --yc-gutter: 24px;
  }
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--yc-bg);
  color: var(--yc-text);
  font-family: var(--yc-font-sans);
  font-size: var(--yc-size-md);
  font-weight: var(--yc-weight-regular);
  line-height: var(--yc-leading-md);
}

h1,
h2,
h3,
p,
ul,
ol {
  margin: 0;
  padding: 0;
}

h1,
h2,
h3 {
  font-weight: var(--yc-weight-semibold);
}

.switch {
  display: flex;
  flex-wrap: wrap;
  gap: var(--yc-space-2);
}

.switch button,
.action {
  min-width: var(--yc-control-h);
  min-height: var(--yc-control-h);
  padding: 0 var(--yc-control-pad-x);
  border: var(--yc-border-width) solid var(--yc-border-strong);
  border-radius: var(--yc-radius-md);
  background: var(--yc-surface-raised);
  color: var(--yc-text);
  font: inherit;
  font-size: var(--yc-size-sm);
  font-weight: var(--yc-weight-medium);
  line-height: var(--yc-leading-sm);
  cursor: pointer;
}

.switch button:hover,
.action:hover {
  background: var(--yc-surface-sunken);
}

.switch button[aria-pressed="true"] {
  border-color: var(--yc-primary-bg);
  background: var(--yc-primary-bg);
  color: var(--yc-primary-fg);
  font-weight: var(--yc-weight-semibold);
}

.switch button[aria-pressed="true"]::before {
  content: "\2713\00a0";
}

.action[aria-disabled="true"] {
  border-style: dashed;
  background: var(--yc-surface);
  color: var(--yc-text-subtle);
  cursor: not-allowed;
}

.switch button:focus-visible,
.action:focus-visible {
  outline: 2px solid transparent;
  outline-offset: 2px;
  box-shadow: var(--yc-focus-ring);
}
@media (prefers-reduced-motion: reduce) {
  * {
    animation: none;
    scroll-behavior: auto;
    transition: none;
  }
}</style>
    <style id="page">
      :root { scrollbar-color: var(--yc-border-strong) var(--yc-surface); scrollbar-width: thin; }
      ::selection { background: var(--yc-primary-bg); color: var(--yc-primary-fg); }
      main { display: grid; gap: var(--yc-space-6); max-width: var(--yc-measure); margin: 0 auto; padding: var(--yc-space-6) var(--yc-gutter); min-width: 0; }
      h1 { font-size: var(--yc-size-2xl); line-height: var(--yc-leading-2xl); }
      #status, .note { font-size: var(--yc-size-sm); line-height: var(--yc-leading-sm); overflow-wrap: anywhere; }
      #status { border-left: var(--yc-space-1) solid var(--yc-border-strong); padding: var(--yc-space-3); background: var(--yc-surface); }
      #status[data-state="expired"], #status[data-state="revoked"], #status[data-state="unavailable"] { border-color: var(--yc-danger); }
      .note { color: var(--yc-text-muted); }
      .action { justify-self: start; appearance: none; }
      .action:active { background: var(--yc-surface-sunken); }
      #frame-region { min-width: 0; height: 480px; border: var(--yc-border-width) solid var(--yc-border-strong); border-radius: var(--yc-radius-md); background: var(--yc-surface); }
      #preview { display: block; width: 100%; height: 100%; border: 0; border-radius: var(--yc-radius-md); }
    </style>
  </head>
  <body>
    <main>
      <h1>App preview</h1>
      <p id="status" role="status" aria-live="polite" data-state="pending">Pending initialization.</p>
      <button id="refresh" class="action" type="button" disabled aria-disabled="true">Refresh</button>
      <p class="note">HTTP-only preview. WebSocket and SSE connections are unsupported. The page below belongs to the registered app.</p>
      <div id="frame-region"></div>
    </main>
    <script id="preview-policy" type="application/json">[]</script>
    <script>(() => {
  // script/mcp-app/bridge.js
  var bridgeProtocolVersion = "2026-01-26";

  class McpAppBridgeError extends Error {
    constructor(code, message, hostMessage) {
      super(message);
      this.name = "McpAppBridgeError";
      this.code = code;
      if (hostMessage !== undefined)
        this.hostMessage = hostMessage;
    }
  }
  var bounded = (value) => typeof value === "string" && value ? value.slice(0, 64) : undefined;
  var record = (value) => typeof value === "object" && value !== null && !Array.isArray(value);
  function createMcpAppBridge(options = {}) {
    const self = options.window ?? globalThis.window;
    const parent = options.parent ?? self?.parent;
    const appInfo = options.appInfo ?? { name: "ycoding-mcp-app", version: "0.0.0" };
    const allowedTools = new Set(options.allowedTools ?? []);
    const initializeTimeoutMs = options.initializeTimeoutMs ?? 3000;
    const requestTimeoutMs = options.requestTimeoutMs ?? 1e4;
    const onToolResult = typeof options.onToolResult === "function" ? options.onToolResult : undefined;
    let state = "idle";
    let hostOrigin;
    let hostInfo;
    let nextID = 1;
    let initializePromise;
    const pending = new Map;
    const bufferedToolResults = [];
    const fail = (code, message, hostMessage) => new McpAppBridgeError(code, message, hostMessage);
    const targetOrigin = () => hostOrigin && hostOrigin !== "null" ? hostOrigin : "*";
    const post = (message) => parent.postMessage(message, targetOrigin());
    function settle(entry, action) {
      if (!pending.delete(entry.id))
        return;
      clearTimeout(entry.timer);
      entry.signal?.removeEventListener("abort", entry.onAbort);
      action();
    }
    function request(method, params, timeoutMs, signal) {
      const id = nextID++;
      return new Promise((resolve, reject) => {
        const entry = { id, resolve, reject, signal, timer: undefined, onAbort: undefined };
        entry.timer = setTimeout(() => settle(entry, () => reject(fail("timeout", "The host did not answer in time."))), timeoutMs);
        entry.onAbort = () => settle(entry, () => reject(fail("aborted", "The request was cancelled.")));
        if (signal) {
          if (signal.aborted) {
            clearTimeout(entry.timer);
            reject(fail("aborted", "The request was cancelled."));
            return;
          }
          signal.addEventListener("abort", entry.onAbort, { once: true });
        }
        pending.set(id, entry);
        post({ jsonrpc: "2.0", id, method, params });
      });
    }
    function deliverToolResult(params) {
      if (state === "disposed")
        return;
      if (state !== "initialized") {
        bufferedToolResults.push(params);
        return;
      }
      onToolResult?.(params);
    }
    function onMessage(event) {
      if (state === "disposed")
        return;
      if (!parent || event.source !== parent)
        return;
      if (hostOrigin !== undefined && event.origin !== hostOrigin)
        return;
      const data = event.data;
      if (!record(data) || data.jsonrpc !== "2.0")
        return;
      if (data.method === "ui/notifications/tool-result" && data.id === undefined) {
        if (record(data.params))
          deliverToolResult(data.params);
        return;
      }
      if (data.method !== undefined)
        return;
      const entry = pending.get(data.id);
      if (!entry)
        return;
      const hasResult = "result" in data;
      const hasError = "error" in data;
      if (hasResult === hasError) {
        settle(entry, () => entry.reject(fail("invalid-result", "The host answer was not a valid result.")));
        return;
      }
      if (hasError) {
        const message = record(data.error) ? bounded(data.error.message) : undefined;
        settle(entry, () => entry.reject(fail("rejected", "The host rejected the request.", message)));
        return;
      }
      if (hostOrigin === undefined)
        hostOrigin = typeof event.origin === "string" ? event.origin : "";
      settle(entry, () => entry.resolve(data.result));
    }
    self?.addEventListener("message", onMessage);
    function initialize() {
      if (state === "disposed")
        return Promise.reject(fail("disposed", "This app connection is closed."));
      if (initializePromise)
        return initializePromise;
      if (!self || !parent || parent === self) {
        state = "failed";
        return Promise.reject(fail("not-embedded", "No host window. This document is not embedded."));
      }
      state = "pending";
      initializePromise = request("ui/initialize", { protocolVersion: bridgeProtocolVersion, appInfo: { name: bounded(appInfo.name) ?? "ycoding-mcp-app", version: bounded(appInfo.version) ?? "0.0.0" }, appCapabilities: {} }, initializeTimeoutMs).then((result) => {
        if (state === "disposed")
          throw fail("disposed", "This app connection is closed.");
        if (!record(result)) {
          state = "failed";
          throw fail("invalid-result", "The host answered ui/initialize without a result.");
        }
        if (result.protocolVersion !== bridgeProtocolVersion) {
          state = "failed";
          const error = fail("protocol-mismatch", "The host selected an unsupported protocol version.");
          error.hostProtocolVersion = bounded(result.protocolVersion);
          throw error;
        }
        const info = record(result.hostInfo) ? result.hostInfo : {};
        hostInfo = { name: bounded(info.name), version: bounded(info.version) };
        state = "initialized";
        post({ jsonrpc: "2.0", method: "ui/notifications/initialized" });
        for (const params of bufferedToolResults.splice(0))
          onToolResult?.(params);
        return hostInfo;
      }, (error) => {
        if (state !== "disposed")
          state = "failed";
        throw error;
      });
      return initializePromise;
    }
    function callTool(name, args = {}, callOptions = {}) {
      if (state === "disposed")
        return Promise.reject(fail("disposed", "This app connection is closed."));
      if (!allowedTools.has(name))
        return Promise.reject(fail("tool-not-allowed", "This app may not call that tool."));
      if (state !== "initialized")
        return Promise.reject(fail("unavailable", "The host connection is not initialized."));
      if (!record(args))
        return Promise.reject(fail("unavailable", "Tool arguments must be an object."));
      return request("tools/call", { name, arguments: args }, requestTimeoutMs, callOptions.signal);
    }
    function dispose() {
      if (state === "disposed")
        return;
      state = "disposed";
      self?.removeEventListener("message", onMessage);
      bufferedToolResults.length = 0;
      for (const entry of [...pending.values()])
        settle(entry, () => entry.reject(fail("disposed", "This app connection is closed.")));
    }
    return {
      get state() {
        return state;
      },
      get hostInfo() {
        return hostInfo;
      },
      initialize,
      callTool,
      dispose
    };
  }

  // script/local-http-app/model.js
  var record2 = (value) => value !== null && typeof value === "object" && !Array.isArray(value);
  var identity = (value) => typeof value === "string" && value.length > 0 && value.length <= 256 && !/[\s\x00-\x1f]/.test(value);
  var statuses = new Set(["ready", "unavailable", "expired", "revoked"]);
  var reasons = new Set(["preview_unconfigured", "not_registered", "access_unavailable", "expired", "revoked"]);
  var fields = new Set(["kind", "version", "appID", "sessionID", "expiresAt", "status", "reason"]);
  function approvedOrigin(value) {
    if (typeof value !== "string" || value.includes("*") || !URL.canParse(value))
      return false;
    const url = new URL(value);
    return url.origin === value && !url.username && !url.password && !url.hash && !url.search && (url.protocol === "https:" || url.protocol === "http:" && ["127.0.0.1", "localhost"].includes(url.hostname) && !!url.port);
  }
  function parsePreviewPolicy(text) {
    try {
      const value = JSON.parse(text);
      return Array.isArray(value) && value.every(approvedOrigin) ? value : [];
    } catch {
      return [];
    }
  }
  function validatePreview(result, policy, now = Date.now()) {
    if (!record2(result) || result.isError === true || !record2(result.structuredContent))
      return;
    const value = result.structuredContent;
    if (Object.keys(value).some((key) => !fields.has(key)) || value.kind !== "local-http-app" || value.version !== 1 || !identity(value.appID) || !identity(value.sessionID) || !statuses.has(value.status) || value.reason !== undefined && !reasons.has(value.reason))
      return;
    if (value.expiresAt === null && value.status === "unavailable")
      return { appID: value.appID, sessionID: value.sessionID, expiresAt: null, status: value.status };
    if (typeof value.expiresAt !== "string")
      return;
    const expires = Date.parse(value.expiresAt);
    if (!Number.isFinite(expires) || new Date(expires).toISOString() !== value.expiresAt)
      return;
    const status = value.status === "ready" && expires <= now ? "expired" : value.status;
    const lease = { appID: value.appID, sessionID: value.sessionID, expiresAt: value.expiresAt, status };
    if (status !== "ready")
      return lease;
    if (!Array.isArray(policy) || policy.length === 0 || !policy.every(approvedOrigin))
      return;
    if (result._meta === undefined || record2(result._meta) && result._meta.localApp === undefined)
      return lease;
    const local = result._meta?.localApp;
    if (!record2(local) || !approvedOrigin(local.origin) || !policy.includes(local.origin) || typeof local.url !== "string" || local.url.length > 8192 || !URL.canParse(local.url))
      return;
    const url = new URL(local.url);
    if (!local.url.startsWith(`${local.origin}/_ycoding/bootstrap?`) || url.origin !== local.origin || url.pathname !== "/_ycoding/bootstrap" || url.username || url.password || local.url.includes("#") || [...url.searchParams.keys()].length !== 1 || !url.searchParams.has("ticket") || !/^[A-Za-z0-9_-]{1,2048}$/.test(url.searchParams.get("ticket")))
      return;
    return { ...lease, url: local.url };
  }

  // script/local-http-app/client.js
  var status = document.querySelector("#status");
  var refresh = document.querySelector("#refresh");
  var region = document.querySelector("#frame-region");
  var policy = parsePreviewPolicy(document.querySelector("#preview-policy").textContent);
  var lease;
  var frame;
  var timer;
  var revision = 0;
  var refreshing = false;
  var disposed = false;
  var bridge = createMcpAppBridge({
    appInfo: { name: "ycoding-local-http-app", version: "1" },
    allowedTools: ["local_app_status"],
    onToolResult: apply
  });
  function show(state, text) {
    status.dataset.state = state;
    status.textContent = text;
    refresh.disabled = disposed || refreshing || bridge.state !== "initialized" || !lease || Date.parse(lease.expiresAt) <= Date.now() || lease.status === "revoked" || lease.status === "expired";
    refresh.setAttribute("aria-disabled", String(refresh.disabled));
  }
  function removeFrame() {
    frame?.remove();
    frame = undefined;
    clearTimeout(timer);
  }
  function expiry() {
    clearTimeout(timer);
    const remaining = Date.parse(lease.expiresAt) - Date.now();
    if (remaining > 0) {
      timer = setTimeout(expiry, Math.min(remaining, 2147483647));
      return;
    }
    revision++;
    lease = { ...lease, status: "expired" };
    removeFrame();
    show("expired", "Expired. Request a new app preview.");
  }
  function apply(result) {
    if (disposed)
      return;
    revision++;
    refreshing = false;
    const next = validatePreview(result, policy);
    const same = next && lease && next.appID === lease.appID && next.sessionID === lease.sessionID && next.expiresAt === lease.expiresAt;
    if (!next) {
      lease = undefined;
      removeFrame();
      show("unavailable", "Preview unavailable. Request a new app preview.");
      return;
    }
    const { url, ...current } = next;
    lease = current;
    if (next.status !== "ready") {
      removeFrame();
      show(next.status, next.status === "expired" ? "Expired. Request a new app preview." : next.status === "revoked" ? "Revoked. App access has ended." : "Preview unavailable. Refresh to check access.");
      return;
    }
    if (same && frame) {
      expiry();
      show(frame.dataset.loaded === "true" ? "loaded" : "pending", frame.dataset.loaded === "true" ? "Frame loaded; app response not verified." : "Pending app frame.");
      return;
    }
    removeFrame();
    if (!url) {
      show("unavailable", "Preview unavailable. Request a new app preview.");
      return;
    }
    frame = document.createElement("iframe");
    frame.id = "preview";
    frame.setAttribute("aria-label", "App preview");
    frame.setAttribute("sandbox", "allow-scripts allow-same-origin allow-forms");
    frame.setAttribute("referrerpolicy", "no-referrer");
    frame.addEventListener("load", (event) => {
      if (disposed || event.target !== frame)
        return;
      if (Date.parse(lease.expiresAt) <= Date.now())
        return expiry();
      frame.dataset.loaded = "true";
      show("loaded", "Frame loaded; app response not verified.");
    });
    frame.src = url;
    show("pending", "Pending app frame.");
    region.append(frame);
    expiry();
  }
  refresh.addEventListener("click", async () => {
    if (refresh.disabled)
      return;
    const requested = revision;
    refreshing = true;
    show("pending", "Checking app access.");
    try {
      const result = await bridge.callTool("local_app_status", { sessionID: lease.sessionID, input: { id: lease.appID } });
      if (!disposed && requested === revision)
        apply(result);
    } catch {
      if (disposed || requested !== revision)
        return;
      refreshing = false;
      removeFrame();
      show("unavailable", "Preview unavailable. Refresh to check access.");
    }
  });
  window.addEventListener("pagehide", () => {
    disposed = true;
    revision++;
    removeFrame();
    bridge.dispose();
    show("unavailable", "Preview unavailable. This app connection is closed.");
  }, { once: true });
  bridge.initialize().then(() => {
    if (!disposed && !lease)
      show("pending", "Pending initialization: waiting for an app preview.");
  }).catch(() => {
    if (!disposed) {
      removeFrame();
      show("unavailable", "Preview unavailable. The host connection could not initialize.");
    }
  });
})();</script>
