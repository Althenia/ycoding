[package]
name = "cca-noise-reference"
version = "0.1.0"
edition = "2021"

[dependencies]
base64 = "0.22.1"
clatter = { version = "=2.2.0", default-features = false, features = [
    "std",
    "alloc",
    "getrandom",
    "use-25519",
    "use-aes-gcm",
    "use-rust-crypto-ml-kem",
    "use-sha",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
