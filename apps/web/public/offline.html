<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>YCoding is offline</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --surface: #f7f9f8;
        --text: #0b0f14;
        --muted: #5c6672;
        --border: #e4e8e6;
        --green: #0a7b47;
        --action-bg: #0b8550;
        --action-ink: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b1115;
          --surface: #11181d;
          --text: #f4f7f6;
          --muted: #99a2ad;
          --border: #263039;
          --green: #4ee29b;
          --action-bg: #4ee29b;
          --action-ink: #04150c;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 24px;
        min-height: 60px;
        padding: 8px 24px;
        border-bottom: 1px solid var(--border);
      }
      .brand {
        font-size: 16px;
        font-weight: 700;
        color: var(--text);
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
      }
      a {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        color: var(--muted);
        text-decoration: none;
      }
      a:hover {
        color: var(--green);
        text-decoration: underline;
      }
      a:focus-visible {
        outline: 2px solid var(--green);
        outline-offset: 3px;
      }
      main {
        display: flex;
        flex-direction: column;
        max-width: 672px;
        min-height: 400px;
        margin: 48px auto;
        padding: 32px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--surface);
      }
      .status {
        padding-bottom: 16px;
        margin: 0 0 24px;
        border-bottom: 1px solid var(--border);
        color: var(--green);
        font: 12px/1.5 ui-monospace, monospace;
        letter-spacing: 0.06em;
      }
      .offline-icon {
        display: grid;
        width: 48px;
        height: 48px;
        place-items: center;
        margin-bottom: 20px;
        border: 1px solid var(--border);
        border-radius: 6px;
        color: var(--green);
      }
      h1 {
        font-size: 20px;
        line-height: 28px;
        margin: 0 0 12px;
      }
      p {
        color: var(--muted);
        margin: 0 0 12px;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 20px;
      }
      .retry {
        justify-content: center;
        padding: 0 24px;
        background: var(--action-bg);
        color: var(--action-ink);
        border-radius: 10px;
        font: 14px/1.5 ui-monospace, monospace;
      }
      .retry:hover {
        color: var(--action-ink);
      }
      @media (max-width: 767px) {
        header {
          padding-inline: 16px;
          gap: 8px 16px;
        }
        nav {
          gap: 12px;
          font-size: 12px;
        }
        main {
          min-height: calc(100svh - 140px);
          margin: 16px;
          padding: 24px;
        }
        .actions {
          margin-top: auto;
          padding-top: 32px;
        }
        .retry {
          width: 100%;
        }
      }
      @media (max-width: 479px) {
        main {
          margin-inline: 0;
        }
      }
      @media (min-width: 640px) and (max-width: 1023px) {
        main {
          max-width: none;
          margin-inline: 24px;
        }
        h1 {
          font-size: 18px;
          line-height: 27px;
        }
      }
      @media (min-width: 768px) and (max-width: 1023px) {
        main {
          display: grid;
          grid-template-columns: 48px minmax(0, 1fr);
          gap: 8px 20px;
          min-height: 0;
          padding: 24px;
        }
        .status {
          grid-column: 1 / -1;
          margin-bottom: 16px;
          padding-bottom: 8px;
        }
        .offline-icon {
          grid-column: 1;
          grid-row: 2 / span 3;
          margin-bottom: 0;
        }
        h1 {
          grid-column: 2;
          grid-row: 2;
          align-self: end;
          margin-bottom: 0;
        }
        main p:not(.status) {
          grid-column: 2;
          margin-bottom: 0;
        }
        .actions {
          grid-column: 1 / -1;
          margin-top: 0;
        }
      }
      @media (min-width: 1024px) {
        main {
          min-height: 420px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="brand" href="/">YCoding</a>
      <nav aria-label="Public navigation">
        <a href="/">Home</a>
        <a href="/docs">Documentation</a>
        <a href="/changelog">Changelog</a>
      </nav>
    </header>
    <main class="offline-card" aria-labelledby="offline-title">
      <p class="status">OFFLINE</p>
      <div class="offline-icon" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 2l20 20M8.5 16.5a5 5 0 0 1 7 0M12 20h.01M5 12a10 10 0 0 1 5-2.7M9 5.3a16 16 0 0 1 13 3.3M2 8.6a16 16 0 0 1 3.2-2.1M16 10a10 10 0 0 1 3 2" />
        </svg>
      </div>
      <h1 id="offline-title">You are offline</h1>
      <p>Connect to the internet to use the remote workspace.</p>
      <p>Nothing is queued or sent while offline.</p>
      <div class="actions">
        <a class="retry" href="/remote">Retry</a>
      </div>
    </main>
  </body>
</html>
