[preset.0]

name="macOS"
platform="macOS"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*, tools/*"
export_path="../../dist/office/ycoding-office.zip"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

export/distribution_type=0
binary_format/architecture="universal"
application/bundle_identifier="ai.ycoding.office"
; The preset carries its own icon: a project-level icon alone does not reach the
; exported bundle when the preset is what the export reads.
application/icon="res://office/art/icon_512.png"
; Left empty on purpose: an empty value inherits the project version, so the
; release build script is the single place a version is set. A literal here would
; ship a build whose identity disagrees with its filename.
application/version=""
application/short_version=""
application/signature=""
application/app_category="public.app-category.developer-tools"
debug/export_console_wrapper=1
; Signing and notarization stay off until a Developer ID certificate and
; notarization credentials are supplied. Enabling these without them fails the
; export rather than producing an ad-hoc build.
codesign/codesign=0
notarization/notarization=0

